<!-- Fully offline: React, ReactDOM and Babel standalone are vendored, no CDN. Babel compiles the
     type="text/babel" screens below in the browser; there is deliberately no Node build step.
     Every text/babel tag carries data-presets="react" data-plugins="transform-block-scoping":
     without them babel-standalone uses react + env with no targets (a full ES5 downlevel), which
     made the in-browser compile about 5x slower. JSX is the only syntax that needs compiling for a
     current browser; block scoping turns top-level const/let into var, because every file runs as
     a classic script in one global scope and a second top-level `const X` would otherwise throw.
     New tags need the same two attributes (tools/check-jsx.js fails without them). -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<!-- Compiled design-system component bundle (window.PatchDesignSystem_5432c9). It also carries stale
     compiled copies of the screens below; those get overwritten by the real files that load after it,
     so keep this load order. -->
<script src="_ds_bundle.js"></script>

<style>html,body{height:100%;margin:0;overflow:hidden}#root{height:100vh}</style>
</head><body>
