            type: string
          method:
            const: functions.show.item.resize
          params:
            type: object
            required:
            - showId
            - itemId
            - duration
            - baseRevision
            properties:
              showId:
                type: string
              itemId:
                type: string
              duration:
                type: integer
                description: New duration in ms; rejected with error.code INVALID_PARAMS (not CONFLICT
                  - that code is reserved for baseRevision mismatches per 00-conventions.md §7) if it
                  would overlap a following item. This only changes the ShowFunction wrapper's own duration/trim
                  on the timeline (equivalent to the real editor's "stretch" toggle being off) - it has
                  no counterpart to the real editor's stretch-resize mode (ShowManager.stretchFunctions),
                  which instead proportionally rescales an underlying Chaser's per-step durations (converting
                  its speed mode from Common to PerStep as needed, see ShowManager::convertChaserCommonToPerStep)
                  so the Chaser's own content stretches to fill the new timeline duration rather than
                  being trimmed/looped. A client wanting that behavior must replicate it itself via functions.chaser.setSpeedModes
                  plus per-step duration writes.
