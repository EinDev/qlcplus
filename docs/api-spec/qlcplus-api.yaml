            description: Broadcast whenever the recent-files list changes (after a successful open, or
              a save/saveAs to a new path). This list is global engine/app state persisted outside the
              document (QSettings, not the .qxw file) - it is not part of docRevision.
            properties:
              files:
                type: array
                items:
                  $ref: '#/components/schemas/CoreRecentFileEntry'
    CoreModeGetRequest:
