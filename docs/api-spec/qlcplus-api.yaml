              sessionId:
                type: string
              baseRevision:
                type: integer
              channelId:
                type: string
              min:
                type: integer
                minimum: 0
                maximum: 255
              max:
                type: integer
                minimum: 0
                maximum: 255
              name:
                type: string
    FixtureDefsCapabilityAddResponse:
      payload:
        oneOf:
        - type: object
          required:
          - type
          - id
          - ok
          - result
          properties:
            type:
              const: response
            id:
              type: string
            ok:
              const: true
            result:
              allOf:
              - $ref: '#/components/schemas/FixtureDefsSessionMutationResult'
              - type: object
                required:
                - capabilityIndex
                properties:
                  capabilityIndex:
                    type: integer
                    description: Position within the channel's capability list. Capabilities have no engine-level
