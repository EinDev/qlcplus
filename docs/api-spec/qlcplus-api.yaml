    FixtureDefsDeleteRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: fixturedefs.delete
          params:
            type: object
            required:
            - manufacturer
            - model
            - baseRevision
            description: 'Deletes a definition from the shared library. Two things a server implementer
              must know that the engine doesn''t spell out: (1) QLCFixtureDefCache has NO removal method
              at all (engine/src/qlcfixturedefcache.h only exposes addFixtureDef/ storeFixtureDef/reloadFixtureDef/reloadOrAddFixtureDef
              — there is no removeFixtureDef counterpart, for user OR system definitions), so the server
              must implement deletion itself: delete the definition''s source .qxf file from disk (only
              possible/meaningful for a user definition — QLCFixtureDef:: isUser()) and drop it from the
              in-memory cache list. (2) A bundled/system definition (isUser:false) can never be deleted
              this way — its file lives in the read-only system fixtures directory, and there is no engine
              concept of "hide/disable a system definition" either. For isUser:false, the server MUST
              reject with error.code FIXTUREDEFS_SYSTEM_READONLY (the same code fixturedefs.save uses
              when a session opened from a system definition hasn''t been forked via fixturedefs.session.forkToUser
              first — see that method''s description). Deleting a definition still in use by a patched
              fixture in the current project is also undefined at the engine level; a conservative server
              should reject that case too (e.g. NOT_FOUND-adjacent FIXTUREDEFS_IN_USE) rather than leave
              a Fixture with a dangling definition reference.'
            properties:
              manufacturer:
                type: string
              model:
                type: string
              baseRevision:
                type: integer
                description: defRevision this client last observed for this manufacturer/model.
