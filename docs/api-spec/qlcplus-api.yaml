      properties:
        family:
          type: string
        pointSize:
          type: number
        bold:
          type: boolean
        italic:
          type: boolean
        underline:
          type: boolean
    VcWidgetStyle:
      type: object
      description: VCWidget appearance block (KXMLQLCVCWidgetAppearance) - every field null/absent means
        "use the platform/theme default".
      properties:
        caption:
          type: string
        backgroundColor:
          type:
          - string
          - 'null'
          description: Hex or null for the default (no custom color).
        backgroundImage:
          type:
          - string
          - 'null'
          description: Path/resource or null for none.
        foregroundColor:
          type:
          - string
          - 'null'
        font:
          $ref: '#/components/schemas/VcFont'
    VcWidgetSummary:
      type: object
      description: Compact form used in list/usage results and as the base of VcWidgetDetail.
      required:
      - id
      - widgetType
      - page
      - geometry
      - zIndex
      - allowResize
      - isDisabled
      - isVisible
      - style
      properties:
        id:
          type: string
        widgetType:
          $ref: '#/components/schemas/VcWidgetType'
        page:
          type: integer
        parentId:
          type: string
          description: Containing Frame/SoloFrame widget ID, absent when placed directly on the page root.
        geometry:
          $ref: '#/components/schemas/VcGeometry'
        zIndex:
          type: integer
        allowResize:
          type: boolean
        isDisabled:
          type: boolean
        isVisible:
          type: boolean
        style:
          $ref: '#/components/schemas/VcWidgetStyle'
    VcWidgetDetail:
      allOf:
      - $ref: '#/components/schemas/VcWidgetSummary'
      - type: object
        required:
        - typeConfig
        properties:
          typeConfig:
            description: Type-specific config, discriminated by VcWidgetSummary.widgetType (NOT a self-describing
              union - none of these branches carry a type tag or a required field unique to it, e.g. a
              bare Frame config also satisfies VcSoloFrameConfig, so this is intentionally anyOf rather
              than oneOf; a strict oneOf validator would reject every payload here). Interpret the object
              per widgetType, not by schema-matching. Label's type has no dedicated Config schema (kept
              as an empty object, per the original {} case) - all others reference their existing Vc<Type>Config
              schema directly.
            anyOf:
            - $ref: '#/components/schemas/VcButtonConfig'
            - $ref: '#/components/schemas/VcSliderConfig'
            - $ref: '#/components/schemas/VcXyPadConfig'
            - $ref: '#/components/schemas/VcFrameConfig'
            - $ref: '#/components/schemas/VcSoloFrameConfig'
            - $ref: '#/components/schemas/VcClockConfig'
            - $ref: '#/components/schemas/VcCueListConfig'
            - $ref: '#/components/schemas/VcSpeedDialConfig'
            - $ref: '#/components/schemas/VcAnimationConfig'
            - $ref: '#/components/schemas/VcAudioTriggersConfig'
            - type: object
              maxProperties: 0
              description: 'Label: no type-specific config.'
          inputSources:
            type: array
            items:
              $ref: '#/components/schemas/VcInputSource'
          keySequences:
            type: array
            items:
              type: object
              required:
              - keySequence
              - controlId
              properties:
                keySequence:
                  type: string
                controlId:
                  type: integer
          externalControls:
            type: array
            description: VCWidget::externalControlsList() - the named controls this widget instance exposes
              for input-source/key-sequence binding.
            items:
              type: object
              required:
              - controlId
              - name
              - allowKeyboard
              properties:
                controlId:
                  type: integer
                name:
                  type: string
                allowKeyboard:
                  type: boolean
    VcInputSource:
      type: object
      required:
      - controlId
      - universe
      - channel
      properties:
        controlId:
          type: integer
        universe:
          type: integer
        channel:
          type: integer
          description: 'QLCInputSource::channel() - the COMPOSITED value, not the bare DMX channel: bits
            0-15 are the actual channel, bits 16-31 are the multipage Frame''s page number (VCPage/VCFrame::remapInputSources()
            calls QLCInputSource::setPage(), which folds the page into these upper bits: channel = (page
            << 16) | bareChannel). This only matters for a widget living inside a multi-page VCFrame (see
            VcFrameConfig.multiPageMode) - for a widget on a single-page frame or the page root, page
            is 0 and this equals the bare channel. To read/write just the DMX channel, mask with 0x0000FFFF;
            to read/write just the page, shift right 16 bits.'
        lowerValue:
          type: integer
        upperValue:
          type: integer
        monitorValue:
          type: integer
        lowerChannel:
          type: integer
          description: See VcWidgetInputSourceSetRequest.params.lowerChannel - absent when not overridden.
        upperChannel:
          type: integer
          description: See VcWidgetInputSourceSetRequest.params.upperChannel - absent when not overridden.
        monitorChannel:
          type: integer
          description: See VcWidgetInputSourceSetRequest.params.monitorChannel - absent when not overridden.
    VcPage:
      type: object
      required:
      - index
      - name
      properties:
        index:
          type: integer
        name:
          type: string
        hasPin:
          type: boolean
          description: Whether a protection PIN is set - the PIN value itself is never returned.
    VcButtonConfig:
      type: object
      description: VCButton document-state config.
      properties:
        functionID:
          type: string
        actionType:
          type: string
          enum:
          - Toggle
          - Flash
          - Blackout
          - StopAll
        stopAllFadeOutTime:
          type: integer
          description: ms, only meaningful for actionType=StopAll.
        startupIntensityEnabled:
          type: boolean
        startupIntensity:
          type: number
          minimum: 0
          maximum: 1
        flashOverrides:
          type: boolean
        flashForceLTP:
          type: boolean
    VcSliderConfig:
      type: object
      description: VCSlider document-state config.
      properties:
        widgetStyle:
          type: string
          enum:
          - Slider
          - Knob
        valueDisplayStyle:
          type: string
          enum:
          - DMXValue
          - PercentageValue
        invertedAppearance:
          type: boolean
        sliderMode:
          type: string
          enum:
          - Level
          - Adjust
          - Submaster
          - GrandMaster
        catchValues:
          type: boolean
          description: Whether external-controller input must "catch up" to the slider's current value
            before taking control.
        rangeLowLimit:
          type: number
        rangeHighLimit:
          type: number
        monitorEnabled:
          type: boolean
          description: Level mode only.
        levelChannels:
          type: array
          description: Level mode only - see vc.slider.setLevelChannels (its own message, since it changes
            frequently and independently of other config).
          items:
            type: object
            required:
            - fixtureId
            - channel
            properties:
              fixtureId:
                type: string
              channel:
                type: integer
        controlledFunction:
          type: string
          description: Adjust mode only.
        controlledAttribute:
          type: integer
          description: Adjust mode only - index into the controlled Function's attributes.
        adjustFlashEnabled:
          type: boolean
          description: Adjust mode only.
        clickAndGoType:
          type: string
          enum:
          - None
          - Colors
          - Preset
        cngPrimaryColor:
          type: string
        cngSecondaryColor:
          type: string
        grandMasterValueMode:
          type: string
          enum:
          - Limit
          - Reduce
          description: GrandMaster mode only - mirrors io.grandMaster's IoGrandMasterValueMode.
        grandMasterChannelMode:
          type: string
          enum:
          - Intensity
          - AllChannels
          description: GrandMaster mode only - mirrors io.grandMaster's IoGrandMasterChannelMode.
    VcXyPadConfig:
      type: object
      description: VCXYPad document-state config. Fixtures/heads and presets are managed via their own
        dedicated messages (vc.xyPad.fixture.*, vc.xyPad.preset.*), not here.
      properties:
        invertedAppearance:
          type: boolean
        displayMode:
          type: string
          enum:
          - Percentage
          - Degrees
          - DMX
        horizontalRange:
          type: object
          description: Bounds of the pad's X axis, in the same 0..255.996 units as VcXyPadSetPositionRequest.params.x
            (default 0..255 - see VCXYPad's m_horizontalRange).
          required:
          - min
          - max
          properties:
            min:
              type: number
            max:
              type: number
        verticalRange:
          type: object
          description: Bounds of the pad's Y axis, same units as horizontalRange above.
          required:
          - min
          - max
          properties:
            min:
              type: number
            max:
              type: number
        floorControl:
          type: boolean
    VcXyPadFixtureEntry:
      type: object
      description: One entry of VCXYPad::m_fixtures - a single head, or a whole FixtureGroup (heads resolved
        dynamically).
      required:
      - enabled
      properties:
        fixtureId:
          type: string
        headIndex:
          type: integer
        fixtureGroupId:
          type: string
          description: Present instead of fixtureId/headIndex when this entry represents a whole group.
        enabled:
          type: boolean
        xRange:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
            reverse:
              type: boolean
        yRange:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
            reverse:
              type: boolean
    VcXyPadPreset:
      type: object
      required:
      - presetId
      - presetType
      - name
      properties:
        presetId:
          type: integer
        presetType:
          type: string
          enum:
          - position
          - function
          - fixtureGroup
          - fixtureGroupHead
        name:
          type: string
        position:
          type: object
          description: presetType=position only. Same 0..255.996 units as VcXyPadSetPositionRequest.params.x/y.
          properties:
            x:
              type: number
            y:
              type: number
        functionID:
          type: string
        fixtureGroupId:
          type: string
          description: presetType=fixtureGroup only - the whole group's heads are resolved dynamically
            (VCXYPadPreset::m_fxGroupID valid case), so membership changes are picked up automatically.
        heads:
          type: array
          description: presetType=fixtureGroupHead only - the authoritative representation of VCXYPadPreset::m_fxGroup,
            an explicit QList<GroupHead> that can name an ARBITRARY SET of one or more heads across one
            or more fixtures (not just a single head - fixtureId/headIndex below cannot represent a multi-head
            preset and are kept only as a convenience echo of heads[0] for the common single-head case).
            Always populate/read this array for fixtureGroupHead presets; a client that only looks at
            fixtureId/headIndex silently drops every head past the first.
          items:
            type: object
            required:
            - fixtureId
            - headIndex
            properties:
              fixtureId:
                type: string
              headIndex:
                type: integer
        fixtureId:
          type: string
          description: presetType=fixtureGroupHead convenience only - equals heads[0].fixtureId. See heads
            above for the full (possibly multi-head) list.
        headIndex:
          type: integer
          description: presetType=fixtureGroupHead convenience only - equals heads[0].headIndex. See heads
            above for the full (possibly multi-head) list.
    VcFrameConfig:
      type: object
      description: VCFrame document-state config.
      properties:
        showHeader:
          type: boolean
        showEnable:
          type: boolean
        isCollapsed:
          type: boolean
        multiPageMode:
          type: boolean
        totalPagesNumber:
          type: integer
        pagesLoop:
          type: boolean
        pageLabels:
          type: array
          items:
            type: object
            required:
            - pageIndex
            - label
            properties:
              pageIndex:
                type: integer
              label:
                type: string
        hasPin:
          type: boolean
          description: Read-only - use vc.frame.setPin to change.
    VcSoloFrameConfig:
      allOf:
      - $ref: '#/components/schemas/VcFrameConfig'
      - type: object
        properties:
          soloframeMixing:
            type: boolean
            description: When true, starting a new Function in this frame fades the previous one out instead
              of cutting it.
          excludeMonitoredFunctions:
            type: boolean
    VcClockConfig:
      type: object
      description: VCClock document-state config. Schedules managed via vc.clock.schedule.*.
      properties:
        clockType:
          type: string
          enum:
          - Clock
          - Stopwatch
          - Countdown
        targetTime:
          type: integer
          description: ms, Stopwatch/Countdown only.
        enableSchedule:
          type: boolean
    VcClockSchedule:
      type: object
      required:
      - index
      - functionID
      - startTime
      - stopTime
      - weekFlags
      properties:
        index:
          type: integer
        functionID:
          type: string
        startTime:
          type: integer
          description: Seconds since midnight.
        stopTime:
          type: integer
          description: Seconds since midnight, or -1 meaning no stop time - see VcClockScheduleUpdateRequest.params
            for the full stop/repeat interaction.
        weekFlags:
          type: integer
          description: Mon=bit0..Sun=bit6 day mask (0x7F, all-zero = every day) PLUS bit7 (0x80) = repeat
            flag - see VcClockScheduleUpdateRequest.params for the full semantics. NOT a plain 7-bit day
            bitmask.
    VcCueListConfig:
      type: object
      description: VCCueList document-state config. chaserID selects which Chaser Function's steps are
        displayed/played (step content is edited via functions.chaser.*).
      properties:
        chaserID:
          type: string
        nextPrevBehavior:
          type: string
          enum:
          - DefaultRunFirst
          - RunNext
          - Select
          - Nothing
        playbackLayout:
          type: string
          enum:
          - PlayPauseStop
          - PlayStopPause
        sideFaderMode:
          type: string
          enum:
          - None
          - Crossfade
          - Steps
    VcSpeedDialMultiplier:
      type: string
      enum:
      - None
      - Zero
      - OneSixteenth
      - OneEighth
      - OneFourth
      - Half
      - One
      - Two
      - Four
      - Eight
      - Sixteen
    VcSpeedDialConfig:
      type: object
      description: VCSpeedDial document-state config. Presets managed via vc.speedDial.preset.*.
      properties:
        visibilityMask:
          type: array
          items:
            type: string
            enum:
            - PlusMinus
            - Dial
            - Tap
            - Hours
            - Minutes
            - Seconds
            - Milliseconds
            - Multipliers
            - Apply
            - Beats
            - XPad
        timeMinimumValue:
          type: integer
        timeMaximumValue:
          type: integer
        resetOnDialChange:
          type: boolean
        controlBPM:
          type: boolean
          description: When true, vc.speedDial.tap also sets the engine's global BPM - see notes.md.
        functions:
          type: array
          description: Functions controlled by this dial's Apply action, each with independent fadeIn/fadeOut/duration
            multiplier overrides.
          items:
            type: object
            required:
            - functionID
            properties:
              functionID:
                type: string
              fadeInFactor:
                $ref: '#/components/schemas/VcSpeedDialMultiplier'
              fadeOutFactor:
                $ref: '#/components/schemas/VcSpeedDialMultiplier'
              durationFactor:
                $ref: '#/components/schemas/VcSpeedDialMultiplier'
    VcSpeedDialPreset:
      type: object
      required:
      - presetId
      - name
      - valueMs
      properties:
        presetId:
          type: integer
        name:
          type: string
        valueMs:
          type: integer
    VcAnimationConfig:
      type: object
      description: VCAnimation document-state config. Colors/algorithm are document- state (saved to the
        show file) even though instantChanges makes editing them feel live - see notes.md. Presets/controls
        managed via vc.animation.preset.*.
      properties:
        visibilityMask:
          type: array
          items:
            type: string
            enum:
            - Fader
            - Label
            - PresetCombo
            - Color1
            - Color2
            - Color3
            - Color4
            - Color5
        functionID:
          type: string
          description: The controlled RGBMatrix Function.
        instantChanges:
          type: boolean
          description: Whether color/algorithm edits are pushed to the running RGBMatrix immediately vs.
            only on next start.
        algorithmIndex:
          type: integer
          description: Index into VCAnimation::algorithms(), i.e. RGBAlgorithm::algorithms(doc) - the
            SAME list and ordering as functions.rgbmatrix.listAlgorithms (functions-advanced.yaml). No
            vc.* message exposes this list separately; a client must call functions.rgbmatrix.listAlgorithms
            to resolve this index to a name (or vice versa).
        colors:
          type: array
          maxItems: 5
          items:
            type: string
            description: Hex.
    VcAnimationPreset:
      type: object
      required:
      - presetId
      - presetType
      properties:
        presetId:
          type: integer
        presetType:
          type: string
          enum:
          - color
          - colorReset
          - colorKnobs
          - text
          - algorithm
          description: This consolidates the engine's 17-value VCAnimationPreset::ControlType enum (Color1..Color5,
            Color1Knob..Color5Knob, Color1Reset..Color5Reset, Animation, Text) into 5 abstracted types,
            using colorIndex (0..4) to pick which of the 5 color slots a color/colorKnobs/colorReset preset
            targets. colorReset (Color1Reset..Color5Reset) is a legacy control type loadable from VCMatrix
            XML (KXMLQLCVCAnimationPreset compatibility) - applying it clears colorIndex's slot back to
            no override (VCAnimation::applyPreset()'s Color<N>Reset case calls setColorAt(colorIndex,
            QColor())), it does not use the color field.
        colorIndex:
          type: integer
          description: color/colorReset/colorKnobs only - which of the 5 color slots (0..4) this preset
            affects.
        color:
          type: string
          description: color only - the color to set colorIndex to. Not used by colorReset (which always
            clears to no override) or colorKnobs (whose live value comes from vc.animation.setPresetKnobValue
            instead).
        text:
          type: string
        algorithmName:
          type: string
        algorithmProperties:
          type: object
          additionalProperties:
            type: string
    VcAudioTriggersConfig:
      type: object
      description: VCAudioTriggers document-state config. Bars managed via vc.audioTriggers.setBarConfig;
        captureEnabled is live, see its own message.
      properties:
        barsNumber:
          type: integer
          minimum: 1
          description: Resizes the bars array (bar 0 is always the volume bar).
        volumeLevel:
          type: integer
          minimum: 0
          maximum: 255
          description: Capture gain/threshold calibration.
    VcAudioTriggersBar:
      type: object
      required:
      - index
      - type
      properties:
        index:
          type: integer
        type:
          type: string
          enum:
          - None
          - DMXBar
          - FunctionBar
          - VCWidgetBar
        minThreshold:
          type: integer
        maxThreshold:
          type: integer
        functionId:
          type: string
        triggeredWidgetId:
          type: string
        dmxChannels:
          type: array
          items:
            type: object
            required:
            - fixtureId
            - channel
            properties:
              fixtureId:
                type: string
              channel:
                type: integer
    VcXyPadPresetData:
      type: object
      required:
      - presetType
      properties:
        presetType:
          type: string
          enum:
          - position
          - function
          - fixtureGroup
          - fixtureGroupHead
        functionID:
          type: string
        fixtureGroupId:
          type: string
        fixtureId:
          type: string
        headIndex:
          type: integer
      description: Covers addPositionPreset/addFunctionPreset/ addFixtureGroupPreset/addFixtureGroupHeadPreset.
        $functionID required when presetType=function; $fixtureGroupId required when presetType=fixtureGroup;
        $fixtureId+$headIndex required when presetType=fixtureGroupHead.
    VcSpeedDialPresetData:
      type: object
      required:
      - name
      - valueMs
      properties:
        name:
          type: string
        valueMs:
          type: integer
    VcAnimationPresetData:
      type: object
      required:
      - presetType
      properties:
        presetType:
          type: string
          enum:
          - color
          - colorKnobs
          - text
          - algorithm
        colorIndex:
          type: integer
          minimum: 0
          maximum: 4
        color:
          type: string
          description: Hex, for presetType=color.
        text:
          type: string
        algorithmName:
          type: string
        algorithmProperties:
          type: object
          additionalProperties:
            type: string
      description: Covers addColorPreset/addColorKnobsPreset/addTextPreset/ addAlgorithmPreset. $colorIndex
        (0-4) required for color/colorKnobs; $text required for text; $algorithmName (+optional $algorithmProperties)
        required for algorithm.
