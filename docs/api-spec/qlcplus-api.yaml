components:
  messages:
    HelloRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: hello
          params:
            type: object
            required:
            - apiVersion
            - clientName
            properties:
              apiVersion:
                type: string
                example: 1.0.0
              clientName:
                type: string
                example: QLC+ Electron UI
              authToken:
                type: string
    WelcomeResponse:
      payload:
        type: object
        required:
        - type
        - id
        - ok
        - result
        properties:
          type:
            const: response
          id:
            type: string
          ok:
            const: true
          result:
            type: object
            required:
            - clientId
            - docRevision
            - serverVersion
            properties:
              clientId:
                type: string
              docRevision:
                type: integer
              serverVersion:
                type: string
    SubscribeRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: subscribe
          params:
            type: object
            required:
            - topics
            properties:
              topics:
                type: array
                items:
                  type: string
    UnsubscribeRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: unsubscribe
          params:
            type: object
            required:
            - topics
            properties:
              topics:
                type: array
                items:
                  type: string
    GenericAckResponse:
      payload:
        type: object
        required:
        - type
        - id
        - ok
        - result
        properties:
          type:
            const: response
          id:
            type: string
          ok:
            const: true
          result:
            type: object
    ErrorResponse:
      payload:
        type: object
        required:
        - type
        - id
        - ok
        - error
        properties:
          type:
            const: response
          id:
            type: string
          ok:
            const: false
          error:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                example: CONFLICT
              message:
                type: string
              details:
                type: object
    LocksAcquireRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: locks.acquire
          params:
            type: object
            required:
            - resourceType
            - resourceId
            properties:
              resourceType:
                type: string
                example: function
              resourceId:
                type: string
    LocksReleaseRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: locks.release
          params:
            type: object
            required:
            - resourceType
            - resourceId
            properties:
              resourceType:
                type: string
              resourceId:
                type: string
    LocksChangedEvent:
      payload:
        type: object
        required:
        - type
        - topic
        - data
        properties:
          type:
            const: event
          topic:
            const: locks.changed
          originClientId:
            type:
            - string
            - 'null'
          data:
            type: object
            required:
            - resourceType
            - resourceId
            - holderClientId
            properties:
              resourceType:
                type: string
              resourceId:
                type: string
              holderClientId:
                type:
                - string
                - 'null'
                description: null means released
    CoreProjectNewRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: core.project.new
          params:
            type: object
            description: 'Discards the current document (unsaved changes are lost) and replaces it with
              a blank, never-saved project. Mirrors App::newWorkspace(). Deliberately carries no baseRevision:
              this is a full-document replace, not an incremental structural edit, so there is nothing
              to rebase against (see core-notes.md).'
            properties: {}
    CoreProjectNewResponse:
      payload:
        oneOf:
        - $ref: '#/components/messages/CoreDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'
    CoreProjectOpenRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: core.project.open
          params:
            type: object
            required:
            - source
            description: 'Two supported transfer modes, see core-notes.md for the assumption behind this
              split: "path" asks the engine to read a .qxw file that already exists on the machine the
              engine process runs on (e.g. a headless-server deployment where the operator picks from
              a server-side project library); "upload" carries the whole XML file inline, base64-encoded,
              for the case where the file lives only on the Electron client''s machine. Exactly one of
              (path) / (contentBase64) must be supplied, matching the chosen source. No baseRevision:
              this discards the current document entirely, same reasoning as core.project.new.'
            properties:
              source:
                type: string
                enum:
                - path
                - upload
              path:
                type: string
                description: Server-local filesystem path to a .qxw file. Required when source=path.
              fileName:
                type: string
                description: Original file name (with .qxw extension), used for the recent-files list
                  and Save. Required when source=upload.
              contentBase64:
                type: string
                description: Base64-encoded UTF-8 XML content of the .qxw file. Required when source=upload.
    CoreProjectOpenResponse:
      payload:
        oneOf:
        - $ref: '#/components/messages/CoreProjectOpenOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'
    CoreProjectOpenOkResponse:
      payload:
        type: object
        required:
        - type
        - id
        - ok
        - result
        properties:
          type:
            const: response
          id:
            type: string
          ok:
            const: true
          result:
            type: object
            required:
            - docRevision
            properties:
              docRevision:
                type: integer
              warningsHtml:
                type:
                - string
                - 'null'
                description: Non-fatal problems found while parsing the file (missing fixture definitions,
                  out-of-bounds addresses, missing audio/video files, etc. - see Doc::appendToErrorLog()
                  call sites). HTML-formatted (as produced by the engine today), null if the load was
                  clean. The same lines are also emitted individually as core.log warning events, see
                  core-notes.md.
    CoreProjectCloseRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: core.project.close
          params:
            type: object
            description: 'The engine always has *a* document open (Doc is never null), so "close" is defined
              as: discard the current document and replace it with a blank one, exactly like core.project.new.
              Exposed as a distinct method for UI-affordance clarity (a client''s "Close Project" menu
              item shouldn''t have to call something literally named "new"), see core-notes.md.'
            properties: {}
    CoreProjectCloseResponse:
      payload:
        oneOf:
        - $ref: '#/components/messages/CoreDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'
    CoreProjectLoadedEvent:
      payload:
        type: object
        required:
        - type
        - topic
        - data
        properties:
          type:
            const: event
          topic:
            const: core.project.loaded
          originClientId:
            type:
            - string
            - 'null'
          data:
            type: object
            required:
            - reason
            - project
            description: Broadcast after core.project.new, core.project.open or core.project.close - all
              three fully replace the document, this is the one place clients should refresh all their
              domain state from (fixtures, functions, VC, I/O patches, everything), rather than trying
              to diff against what they had before.
            properties:
              reason:
                type: string
                enum:
                - new
                - opened
                - closed
              project:
                $ref: '#/components/schemas/CoreProjectMetadata'
    CoreProjectSaveRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: core.project.save
          params:
            type: object
            description: 'Saves to the file the document was last opened/saved-as from. No baseRevision:
              saving serializes current state to disk, it does not mutate document content, so there is
              nothing to conflict with (see core-notes.md §"why save has no baseRevision").'
            properties: {}
    CoreProjectSaveResponse:
      payload:
        oneOf:
        - $ref: '#/components/messages/CoreProjectSaveOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'
    CoreProjectSaveOkResponse:
      payload:
        type: object
        required:
        - type
        - id
        - ok
        - result
        properties:
          type:
            const: response
          id:
            type: string
          ok:
            const: true
          result:
            type: object
            required:
            - docRevision
            - filePath
            properties:
              docRevision:
                type: integer
                description: Unchanged by a save; included for convenience so the client can confirm what
                  was saved.
              filePath:
                type: string
    CoreProjectSaveAsRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: core.project.saveAs
          params:
            type: object
            required:
            - target
            description: Mirror of core.project.open's two-mode split. "serverPath" writes the file on
              the engine machine's filesystem at (path) and that becomes the project's file for subsequent
              core.project.save calls. "download" does not touch the server filesystem at all - it serializes
              the document and hands the bytes back in the response for the Electron client to write wherever
              the user picked via its own native Save dialog; the engine's own notion of "current file"
              is left untouched in this case (see core-notes.md).
            properties:
              target:
                type: string
                enum:
                - serverPath
                - download
              path:
                type: string
                description: Target path on the engine's filesystem. Required when target=serverPath.
                  .qxw is appended if missing.
    CoreProjectSaveAsResponse:
      payload:
        oneOf:
        - $ref: '#/components/messages/CoreProjectSaveAsOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'
    CoreProjectSaveAsOkResponse:
      payload:
        type: object
        required:
        - type
        - id
        - ok
        - result
        properties:
          type:
            const: response
          id:
            type: string
          ok:
            const: true
          result:
            type: object
            required:
            - docRevision
            properties:
              docRevision:
                type: integer
              filePath:
                type:
                - string
                - 'null'
                description: Set when target=serverPath, null when target=download.
              fileName:
                type:
                - string
                - 'null'
                description: Set when target=download (suggested file name for the client to save as),
                  null when target=serverPath.
              contentBase64:
                type:
                - string
                - 'null'
                description: 'Set when target=download: the full .qxw XML content, base64-encoded. Null
                  when target=serverPath.'
    CoreProjectSavedEvent:
      payload:
        type: object
        required:
        - type
        - topic
        - data
        properties:
          type:
            const: event
          topic:
            const: core.project.saved
          originClientId:
            type:
            - string
            - 'null'
          data:
            type: object
            required:
            - docRevision
            - filePath
            - fileName
            description: Broadcast after a successful core.project.save or core.project.saveAs with target=serverPath.
              NOT broadcast for saveAs with target=download, since that mode doesn't change the engine's
              own "current file" state (see core-notes.md) - only the requester's response carries those
              bytes.
            properties:
              docRevision:
                type: integer
                description: 'Also serves as the client''s ''clean'' marker: isModified == (docRevision
                  !== docRevisionAtLastSave from CoreProjectMetadata).'
              filePath:
                type: string
              fileName:
                type: string
    CoreProjectGetRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: core.project.get
          params:
            type: object
            properties: {}
    CoreProjectGetResponse:
      payload:
        oneOf:
        - $ref: '#/components/messages/CoreProjectGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'
    CoreProjectGetOkResponse:
      payload:
        type: object
        required:
        - type
        - id
        - ok
        - result
        properties:
          type:
            const: response
          id:
            type: string
          ok:
            const: true
          result:
            $ref: '#/components/schemas/CoreProjectMetadata'
    CoreProjectRecentFilesRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: core.project.recentFiles
          params:
            type: object
            properties: {}
    CoreProjectRecentFilesResponse:
      payload:
        oneOf:
        - $ref: '#/components/messages/CoreProjectRecentFilesOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'
    CoreProjectRecentFilesOkResponse:
