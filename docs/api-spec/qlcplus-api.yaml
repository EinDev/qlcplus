            properties:
              sessionId:
                type: string
              baseRevision:
                type: integer
              channelId:
                type: string
    FixtureDefsAliasAddRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: fixturedefs.channel.capability.alias.add
          params:
            type: object
            required:
            - sessionId
            - baseRevision
            - channelId
            - capabilityIndex
            - targetMode
            - targetChannel
            description: Mirrors AliasEdit::addAlias. The capability at capabilityIndex must have preset
              Alias, and targetMode must be a mode that contains channelId (see FixtureDefsGetResponse/definition.modes
