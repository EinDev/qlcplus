        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: vc.widget.createMatrix
          params:
            type: object
            required:
            - page
            - matrixType
            - position
            - matrixSize
            - widgetSize
            - baseRevision
            description: VCFrame::addWidgetMatrix() - bulk-creates a grid of identical widgets, optionally
              wrapped in a container Frame/SoloFrame. $parentId is the containing Frame/SoloFrame widget
              ID, or absent to place the matrix directly on $page's root - mirrors vc.widget.create's
              handling of the same case (VCPage IS-A VCFrame, so the server resolves "page N's root" to
              that page's own VCFrame internally). $page is required even when $parentId is given, since
              it is otherwise the only way to reach the root of an empty page (there is no message that
              exposes a page-root widget ID to pass as $parentId instead).
            properties:
              parentId:
                type: string
              page:
                type: integer
              matrixType:
                type: string
                enum:
                - Button
                - Slider
                description: Only these two widget types are supported by the engine (VCFrame::addWidgetMatrix()
                  creates Button widgets for "buttonmatrix" and Slider widgets for anything else) - NOT
                  the full VcWidgetType enum used elsewhere in this fragment. A server implementing this
                  literally treats every other value as a slider matrix, so validate client-side against
                  exactly these two.
              position:
                type: object
                required:
                - x
                - y
                properties:
                  x:
                    type: integer
                  y:
                    type: integer
              matrixSize:
                type: object
                required:
                - columns
                - rows
                properties:
                  columns:
                    type: integer
                  rows:
                    type: integer
              widgetSize:
                type: object
                required:
                - width
                - height
                properties:
                  width:
                    type: integer
                  height:
                    type: integer
              soloFrame:
                type: boolean
                default: false
                description: Wrap the matrix in a VCSoloFrame instead of a plain VCFrame.
              baseRevision:
                type: integer
