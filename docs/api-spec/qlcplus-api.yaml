    IoPatchRemoveRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: io.patch.remove
          params:
            type: object
            required:
            - universeId
            - patchType
            - baseRevision
            description: 'Detaches a patch from a universe. patchType selects which one: input and feedback
              are singleton per universe (index not used); output patches are an indexed array, so `index`
              is required when patchType is ''output''.'
            properties:
              universeId:
                type: integer
              patchType:
                enum:
                - input
                - output
                - feedback
              index:
                type: integer
                description: Output patch slot index; required when patchType='output', unused otherwise.
              baseRevision:
                type: integer
    IoPatchRemoveResponse:
      payload:
        oneOf:
        - $ref: '#/components/messages/IoPatchMutationOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'
    IoPatchSetRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: io.patch.set
          params:
            type: object
            required:
            - universeId
            - patchType
            - pluginName
            - line
            - baseRevision
            description: Attaches a plugin line to a universe's patch. patchType selects which one (input/output/feedback
              - the plugin must advertise the Feedback capability for patchType='feedback', see io.plugin.list).
              `line` is the plugin's line index either way (see io.plugin.getLines) - the input line for
              patchType='input', the output line for 'output'/'feedback'.
            properties:
              universeId:
                type: integer
              patchType:
                enum:
                - input
                - output
                - feedback
              pluginName:
                type: string
              line:
                type: integer
                description: Plugin input/output line index (see io.plugin.getLines).
              index:
                type: integer
                description: Output patch slot index; only used when patchType='output'. Omit (or pass
                  outputPatchesCount) to append a new patch; pass an existing index to replace it.
              profileName:
                type: string
                description: Input profile name to attach (see io.inputProfile.*); only used when patchType='input'.
                  Omit/empty for none.
              baseRevision:
                type: integer
