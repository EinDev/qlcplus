                      API.
        - $ref: '#/components/messages/ErrorResponse/payload'
    FixtureDefsCapabilityUpdateRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: fixturedefs.channel.capability.update
          params:
            type: object
            required:
            - sessionId
            - baseRevision
            - channelId
            - capabilityIndex
            description: 'Partial update of range/name/preset/resources. `resources` is interpreted according
              to the resulting preset''s presetType (see FixtureDefsCapability schema): SingleColor/DoubleColor
              expect 1-2 "#RRGGBB" hex strings, SingleValue/DoubleValue expect 1-2 numbers (Hz, or prism
              face count), Picture expects a single resource-name string, all other presets ignore `resources`.
              The `aliases` field is read-only here — mutate it via fixturedefs.channel.capability.alias.*.'
            properties:
              sessionId:
                type: string
              baseRevision:
                type: integer
              channelId:
                type: string
              capabilityIndex:
                type: integer
              min:
                type: integer
                minimum: 0
                maximum: 255
              max:
                type: integer
                minimum: 0
                maximum: 255
              name:
                type: string
              preset:
                type: string
              resources:
                type: array
                items:
                  oneOf:
                  - type: string
                  - type: number
    FixtureDefsCapabilityRemoveRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: fixturedefs.channel.capability.remove
          params:
            type: object
            required:
            - sessionId
            - baseRevision
            - channelId
            - capabilityIndex
            properties:
              sessionId:
                type: string
              baseRevision:
                type: integer
              channelId:
                type: string
              capabilityIndex:
                type: integer
    FixtureDefsCapabilityAutoPatchColorsRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: fixturedefs.channel.capability.autoPatchColors
          params:
            type: object
            required:
            - sessionId
            - baseRevision
            - channelId
            description: 'Bulk-authoring convenience, mirrors ChannelEdit::autoPatchColorCapabilities:
              for a Colour-group channel, title-cases any all-lowercase capability names and auto-detects
              color names in each capability''s name against the bundled namedrgb color filter, setting
              ColorMacro/ ColorDoubleMacro preset + resources accordingly. No-op (but still ok:true) if
