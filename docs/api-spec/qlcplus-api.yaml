          params:
            type: object
            required:
            - universeId
            description: One-shot full-frame snapshot, used to seed the baseline before/ after subscribing
              to the delta event topic below. Values are post-Grand-Master (Universe::postGMValues() —
              what's actually transmitted), matching what mainviewdmx.cpp displays.
            properties:
              universeId:
                type: integer
    IoDmxUniverseGetResponse:
      payload:
        oneOf:
        - $ref: '#/components/messages/IoDmxUniverseGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'
