                type: integer
              definition:
                $ref: '#/components/schemas/FixtureDefsDefinition'
              warnings:
                type: array
                items:
                  type: string
    FixtureDefsChannelAddRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: fixturedefs.channel.add
          params:
            type: object
            required:
            - sessionId
            - baseRevision
            description: Adds a new channel to the definition's channel pool (not yet assigned to any
              mode — see fixturedefs.mode.setChannels for that). If `preset` is given, the server applies
              the same shortcut as EditorView::addPresetChannel (auto group/colour and a single auto-generated
              capability). Otherwise a blank channel is created with one full-range (0-255), empty-name
              capability, mirroring ChannelEdit's default-capability behavior.
            properties:
              sessionId:
                type: string
              baseRevision:
                type: integer
              name:
                type: string
                description: Defaults to 'New channel N' if omitted.
              group:
                type: string
                description: 'One of QLCChannel::Group''s names, as serialized by groupToString()/parsed
                  by stringToGroup(): Intensity, Colour, Gobo, Speed, Pan, Tilt, Shutter, Prism, Beam,
                  Effect, Maintenance, Nothing, plus the 3D-position/rotation/scale groups used by matrix/pixel-bar
                  fixtures — "Position X", "Position Y", "Position Z", "Rotation X", "Rotation Y", "Rotation
                  Z", "Scale X", "Scale Y", "Scale Z" (note the space; these are NOT "PositionX"-style
                  compact tokens — see the FixtureDefsChannel.group enum below for the exhaustive, schema-enforced
                  list).'
              colour:
                type: string
                description: 'One of QLCChannel::PrimaryColour''s names, as serialized by colourToString():
                  Generic (the "no specific primary colour" value — colourToString() returns the literal
                  string "Generic" for this case, not "NoColour"), Red, Green, Blue, Cyan, Magenta, Yellow,
                  Amber, White, UV, Lime, Indigo; only meaningful when group is Intensity.'
              preset:
                type: string
                description: Optional shortcut preset name (e.g. IntensityRed, PositionPan, ColorMacro)
                  that auto-populates group/colour/capabilities.
    FixtureDefsChannelAddResponse:
      payload:
        oneOf:
        - type: object
          required:
          - type
          - id
          - ok
          - result
          properties:
            type:
              const: response
            id:
              type: string
            ok:
              const: true
            result:
              allOf:
              - $ref: '#/components/schemas/FixtureDefsSessionMutationResult'
              - type: object
                required:
                - channelId
                properties:
                  channelId:
                    type: string
                    description: Server-assigned stable id — see notes.md for why this API uses synthetic
                      ids for channels/modes instead of the engine's name-based lookup.
        - $ref: '#/components/messages/ErrorResponse/payload'
    FixtureDefsChannelUpdateRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: fixturedefs.channel.update
          params:
            type: object
            required:
            - sessionId
            - baseRevision
            - channelId
            description: Partial update. Setting `preset` to anything other than Custom replaces the channel's
              entire capability list with the preset's auto-generated capability, mirroring ChannelEdit::setupPreset
              — the resulting capabilities are visible in the following fixturedefs.session.updated event.
            properties:
              sessionId:
                type: string
              baseRevision:
                type: integer
              channelId:
                type: string
              name:
                type: string
                description: Renaming a channel does NOT retarget any alias whose targetChannel references
                  its old name — aliases are name-addressed (see FixtureDefsAlias), and neither the engine
                  nor fixturedefs.session.validate updates or flags stale targetChannel references on
                  a channel rename. Same invariant as fixturedefs.mode.rename for targetMode; see that
                  method's description for the full explanation.
              group:
                type: string
              colour:
                type: string
              preset:
                type: string
              defaultValue:
                type: integer
                minimum: 0
                maximum: 255
              controlByte:
                type: string
                enum:
                - MSB
                - LSB
    FixtureDefsChannelRemoveRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: fixturedefs.channel.remove
          params:
            type: object
            required:
            - sessionId
            - baseRevision
            - channelIds
            description: 'Batch remove (mirrors EditorView::deleteChannels). Cascades: also removed from
              every mode''s channel list/heads, and any alias capabilities targeting a removed channel
              are dropped.'
            properties:
              sessionId:
                type: string
              baseRevision:
                type: integer
              channelIds:
                type: array
                minItems: 1
                items:
                  type: string
    FixtureDefsCapabilityAddRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: fixturedefs.channel.capability.add
          params:
            type: object
            required:
            - sessionId
            - baseRevision
            - channelId
