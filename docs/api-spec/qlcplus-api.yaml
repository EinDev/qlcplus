            type: string
          ok:
            const: true
          result:
            type: object
            required:
            - docRevision
            - presetId
            properties:
              docRevision:
                type: integer
              presetId:
                type: integer
  schemas:
    CoreProjectMetadata:
      type: object
      required:
      - filePath
      - fileName
      - isModified
      - docRevision
      - docRevisionAtLastSave
      - creator
      properties:
        filePath:
          type:
          - string
          - 'null'
          description: Full path on the engine's filesystem. Null for a never-saved project, or one opened
            via source=upload that hasn't been saved yet.
        fileName:
          type:
          - string
          - 'null'
          description: Basename of filePath, for display. Null under the same conditions as filePath.
        isModified:
          type: boolean
          description: Mirrors Doc::isModified().
        docRevision:
          type: integer
        docRevisionAtLastSave:
          type:
          - integer
          - 'null'
          description: 'docRevision at the moment of the last successful save (or saveAs with target=serverPath)
            this session. Null if never saved this session. Equivalent way to derive isModified: docRevision
            !== docRevisionAtLastSave.'
        creator:
          type:
          - object
          - 'null'
          description: Informational only, read-only via this API - the engine has no concept of an editable
            project title/author/notes field (see core-notes.md, "what Doc actually tracks"). Null for
            a brand-new unsaved project. Reflects the <Creator> block of the last loaded/saved file; QLC+
            currently always rewrites author to the OS user name at save time regardless of what was loaded,
            this API surfaces that behavior as-is rather than inventing a settable field.
          properties:
            name:
              type:
              - string
              - 'null'
            version:
              type:
              - string
              - 'null'
            author:
              type:
              - string
              - 'null'
    CoreRecentFileEntry:
      type: object
      required:
      - filePath
      - fileName
      properties:
        filePath:
          type: string
        fileName:
          type: string
    CoreHistoryEntry:
      type: object
      required:
      - index
      - actionCode
      - actionName
      - tier
      - timestampMs
      properties:
        index:
          type: integer
          description: Position in the history stack, 0-based.
        actionCode:
          type: integer
          description: Raw Tardis::ActionCodes value.
        actionName:
          type: string
          description: Symbolic name, e.g. "FunctionSetName", "VCWidgetGeometry" (Tardis::actionToString()).
        tier:
          type: string
          enum:
          - structural
          - live
          description: structural = actionCode < 0xF000 (LIVE_ACTIONS_START_CODE), i.e. it bumps docRevision/isModified.
            live = a runtime action (fader move, button press, function start/stop, ...) - see core-notes.md
            for why the shared undo stack mixes both.
        timestampMs:
          type: integer
          description: Wall-clock epoch milliseconds (converted from Tardis's internal process-uptime-relative
            timestamp, see core-notes.md).
    CoreSettings:
      type: object
      required:
      - locale
      - defaultWorkingPath
      - masterTimerFrequencyHz
      properties:
        locale:
          type:
          - string
          - 'null'
        defaultWorkingPath:
          type:
          - string
          - 'null'
        masterTimerFrequencyHz:
          type: integer
    FixturesPhysical:
      type: object
      description: QLCPhysical, flattened (bulb/lens/dimensions/focus/technical groups).
      properties:
        width:
          type: integer
        height:
          type: integer
        depth:
          type: integer
        weight:
          type: number
        powerConsumption:
          type: integer
          description: watts
        dmxConnector:
          type: string
        bulbType:
          type: string
        bulbLumens:
          type: integer
        bulbColourTemperature:
          type: integer
        lensName:
          type: string
        lensDegreesMin:
          type: number
        lensDegreesMax:
          type: number
        focusType:
          type: string
        focusPanMax:
          type: integer
        focusTiltMax:
          type: integer
        layoutWidth:
          type: integer
          description: Head arrangement grid width, for matrix/pixel fixtures (QLCPhysical::layoutSize()).
            Previously missing here despite being present on FixtureDefsPhysical in fixturedefs.yaml —
            same QLCPhysical field; fixtures.defs.getMode needs it to preview a matrix fixture's head
            layout in the patch dialog.
        layoutHeight:
          type: integer
          description: Head arrangement grid height, for matrix/pixel fixtures. See layoutWidth.
    FixturesCapability:
      type: object
      description: QLCCapability — one DMX value sub-range of a channel. This is a read-oriented summary
        shape (min/max/name/preset plus derived presetType/color1/color2 for direct UI rendering), distinct
        from FixtureDefsCapability in fixturedefs.yaml, which exposes the same engine object's raw authoring
        shape (resources/aliases/warning) for the definition editor. The two intentionally differ because
        they serve different consumers of the same QLCCapability — see fixturedefs.yaml's FixtureDefsCapability
        schema doc and fixturedefs-notes.md for why they aren't unified into one schema.
      required:
      - min
      - max
      - name
      properties:
        min:
          type: integer
        max:
          type: integer
        name:
          type: string
        preset:
          type: string
          description: QLCCapability::Preset as string via presetToString(), "Custom" if none.
        presetType:
          type: string
          enum:
          - None
          - SingleColor
          - DoubleColor
          - SingleValue
          - DoubleValue
          - Picture
          description: QLCCapability::presetType() — hints the UI what extra control (color swatch, numeric
            field...) to render.
        color1:
          type: string
          description: Primary resource color as hex, when presetType implies a color swatch (from resources()[0]).
        color2:
          type: string
          description: Secondary resource color as hex, for DoubleColor presets (from resources()[1]).
    FixturesModeChannel:
      type: object
      description: QLCChannel as arranged within one QLCFixtureMode.
      required:
      - index
      - name
      - group
      - controlByte
      - defaultValue
      - capabilities
      properties:
        index:
          type: integer
          description: DMX channel number within the mode (0-based).
        name:
          type: string
        group:
          type: string
          description: QLCChannel::Group as string via groupToString() (Intensity, Colour, Gobo, Speed,
            Pan, Tilt, Shutter, Prism, Beam, Effect, Maintenance, Nothing).
        preset:
          type: string
          description: QLCChannel::Preset as string via presetToString(), "Custom" if none (e.g. "IntensityRed",
            "PositionPan", "ShutterStrobeSlowFast"...).
        colour:
          type: string
          description: QLCChannel::PrimaryColour as string, only meaningful for Intensity-group channels.
        controlByte:
          type: string
          enum:
          - MSB
          - LSB
        defaultValue:
          type: integer
          minimum: 0
          maximum: 255
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/FixturesCapability'
    FixturesModeHead:
      type: object
      required:
      - index
      - channels
      properties:
        index:
          type: integer
        channels:
          type: array
          items:
            type: integer
          description: Channel indices (within the mode) that belong to this head.
    FixturesDefinitionRef:
      type: object
      description: 'Identifies what to patch/remap-to: either a real library definition (manufacturer+model+mode)
        or a generic dimmer with no real definition (Fixture::genericDimmerDef()/genericDimmerMode(),
        used when manufacturer/model/mode are absent). Exactly one of {manufacturer+model+mode, generic}
        must be given — INVALID_PARAMS otherwise.'
      properties:
        manufacturer:
          type: string
        model:
          type: string
        mode:
          type: string
        generic:
          type: object
          required:
          - channels
          properties:
            channels:
              type: integer
              minimum: 1
              description: Fixture::setChannels() — only valid for a generic dimmer.
    FixturesPatchedFixture:
      type: object
      description: One patched Fixture instance (engine/src/fixture.h), as used in lists and change events.
      required:
      - id
      - name
      - universe
      - address
      - channels
      - fixtureType
      - isGeneric
      properties:
        id:
          type: string
        name:
          type: string
        universe:
          type: integer
        address:
          type: integer
          description: 0-based DMX start address within its universe.
        channels:
          type: integer
          description: Fixture::channels() — the instance's channel footprint.
        fixtureType:
          type: string
          description: 'Fixture::typeString() — QLCFixtureDef::typeToString(fixtureDef()->type()) when
            a real definition is attached, otherwise the literal string "Dimmer". There is no separate
            "Generic Dimmer" string anywhere in the engine: a generic fixture''s fixtureType reads exactly
            "Dimmer", same as a real dimmer definition — use isGeneric to tell them apart, not this field.'
        manufacturer:
          type: string
        model:
          type: string
        mode:
          type: string
        isGeneric:
          type: boolean
          description: 'true if this fixture is a generic dimmer. qmlui always attaches a procedural QLCFixtureDef
            to generic fixtures (Fixture:: genericDimmerDef(), fixture.cpp), so "no definition at all"
            is never the actual runtime state to test for — Fixture::fixtureDef() is never null for a
            live-patched fixture. The real discriminator, matching the engine''s own check (fixture.cpp,
            e.g. around the generic-def-ownership check in Fixture::setFixtureDefinition), is whether
            the attached definition''s manufacturer AND model are both the literal string "Generic" (QLCFixtureDef::manufacturer()
            == "Generic" && model() == "Generic") — not identity/nullness of the definition pointer.'
        crossUniverse:
          type: boolean
          description: Fixture::crossUniverse().
    FixturesPatchedFixtureDetail:
      allOf:
      - $ref: '#/components/schemas/FixturesPatchedFixture'
      - type: object
        required:
        - channelList
        properties:
          channelList:
            type: array
            description: Fixture's channels resolved to absolute DMX addresses (Fixture::channelAddress())
              — enough for a UI to show "this fixture's Red channel is Universe 2, DMX 145" without the
              client re-deriving universe*512+address+index itself.
            items:
              type: object
              required:
              - index
              - name
              - group
              - absoluteAddress
              properties:
                index:
                  type: integer
                name:
                  type: string
                group:
                  type: string
                colour:
                  type: string
                absoluteAddress:
                  type: integer
                  description: universe*512 + address + index (Fixture::channelAddress()).
    FixturesGroupHeadEntry:
      type: object
      required:
      - x
      - y
      - fixtureId
      - headIndex
      properties:
        x:
          type: integer
        y:
          type: integer
        fixtureId:
          type: string
        headIndex:
          type: integer
    FixturesGroup:
      type: object
      description: FixtureGroup (engine/src/fixturegroup.h) — a named 2D layout grid of fixture heads.
      required:
      - id
      - name
      - size
      - heads
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: object
          required:
          - columns
          - rows
          properties:
            columns:
              type: integer
            rows:
              type: integer
        heads:
          type: array
          items:
            $ref: '#/components/schemas/FixturesGroupHeadEntry'
    FixturesChannelMapEntry:
      type: object
      required:
      - sourceChannel
      - targetChannel
      properties:
        sourceChannel:
          type: integer
        targetChannel:
          type: integer
    FixtureDefsSessionMutationResult:
      type: object
      description: 'Shared base for every session-mutation ok-response that allocates (or counts) a new
        sub-resource: channel.add, capability.add, alias.add, alias.applyToAllModes, mode.add, head.add.
        Each of those composes this base (via allOf) with its own one extra field (channelId/ capabilityIndex/aliasIndex/addedCount/modeId/headIndex)
        - the id/index field''s name and type genuinely differ per resource type, so only the truly-identical
        sessionId+sessionRevision pair is factored out here.'
      required:
      - sessionId
      - sessionRevision
      properties:
        sessionId:
          type: string
        sessionRevision:
          type: integer
    FixtureDefsPhysical:
      type: object
      description: Maps to QLCPhysical. All fields optional here so this schema can double as a partial-update
        payload for fixturedefs.session.setPhysical / fixturedefs.mode.setPhysical; every field is always
        present in a definition snapshot.
      properties:
        bulbType:
          type: string
          example: MSR 1200
        bulbLumens:
          type: integer
        bulbColourTemperature:
          type: integer
          description: Kelvin. Named to match the engine field (QLCPhysical::bulbColourTemperature())
            and fixtures.yaml's FixturesPhysical.bulbColourTemperature — this schema previously spelled
            it "bulbColorTemperature" (American spelling), which disagreed with both the engine and the
            sibling fixtures.yaml schema.
        weight:
          type: number
          description: kg
        width:
          type: integer
          description: mm
        height:
          type: integer
          description: mm
        depth:
          type: integer
          description: mm
        lensName:
          type: string
          example: PC
          description: Named to match the engine field (QLCPhysical::lensName()) and fixtures.yaml's FixturesPhysical.lensName
            — this schema previously called it "lensType", which disagreed with both the engine and the
            sibling fixtures.yaml schema.
        lensDegreesMin:
          type: number
        lensDegreesMax:
          type: number
        focusType:
          type: string
          example: Mirror
        focusPanMax:
          type: integer
          description: Degrees, 0 = fixed
        focusTiltMax:
          type: integer
          description: Degrees, 0 = fixed
        layoutWidth:
          type: integer
          description: Head arrangement grid width, for matrix/pixel fixtures (QLCPhysical::layoutSize).
        layoutHeight:
          type: integer
          description: Head arrangement grid height, for matrix/pixel fixtures.
        powerConsumption:
          type: integer
          description: Watts
        dmxConnector:
          type: string
          example: 3-pin
    FixtureDefsAlias:
      type: object
      required:
      - targetMode
      - targetChannel
      description: 'Both fields are name-addressed (there is no mode-id/channel-id addressing for aliases,
        mirroring AliasEdit''s own string-based targeting), which means an alias survives reordering but
        NOT renaming: fixturedefs.mode.rename and fixturedefs.channel.update''s `name` field do not retarget
        any alias whose targetMode/targetChannel matches the old name — see fixturedefs.mode.rename''s
        description for the full invariant. A client that renames a mode or channel with aliases pointing
        at it should immediately re-point them via fixturedefs.channel.capability.alias.update, or expect
        those aliases to silently stop resolving.'
      properties:
        targetMode:
          type: string
          description: Name of the mode this substitution applies in.
        targetChannel:
          type: string
          description: Name of the channel that replaces the owning channel while its DMX value is within
            the capability's [min,max].
    FixtureDefsCapability:
      type: object
      required:
      - min
      - max
      - name
      - preset
      - resources
      - aliases
      - warning
      description: 'The full authoring/raw shape of QLCCapability, for the definition editor (fixturedefs.*
        session mutations read/write this exact shape). fixtures.yaml''s FixturesCapability schema represents
        the SAME engine object but as a lighter read-oriented summary for browsing a patched fixture''s
        modes (derived color1/color2/presetType instead of raw resources, and it omits aliases/warning
        entirely since those are authoring-time-only concerns). The two are deliberately not unified:
        a browsing client (fixtures.defs.getMode) shouldn''t have to parse `resources` itself just to
        show a color swatch, while the definition editor (fixturedefs.*) needs the raw, round-trippable
        form. See fixtures.yaml''s FixturesCapability schema doc for the reverse cross-reference.'
      properties:
        min:
          type: integer
          minimum: 0
          maximum: 255
        max:
          type: integer
          minimum: 0
          maximum: 255
        name:
          type: string
        preset:
          type: string
          description: One of QLCCapability::Preset's names (Custom, ColorMacro, ColorDoubleMacro, StrobeFrequency,
            RotationClockwise, Alias, ...). Not enumerated exhaustively here — see qlccapability.h; server
            validates via QLCCapability::stringToPreset.
        resources:
          type: array
          description: 'Interpretation depends on the preset''s presetType: SingleColor (ColorMacro) =
            one "#RRGGBB" string; DoubleColor (ColorDoubleMacro) = two "#RRGGBB" strings; SingleValue
            (StrobeFrequency, PulseFrequency, RampUp/DownFrequency, PrismEffectOn) = one number (Hz, or
            face count for PrismEffectOn); DoubleValue (the *FreqRange presets) = two numbers [min,max]
            in Hz; Picture (GoboMacro, GoboShakeMacro, GenericPicture) = one resource-name string. Empty
            for every other preset.'
          items:
            oneOf:
            - type: string
            - type: number
        aliases:
          type: array
          description: Read-only here; only non-empty when preset is Alias. Mutate via fixturedefs.channel.capability.alias.*.
          items:
            $ref: '#/components/schemas/FixtureDefsAlias'
        warning:
          type: string
          enum:
          - NoWarning
          - EmptyName
          - Overlapping
          description: Server-computed (QLCCapability::WarningType — the no-warning value is literally
            named NoWarning in the engine enum, not None), mirrors ChannelEdit::checkCapabilities. Informational
            only, never blocks a mutation or save.
    FixtureDefsChannel:
      type: object
      required:
      - channelId
      - name
      - group
      - colour
      - preset
      - defaultValue
      - controlByte
      - capabilities
      properties:
        channelId:
          type: string
          description: Server-assigned, stable for the lifetime of the session — see notes.md.
        name:
          type: string
        group:
          type: string
          enum:
          - Intensity
          - Colour
          - Gobo
          - Speed
          - Pan
          - Tilt
          - Shutter
          - Prism
          - Beam
          - Effect
          - Maintenance
          - Nothing
          - Position X
          - Position Y
          - Position Z
          - Rotation X
          - Rotation Y
          - Rotation Z
          - Scale X
          - Scale Y
          - Scale Z
          description: QLCChannel::Group as serialized by groupToString() (engine/src/ qlcchannel.h/.cpp).
            Previously missing the 9 3D-position/rotation/ scale groups used by matrix/pixel-bar fixtures
            with per-head spatial placement — their wire strings have a space ("Position X", not "PositionX")
            because groupToString() returns them that way; a definition using them was previously unrepresentable
            via this API and failed schema validation on read.
        colour:
          type: string
          enum:
          - Generic
          - Red
          - Green
          - Blue
          - Cyan
          - Magenta
          - Yellow
          - Amber
          - White
          - UV
          - Lime
          - Indigo
          description: Meaningful only when group is Intensity (an Intensity channel represents one primary
            color's dimmer). The "no specific primary colour" value is Generic, matching QLCChannel::colourToString()'s
            actual output for NoColour — the enum previously used the literal token "NoColour", which
            colourToString() never produces on the wire and stringToColour() only accepts by falling through
            its default case, not by recognizing the string "NoColour" itself.
        preset:
          type: string
          description: One of QLCChannel::Preset's names (Custom, IntensityDimmer, PositionPan, ColorMacro,
            NoFunction, ...). Not enumerated exhaustively — see qlcchannel.h; server validates via QLCChannel::stringToPreset.
            Setting this to non-Custom via fixturedefs.channel.update replaces the capability list.
        defaultValue:
          type: integer
          minimum: 0
          maximum: 255
        controlByte:
          type: string
          enum:
          - MSB
          - LSB
          description: Role in a 16-bit (fine) channel pair.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/FixtureDefsCapability'
    FixtureDefsModeChannelSlot:
      type: object
      required:
      - channelId
      properties:
        channelId:
          type: string
        actsOnChannelId:
          type:
          - string
          - 'null'
          description: For a fine/secondary channel, the channelId of the coarse channel it refines (mirrors
            QLCFixtureMode::channelActsOn/setChannelActsOn). Null if this slot doesn't act on another.
    FixtureDefsHead:
      type: object
      required:
      - headIndex
      - channelIds
      properties:
        headIndex:
          type: integer
          description: Position within the mode's head list; informational on read, used to address removal.
        channelIds:
          type: array
          items:
            type: string
          description: Channels (from this mode's channel slot list) that make up this head/beam, e.g.
            one head's Pan/Tilt/Colour/Gobo channels on a multi-head fixture.
    FixtureDefsMode:
      type: object
      required:
      - modeId
      - name
      - channels
      - heads
      - useGlobalPhysical
      - physical
      properties:
        modeId:
          type: string
          description: Server-assigned, stable for the lifetime of the session.
        name:
          type: string
        channels:
          type: array
          description: Ordered — array index is the DMX channel offset within this mode.
          items:
            $ref: '#/components/schemas/FixtureDefsModeChannelSlot'
        heads:
          type: array
          items:
            $ref: '#/components/schemas/FixtureDefsHead'
        useGlobalPhysical:
          type: boolean
        physical:
          oneOf:
          - $ref: '#/components/schemas/FixtureDefsPhysical'
          - type: 'null'
          description: Present only when useGlobalPhysical is false; null otherwise.
    FixtureDefsDefinition:
      type: object
      required:
      - manufacturer
      - model
      - type
      - author
      - isUser
      - sourceFile
      - physical
      - channels
      - modes
      properties:
        manufacturer:
          type: string
        model:
          type: string
        type:
          type: string
          enum:
          - Color Changer
          - Dimmer
          - Effect
          - Fan
          - Flower
          - Hazer
          - Laser
          - LED Bar (Beams)
          - LED Bar (Pixels)
          - Moving Head
          - Other
          - Scanner
          - Smoke
          - Strobe
          description: QLCFixtureDef::FixtureType as serialized by typeToString() / parsed by stringToType()
            (engine/src/qlcfixturedef.cpp). These are the engine's real wire strings — spaced, e.g. "Moving
            Head", "Color Changer", "LED Bar (Beams)" — matching what fixtures.yaml's FixturesPatchedFixture.fixtureType
            already documents correctly. Previously this enum used compact tokens (MovingHead, ColorChanger,
            LEDBarBeams, ...) that stringToType() does not recognize — any value in that old form silently
            falls through to "Other" when parsed by the engine, and a client comparing a fixturedefs.list
            entry's type against the same definition's fixtures.get/ fixtures.defs.getModel type would
            never see them match.
        author:
          type: string
        isUser:
          type: boolean
          description: false for a bundled/system definition (read-only until forked — see fixturedefs.session.forkToUser).
        sourceFile:
          type:
          - string
          - 'null'
          description: Absolute path this definition was loaded from / will be saved to; null for a session
            that has never been saved.
        physical:
          $ref: '#/components/schemas/FixtureDefsPhysical'
        channels:
          type: array
          description: The definition's unordered channel pool (QLCFixtureDef stores channels this way
            — order here carries no meaning; per-mode order lives in each mode's `channels`).
          items:
            $ref: '#/components/schemas/FixtureDefsChannel'
        modes:
          type: array
          items:
            $ref: '#/components/schemas/FixtureDefsMode'
    FixtureDefsLibraryEntry:
      type: object
      required:
      - manufacturer
      - model
      - type
      - author
      - isUser
      - channelCount
      - modeCount
      - defRevision
      description: 'Lightweight summary row for fixturedefs.list — mirrors QLCFixtureDefCache::fixtureCache().
        Cost warning: fixtureCache() only holds manufacturer/model/isUser; channelCount/modeCount/defRevision
        are NOT free, since QLCFixtureDefCache lazy-loads each definition''s full QXF only on first real
        access (QLCFixtureDef::checkLoaded(), engine/src/qlcfixturedef.cpp). Serving a single fixturedefs.list
        call with these three fields populated for every row means the server must force-load (parse XML
        for) every not-yet-loaded definition in the cache — potentially thousands of files on a fully-populated
        install — not just read an in-memory map. Implementers should budget for this (e.g. background-warm
        the cache at startup, or cache the summary rows themselves) rather than treating fixturedefs.list
        as a cheap call. Generic placeholder definitions (manufacturer="Generic", model= "Generic" or
        "RGBPanel" — the in-memory-only defs Fixture:: genericDimmerDef()/genericRGBPanelDef() build for
        a fixture patched with no real library definition) NEVER appear here: nothing ever registers them
        into QLCFixtureDefCache via addFixtureDef(), so they are absent from fixtureCache() and from this
        list. They are a distinct concept from the real bundled fixtures under manufacturer "Generic"
        that DO live on disk and DO appear here (e.g. model "Generic RGB", "Generic RGBW", "Generic Smoke"
        — resources/fixtures/Generic/*.qxf — real, non-placeholder model names). fixturedefs.get({manufacturer:
        "Generic", model: "Generic"}) or model:"RGBPanel" therefore returns NOT_FOUND, same as any other
        nonexistent manufacturer/model pair — there is no library-level way to fetch/list a fixture''s
        generic procedural definition through this domain; see fixtures.yaml''s isGeneric/FixturesDefinitionRef.generic
        for how the fixtures domain represents a generic-dimmer patch instead.'
      properties:
        manufacturer:
          type: string
        model:
          type: string
        type:
          type: string
          enum:
          - Color Changer
          - Dimmer
          - Effect
          - Fan
          - Flower
          - Hazer
          - Laser
          - LED Bar (Beams)
          - LED Bar (Pixels)
          - Moving Head
          - Other
          - Scanner
          - Smoke
          - Strobe
          description: See FixtureDefsDefinition.type — same engine typeToString()/stringToType() strings.
        author:
          type: string
        isUser:
          type: boolean
        channelCount:
          type: integer
        modeCount:
          type: integer
        defRevision:
          type: integer
    FixtureDefsSessionInfo:
      type: object
      required:
      - sessionId
      - manufacturer
      - model
      - isUser
      - isModified
      - sessionRevision
      - baseRevision
      description: Mirrors FixtureEditor::editorsList's entries, for fixturedefs.session.list.
      properties:
        sessionId:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        isUser:
          type: boolean
        isModified:
          type: boolean
          description: Mirrors EditorView::isModified — has this session diverged from what's on disk
            since it was opened/last saved.
        sessionRevision:
          type: integer
        baseRevision:
          type:
          - integer
          - 'null'
    FunctionsTypeEnum:
      type: string
      enum:
      - Scene
      - Chaser
      - EFX
      - Collection
      - Script
      - RGBMatrix
      - Show
      - Sequence
      - Audio
      - Video
      description: Function::Type bitmask enum, stringified (function.cpp typeToString).
    FunctionsRunOrderEnum:
      type: string
      enum:
      - Loop
      - SingleShot
      - PingPong
      - Random
    FunctionsDirectionEnum:
      type: string
      enum:
      - Forward
      - Backward
    FunctionsTempoTypeEnum:
      type: string
      enum:
      - Time
      - Beats
      - Original
      description: Time/Beats are the two persistable tempo types (Function::TempoType). Original is a
        sentinel only valid as an override param on functions.start, meaning "don't override, use the
        function's own tempoType".
    FunctionsBlendModeEnum:
      type: string
      enum:
      - Normal
      - Mask
      - Additive
      - Subtractive
      description: Universe::BlendMode, PascalCase matching Universe::blendModeToString()/stringToBlendMode()
        verbatim. This is the single canonical schema for the one persisted blendMode field - RGBMatrix::setBlendMode
        (functions-advanced.yaml, FunctionsRgbMatrixConfig.blendMode) overrides the generic Function-level
        setter but writes the same underlying value, so functions-advanced.yaml references this schema
        directly rather than redefining its own enum (previously a separate, differently-cased `FunctionsBlendMode`
        schema there - fixed since a value read from functions.get's blendMode could not be written back
        through functions.rgbmatrix.setConfig without a client-side case translation).
    FunctionsSpeedModeEnum:
      type: string
      enum:
      - Default
      - Common
      - PerStep
      description: Chaser::SpeedMode - also used by Sequence, which subclasses Chaser.
    FunctionsFadeControlModeEnum:
      type: string
      enum:
      - FromFunction
      - Blended
      - Crossfade
      - BlendedCrossfade
      description: Chaser::FadeControlMode, used by functions.chaser.setAction's fadeMode.
    FunctionsEfxAlgorithmEnum:
      type: string
      enum:
      - Circle
      - Eight
      - Line
      - Line2
      - Diamond
      - Square
      - SquareChoppy
      - SquareTrue
      - Leaf
      - Lissajous
    FunctionsEfxPropagationModeEnum:
      type: string
      enum:
      - Parallel
      - Serial
      - Asymmetric
    FunctionsEfxFixtureModeEnum:
      type: string
      enum:
      - PanTilt
      - Dimmer
      - RGB
      description: EFXFixture::Mode - which parameter(s) this fixture's participation animates. A clean-slate
        naming choice for the PanTilt value (every other enum in this fragment matches the engine's own
        XML string verbatim) - the engine's on-wire/XML string for it is "Position" (KXMLQLCEFXFixtureModePanTilt
        in engine/src/efxfixture.h), so a server implementation must map PanTilt<->"Position" explicitly
        rather than passing the enum value straight through.
    FunctionsDocRevisionResult:
      type: object
      required:
      - docRevision
      properties:
        docRevision:
          type: integer
    FunctionsCreateResult:
      type: object
      required:
      - functionId
      - docRevision
      properties:
        functionId:
          type: string
        docRevision:
          type: integer
    FunctionsPatchOp:
      type: object
      required:
      - op
      - path
      description: One RFC 6902 JSON Patch operation.
      properties:
        op:
          type: string
          enum:
          - add
          - remove
          - replace
          - move
        path:
          type: string
        from:
          type: string
          description: Only present when op is move.
        value: {}
    FunctionsAttribute:
      type: object
      required:
      - index
      - name
      - value
      - min
      - max
      description: 'Function::Attribute (registerAttribute/attributes()). Index 0 is Intensity for every
        function type EXCEPT Show, which unregisters its own Intensity attribute in its constructor (Show::Show,
        engine/src/show.cpp) so its attributes map 1:1 onto its tracks instead - resolve by name, don''t
        hardcode index 0. overridden/overrideValue reflect the engine''s separate runtime attribute-override
        mechanism (Function::requestAttributeOverride/adjustAttribute/releaseAttributeOverride) - e.g.
        a VC control layered on top of this function''s own base value. This is read-only telemetry here:
        functions.adjustAttribute only ever writes the base `value`, and there is currently no client-facing
        way to request or release an override, or to know who holds one - a real gap (see functions.adjustAttribute''s
        own description) worth a dedicated override-lifecycle API in a future revision, tracked rather
        than silently implied by these two fields.'
      properties:
        index:
          type: integer
        name:
          type: string
        value:
          type: number
        min:
          type: number
        max:
          type: number
        overridden:
          type: boolean
        overrideValue:
          type: number
        flags:
          type: array
          description: Function::Attribute's registration flags (Function::OverrideFlags), informational
            - describes how concurrent overrides on this attribute combine, not something a client sets.
          items:
            $ref: '#/components/schemas/FunctionsAttributeFlagEnum'
    FunctionsAttributeFlagEnum:
      type: string
      enum:
      - Multiply
      - LastWins
      - Single
      description: 'Function::OverrideFlags (engine/src/function.h). Multiply: the base value is multiplied
        by the overridden value(s). LastWins: the last-applied override replaces the base value outright.
        Single: only one override ID is ever allowed for this attribute at a time.'
    FunctionsSummary:
      type: object
      required:
      - id
      - name
      - type
      - path
      - hidden
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/FunctionsTypeEnum'
        path:
          type: string
          description: Folder path, always the simplified/bare form (Function::path(true) - no leading
            "<TypeString>/" prefix). Use this form as-is when sending functions.move's path param; the
            type-prefixed form Function::path() returns by default in the engine (e.g. "Scene/MyFolder")
            is never what's on the wire here.
        hidden:
          type: boolean
          description: Function::isVisible() negated.
    FunctionsDetail:
      type: object
      required:
      - id
      - name
      - type
      - path
      - hidden
      - runOrder
      - direction
      - tempoType
      - fadeInSpeed
      - fadeOutSpeed
      - duration
      - totalDuration
      - blendMode
      - attributes
      - typeDetail
      description: Generic Function base detail, valid for all 10 types. Type-specific detail (values/steps/geometry/members)
        is always present as typeDetail below (the old per-type functions.<type>.get calls were consolidated
        away on the premise that it's never absent).
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/FunctionsTypeEnum'
        path:
          type: string
          description: See FunctionsSummary.path - always the simplified/bare form.
        hidden:
          type: boolean
        runOrder:
          $ref: '#/components/schemas/FunctionsRunOrderEnum'
        direction:
          $ref: '#/components/schemas/FunctionsDirectionEnum'
        tempoType:
          $ref: '#/components/schemas/FunctionsTempoTypeEnum'
        fadeInSpeed:
          type: integer
          description: 'Milliseconds, or beats if tempoType is Beats. Two sentinel values are valid on
            this and every other speed/duration field in this fragment (fadeOutSpeed, duration below,
            ChaserStep/SequenceStep fadeIn/hold/fadeOut/duration, functions.update''s speed params): 4294967294
            ((uint)-2, Function::infiniteSpeed()) means "infinite"/"hold forever" - one of the most common
            real step configurations - and 4294967295 ((uint)-1, Function::defaultSpeed()) means "use
            the default" (only meaningful in specific contexts, e.g. as a Chaser/Sequence speed-mode fallback).
            Clients send/receive these as plain (large) integers, not a separate null/"infinite" wire
            form.'
        fadeOutSpeed:
          type: integer
          description: See fadeInSpeed above for the sentinel encoding.
        duration:
          type: integer
          description: See fadeInSpeed above for the sentinel encoding.
        totalDuration:
          type: integer
          description: Function::totalDuration() - considers steps/stretch, may differ from duration.
        blendMode:
          $ref: '#/components/schemas/FunctionsBlendModeEnum'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/FunctionsAttribute'
        typeDetail:
          description: Type-specific detail, discriminated by `type` above. Replaces the old per-type
            functions.<type>.get round-trip - this single functions.get call now returns everything. Each
            branch still carries its own functionId/docRevision fields as originally authored (redundant
            with .id / the show's docRevision - left as-is by the consolidation pass rather than risk
            editing field semantics; a cosmetic follow-up, not a correctness issue).
          oneOf:
          - $ref: '#/components/schemas/FunctionsAudioDetail'
          - $ref: '#/components/schemas/FunctionsChaserDetail'
          - $ref: '#/components/schemas/FunctionsCollectionDetail'
          - $ref: '#/components/schemas/FunctionsEfxDetail'
          - $ref: '#/components/schemas/FunctionsRgbMatrixDetail'
          - $ref: '#/components/schemas/FunctionsSceneDetail'
          - $ref: '#/components/schemas/FunctionsScriptDetail'
          - $ref: '#/components/schemas/FunctionsSequenceDetail'
          - $ref: '#/components/schemas/FunctionsShowDetail'
          - $ref: '#/components/schemas/FunctionsVideoDetail'
    FunctionsStatusData:
      type: object
      required:
      - functionId
      - running
      - paused
      - elapsed
      description: 4b live/runtime status - see 00-conventions.md §4b, not revision-gated.
      properties:
        functionId:
          type: string
        running:
          type: boolean
        paused:
          type: boolean
        elapsed:
          type: integer
          description: Milliseconds since start (Function::elapsed()).
        elapsedBeats:
          type: integer
          description: Present when tempoType is Beats (Function::elapsedBeats()).
        attributes:
          type: array
          description: Current effective (possibly overridden) attribute values, same shape as FunctionsDetail.attributes.
          items:
            $ref: '#/components/schemas/FunctionsAttribute'
        currentStepIndex:
          type: integer
          description: Present for a running Chaser/Sequence (Chaser::currentStepIndex()).
        runningStepsNumber:
          type: integer
          description: Present for a running Chaser/Sequence - number of steps currently crossfading (Chaser::runningStepsNumber()).
    FunctionsSceneValues:
      type: object
      description: A Scene's channel value list, keyed by "<fixtureId>.<channel>" (channel is relative
        to the fixture, per SceneValue) mapping to a 0-255 value. Modeled as a map rather than an array
        (mirroring the engine's own QMap<SceneValue, uchar> storage in Scene::m_values) specifically so
        single-channel JSON Patch ops can address one entry by key instead of by fragile array index -
        see functions-core-notes.md.
      additionalProperties:
        type: integer
        minimum: 0
        maximum: 255
    FunctionsSceneChannelGroupRef:
      type: object
      required:
      - id
      - level
      properties:
        id:
          type: string
          description: ChannelsGroup id (Scene::addChannelGroup).
        level:
          type: integer
          minimum: 0
          maximum: 255
    FunctionsSceneDetail:
      type: object
      required:
      - functionId
      - values
      - fixtures
      - fixtureGroups
      - channelGroups
      - palettes
      properties:
        functionId:
          type: string
        values:
          $ref: '#/components/schemas/FunctionsSceneValues'
        fixtures:
          type: array
          items:
            type: string
          description: Scene::fixtures() - whole fixtures participating (as opposed to individual channel
            values).
        fixtureGroups:
          type: array
          items:
            type: string
        channelGroups:
          type: array
          items:
            $ref: '#/components/schemas/FunctionsSceneChannelGroupRef'
        palettes:
          type: array
          items:
            type: string
          description: Referenced Palette ids (Scene::palettes()). Palette/color-filter definitions themselves
            are out of scope for this fragment - see notes.md.
        blendFunctionId:
          type:
          - string
          - 'null'
          description: Scene::blendFunctionID() - function to blend from when preparing this Scene's faders.
    FunctionsChaserStep:
      type: object
      required:
      - targetFunctionId
      - fadeIn
      - hold
      - fadeOut
      - duration
      additionalProperties: false
      description: 'ChaserStep, without the .values field (that''s Sequence-only, see FunctionsSequenceStep).
        `additionalProperties: false` is deliberate: it''s what makes this schema and FunctionsSequenceStep
        mutually exclusive under the `step` oneOf in functions.steps.addStep/replaceStep (a Sequence step''s
        `values` field would otherwise be silently accepted here too, and vice versa for `targetFunctionId`,
        letting both oneOf branches match the same object). hold is the authoritative field; duration
        is fadeIn + hold, with the same infinite-sentinel propagation described on FunctionsSequenceStep.hold
        below. If a client sends inconsistent fadeIn/hold/duration, the server recomputes duration from
        fadeIn+hold (ChaserStep::loadXML''s behavior).'
      properties:
        targetFunctionId:
          type: string
          description: ChaserStep::fid - the Function this step runs.
        fadeIn:
          type: integer
          minimum: 0
          description: Milliseconds. See FunctionsDetail.fadeInSpeed for the infinite/default sentinel
            encoding - fadeIn itself is not normally infinite, but is included in duration's derivation
            below.
        hold:
          type: integer
          minimum: 0
          description: Milliseconds, or the infinite sentinel (Function::infiniteSpeed(), see FunctionsDetail.fadeInSpeed)
            meaning "hold forever" - one of the most common real step configurations. Authoritative over
            duration - see the schema description above.
        fadeOut:
          type: integer
          minimum: 0
        duration:
          type: integer
          minimum: 0
          description: Derived as fadeIn + hold (or mirrors hold's infinite sentinel when hold is infinite)
            - see the schema description above for which field wins if a client's values disagree.
        note:
          type: string
    FunctionsChaserDetail:
      type: object
      required:
      - functionId
      - steps
      - fadeInMode
      - fadeOutMode
      - durationMode
      additionalProperties: false
      properties:
        functionId:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FunctionsChaserStep'
        fadeInMode:
          $ref: '#/components/schemas/FunctionsSpeedModeEnum'
        fadeOutMode:
          $ref: '#/components/schemas/FunctionsSpeedModeEnum'
        durationMode:
          $ref: '#/components/schemas/FunctionsSpeedModeEnum'
    FunctionsSequenceStep:
      type: object
      required:
      - fadeIn
      - hold
      - fadeOut
      - duration
      - values
      additionalProperties: false
      description: 'A Sequence step (ChaserStep in sequence mode). Unlike a Chaser step it has no targetFunctionId
        of its own - every step implicitly targets the Sequence''s boundSceneId, and instead carries its
        own value overrides. `additionalProperties: false` is deliberate - see FunctionsChaserStep''s
        description for why.'
      properties:
        fadeIn:
          type: integer
          minimum: 0
        hold:
          type: integer
          minimum: 0
          description: Same authoritative-over-duration and infinite-sentinel semantics as FunctionsChaserStep.hold.
        fadeOut:
          type: integer
          minimum: 0
        duration:
          type: integer
          minimum: 0
          description: See FunctionsChaserStep.duration.
        note:
          type: string
        values:
          $ref: '#/components/schemas/FunctionsSceneValues'
    FunctionsSequenceDetail:
      type: object
      required:
      - functionId
      - boundSceneId
      - steps
      - fadeInMode
      - fadeOutMode
      - durationMode
      additionalProperties: false
      description: '`additionalProperties: false` is deliberate: without it, a freshly-created 0-step
        Sequence (which has every field FunctionsChaserDetail requires, plus boundSceneId) would validate
        against *both* branches of FunctionsDetail.typeDetail''s oneOf, since FunctionsChaserDetail''s
        required set is a strict subset of this schema''s and neither closed out extra properties - failing
        oneOf''s "exactly one match" rule for every empty Sequence. Closing both schemas makes them mutually
        exclusive instead.'
      properties:
        functionId:
          type: string
        boundSceneId:
          type: string
          description: Sequence::boundSceneID().
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FunctionsSequenceStep'
        fadeInMode:
          $ref: '#/components/schemas/FunctionsSpeedModeEnum'
        fadeOutMode:
          $ref: '#/components/schemas/FunctionsSpeedModeEnum'
        durationMode:
          $ref: '#/components/schemas/FunctionsSpeedModeEnum'
    FunctionsEfxFixture:
      type: object
      required:
