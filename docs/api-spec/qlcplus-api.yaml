    CoreLogEvent:
      payload:
        type: object
        required:
        - type
        - topic
        - data
        description: 'Structured equivalent of QLC+''s own message handler (see qmlui/main.cpp''s qInstallMessageHandler,
          only installed today under -d). The server is expected to install a process-wide Qt message
          handler and republish every qDebug/qWarning/qCritical/qFatal call engine-wide through this event,
          so an Electron UI gets an error console with parity to what -d currently dumps to stderr - not
          just core-domain messages, this is the generic sink for the whole engine process. Subscribe-gated
          (see core-notes.md): pick the single "core.log" topic for a firehose, or one of the per-level
          topics to filter volume.'
        properties:
          type:
            const: event
          topic:
            type: string
            enum:
            - core.log
            - core.log.debug
            - core.log.info
            - core.log.warning
            - core.log.critical
          originClientId:
            type: 'null'
            description: Always null - these originate from engine-internal logging, never from a specific
              client's request.
          data:
            type: object
            required:
            - level
            - message
            - timestampMs
            properties:
              level:
                type: string
                enum:
                - debug
                - info
                - warning
                - critical
                - fatal
                description: fatal messages are also published on the core.log.critical topic (there is
                  no separate core.log.fatal topic, see core-notes.md).
              message:
                type: string
              timestampMs:
                type: integer
                description: Wall-clock epoch milliseconds. (Tardis's own internal timestamps are process-uptime-relative,
                  not wall-clock - the server must convert, see core-notes.md.)
              file:
                type:
                - string
                - 'null'
                description: Source file, from QMessageLogContext, when available.
              line:
                type:
                - integer
                - 'null'
              function:
                type:
                - string
                - 'null'
