        - data
        description: 'Cadence depends on clockType (VCClock::setClockType()/playPauseTimer()): a plain
          wall-clock display (Clock) ticks at 1 Hz, but a RUNNING Stopwatch or Countdown ticks every 100
          ms (10 Hz), not 1 Hz - the engine switches m_timer''s interval when the timer starts. Also broadcast
          immediately (off-cadence) on play/pause/reset. Subscribe-gated - see notes.md for the real per-clockType
          rate, not a flat "1Hz per widget" assumption.'
        properties:
