            type: string
          method:
            const: fixturedefs.mode.rename
          params:
            type: object
            required:
            - sessionId
            - baseRevision
            - modeId
            - name
            description: Renames a mode (named `.rename`/`fixturedefs.mode.rename` per 00-conventions.md
              §8's rename convention — this method only ever renames, it never touches channels/physical/heads,
              unlike a true partial `.update`). Mirrors EditorView::modeNameChanged, which calls updateAliasList()
              after the rename — but that only rebuilds qmlui's own display list of alias rows; it does
              NOT rewrite any alias's stored targetMode string. Since aliases address modes by name (FixtureDefsAlias.targetMode),
              renaming a mode silently orphans every alias whose targetMode equals the old name — they
              keep pointing at a mode name that no longer exists. Neither the engine nor fixturedefs.session.validate
              currently detects or flags this; a client should re-point affected aliases itself (fixturedefs.channel.capability.alias.update)
              after a mode rename if it cares about keeping them valid. See fixturedefs. channel.update's
              `name` property for the equivalent invariant on channel rename.
            properties:
              sessionId:
                type: string
              baseRevision:
                type: integer
              modeId:
                type: string
              name:
                type: string
