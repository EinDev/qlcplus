                type: integer
              baseRevision:
                type: integer
    VcWidgetPresetRemoveResponse:
      payload:
        oneOf:
        - $ref: '#/components/messages/VcDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'
    VcWidgetPresetApplyRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: vc.widget.preset.apply
          params:
            type: object
            required:
            - widgetId
            - presetId
            description: 'Live activation of a stored preset - server-side behavior depends entirely on
              $widgetId''s widgetType, since this one method serves multiple engine calls with different
              semantics and, for one widget type, no server-side effect at all: - XYPad: VCXYPad::applyPreset()
              - moves the cursor and, for an EFX/Scene preset, starts the underlying Function fitted to
              the pad''s range window. - Animation: VCAnimation::applyPreset() - for Color1..Color5/Color1Reset..Color5Reset
              presets, sets/clears that color slot; for Animation/Text presets, selects the algorithm
              and (if the fader level is already > 0) applies the preset''s content immediately. Knob-type
              presets are the one exception: applyPreset() no-ops for them server-side (they have no single
              "apply" moment) - use vc.animation.setPresetKnobValue instead, which is the actual live
              control for a Knob preset. - SpeedDial: NOT SUPPORTED. VCSpeedDial has no applyPreset counterpart
              in the engine at all (only add/remove/rename/setValue on the preset list itself). "Applying"
              a SpeedDial preset is purely a client-side gesture: look up the preset''s stored value in
              VcSpeedDialPreset and send that value via vc.speedDial.setCurrentTime - do not send vc.widget.preset.apply
              for a SpeedDial widgetId, it has no defined effect.'
            properties:
              widgetId:
                type: string
              presetId:
                type: integer
    VcWidgetPresetApplyResponse:
      payload:
        oneOf:
        - $ref: '#/components/messages/GenericAckResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'
    VcWidgetPresetAddRequest:
