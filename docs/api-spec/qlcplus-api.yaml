            properties:
              files:
                type: array
                description: Most-recently-opened first, capped at 10 entries (matches App::MAX_RECENT_FILES).
                items:
                  $ref: '#/components/schemas/CoreRecentFileEntry'
    CoreProjectRecentFilesChangedEvent:
      payload:
        type: object
        required:
        - type
        - topic
        - data
        properties:
          type:
            const: event
          topic:
            const: core.project.recentFilesChanged
          originClientId:
            type:
            - string
            - 'null'
          data:
            type: object
            required:
