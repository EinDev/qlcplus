        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: vc.widget.inputDetect.stop
          params:
            type: object
            description: VirtualConsole::disableAutoDetection() - cancels learn mode for WHICHEVER widget
              currently holds the single global autodetect slot. No widgetId param here because the engine
              method itself takes no argument - see VcWidgetInputDetectStartRequest, there is at most
              one widget learning at a time server-wide, not one per requesting client.
