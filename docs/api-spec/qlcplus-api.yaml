        - $ref: '#/components/messages/GenericAckResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'
    FunctionsAdjustAttributeRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: functions.adjustAttribute
          params:
            type: object
            required:
            - functionId
            - value
            anyOf:
            - required:
              - attributeIndex
            - required:
              - attributeName
            description: Exactly one of attributeIndex/attributeName must be present (enforced above via
              anyOf, not just prose). Writes the attribute's persisted base value directly (Function::adjustAttribute
              with attributeId < the override-ID range) - the same thing a Function editor does, not a
              live runtime override. The engine also supports a separate override-acquire/release mechanism
              (Function::requestAttributeOverride/ releaseAttributeOverride, used e.g. by VC controls
              layered on top of a function's own value) with no client-facing equivalent here - see FunctionsAttribute.overridden/overrideValue
              for the read side of that gap.
            properties:
              functionId:
                type: string
              attributeIndex:
                type: integer
                description: Index from FunctionsDetail.attributes. NOT reliably 0 = Intensity - true
                  for most function types, but Show unregisters its Intensity attribute entirely (Show::Show,
                  see engine/src/show.cpp), so index 0 on a Show is its first Track-mapped attribute.
                  Always resolve by name or by walking FunctionsDetail.attributes, don't hardcode index
                  0.
              attributeName:
                type: string
              value:
                type: number
                description: Clamped server-side to the target attribute's own FunctionsAttribute.min/max
                  (which varies per attribute and function type - e.g. EFX Width is 0-127, Video X-rotation
                  is -360..360 - NOT a universal 0..1 range).
    FunctionsAdjustAttributeResponse:
      payload:
        oneOf:
        - $ref: '#/components/messages/GenericAckResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'
