asyncapi: 3.0.0
info:
  title: QLC+ Control API
  version: 1.0.0
  description: 'WebSocket control API for QLC+, designed to let a client (e.g. a future Electron UI) fully
    replace the built-in qmlui application: patch fixtures, author fixture definitions, build and run
    every function type, build and drive the Virtual Console, configure I/O and plugins, and observe live
    engine/DMX state. See docs/api-spec/00-conventions.md for the full protocol contract (envelope, concurrency
    model, subscriptions, locking, errors).'
defaultContentType: application/json
servers:
  local:
    host: localhost:9010
    pathname: /qlcplusapi
    protocol: ws
    description: '9010 is ApiServer::API_SERVER_DEFAULT_PORT (controlapi/src/apiserver.h) — this API''s
      actual listen port. Port 9999 is a DIFFERENT, older server (webaccess''s legacy pipe-delimited remote-control
      protocol, webaccess/src/webaccess.cpp) — do not use it here. The pathname above is decorative only:
      QWebSocketServer does not route by path, so the server accepts the WebSocket handshake regardless
      of what pathname the client connects with; there is nothing to implement server-side to "support"
      it.'
channels:
  qlcplus:
    address: /qlcplusapi
    description: Single bidirectional channel. Every frame is a request, response, or event per the envelope
      in 00-conventions.md §2. Message list below is the generic/session set; every domain fragment adds
      its own request, response, and event messages to this same channel at merge time.
    messages:
      helloRequest:
        $ref: '#/components/messages/HelloRequest'
      welcomeResponse:
        $ref: '#/components/messages/WelcomeResponse'
      subscribeRequest:
        $ref: '#/components/messages/SubscribeRequest'
