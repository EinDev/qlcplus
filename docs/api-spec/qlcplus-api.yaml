            properties:
              sessionId:
                type: string
              baseRevision:
                type: integer
              channelId:
                type: string
              capabilityIndex:
                type: integer
              targetMode:
                type: string
                description: Name of the mode this substitution applies in.
              targetChannel:
                type: string
