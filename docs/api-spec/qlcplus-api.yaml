            description: Replaces the mode's entire ordered channel slot list in one call (array index
              = DMX offset within the mode). This deliberately collapses ModeEdit's fine-grained addChannel(index)/moveChannel(index)/deleteChannel/
              setActsOnChannel C++ API into a single "set the whole list" operation — see notes.md. Every
              channelId must already exist in the definition's channel pool (fixturedefs.channel.add it
              first if needed). A slot's actsOnChannelId cannot equal its own channelId (INVALID_PARAMS
              / FIXTUREDEFS_ACTS_ON_SELF) — the legacy editor only warns about this at save time, this
              API rejects it immediately.
