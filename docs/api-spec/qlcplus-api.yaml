    VcButtonPressRequest:
      payload:
        type: object
        required:
        - type
        - id
        - method
        - params
        properties:
          type:
            const: request
          id:
            type: string
          method:
            const: vc.button.press
          params:
            type: object
            required:
            - widgetId
            - pressed
            description: 'VCButton::requestStateChange() - the single gesture backing press-and-release
              (Flash), a full click (Toggle/Blackout), and "panic" (StopAll, $pressed ignored). Live (§4b):
              no baseRevision. Behaviour branches on the widget''s actionType (document-state, see VcButtonConfig):
              Toggle starts/stops functionID; Flash keeps it running only while pressed=true; Blackout
              toggles global blackout (mirrors io.blackout.toggle - see notes.md); StopAll fades/stops
              every running Function. IMPORTANT - one message per click, NOT a press/release pair, for
              every actionType except Flash: for Toggle and Blackout, the engine flips its own current
              state on every single invocation of this method regardless of the $pressed value (Toggle
              reads its own Function::isRunning-equivalent state; Blackout calls toggleBlackout() unconditionally
              every call) - sending a press(pressed=true) then a release(pressed=false) for one physical
              click, the way a naive client modeling "press" and "release" as two edges would, toggles
              twice and is a net no-op (a Blackout button would visibly not blackout). StopAll likewise
              fires unconditionally on every call and ignores $pressed entirely. The real qmlui client
              (VCButtonItem.qml) sends exactly one requestStateChange call per click for these three actionTypes
              (from the mouse/touch "released" handler, with $pressed set to the button''s *new* target
              state purely for the state()-bookkeeping side effect, not as a toggle trigger). Flash is
              the sole exception and is genuinely edge-triggered: send pressed=true on press-down and
              pressed=false on release, mirroring vc.slider.flash''s "on" param.'
            properties:
              widgetId:
                type: string
              pressed:
                type: boolean
