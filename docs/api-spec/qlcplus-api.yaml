    FunctionsRgbMatrixAlgorithmType:
      type: string
      enum:
      - plain
      - text
      - script
      - image
      - audio
      description: RGBAlgorithm::Type. 'audio' here means the audio-reactive color algorithm (RGBAudio),
        unrelated to the Audio function type.
    FunctionsRgbMatrixAlgorithm:
      type: object
      required:
      - type
      description: 'Flat, not a strict oneOf: only the fields relevant to `type` are meaningful, the rest
        are ignored by the engine. See functions-advanced-notes.md for why this shape was chosen over
        a discriminated union.'
      properties:
        type:
          $ref: '#/components/schemas/FunctionsRgbMatrixAlgorithmType'
        scriptName:
          type: string
          description: type=script only. One of functions.rgbmatrix.listAlgorithms' script entries
        scriptProperties:
          type: array
          description: type=script only. Current values of the script's exposed properties.
          items:
            type: object
            required:
            - name
            - value
            properties:
              name:
                type: string
              value:
                type: string
        text:
          type: string
          description: type=text only
        font:
          type: object
          description: type=text only. Deliberate subset of the engine's full QFont (RGBText stores/round-trips
            a complete QFont, and the real editor exposes it via a native font picker, qmlui/rgbmatrixeditor.h's
            algoTextFont) - only family/pointSize/bold/italic are exposed here. Other QFont attributes
            the editor lets you set (underline, weight values beyond plain bold/regular, stretch, letter
            spacing, etc.) are not represented in this schema; a client-authored functions.rgbmatrix.setConfig
            silently drops/resets them rather than preserving whatever the file already had.
          properties:
            family:
              type: string
            pointSize:
              type: integer
            bold:
              type: boolean
            italic:
              type: boolean
        imagePath:
          type: string
          description: type=image only. Path resolved on the engine host machine.
        animationStyle:
          type: string
          description: 'type=text only: one of staticLetters, horizontal, vertical. type=image only: one
            of static, horizontal, vertical, animation (the animated-source case, e.g. an animated GIF).'
          enum:
          - staticLetters
          - static
          - horizontal
          - vertical
          - animation
        xOffset:
          type: integer
          description: type=text|image only
        yOffset:
          type: integer
          description: type=text|image only
    FunctionsRgbMatrixScriptPropertyDef:
      type: object
