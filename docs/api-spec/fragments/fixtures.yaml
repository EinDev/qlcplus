# Fixtures domain fragment.
#
# Scope: browsing the fixture-definition library (read-only — authoring defs
# themselves belongs to the "fixturedefs" domain), patching real fixtures
# into universes, fixture groups (2D layout grid), and one-shot fixture
# remapping. Grounded in engine/src/{qlcfixturedefcache,qlcfixturedef,
# qlcfixturemode,qlcfixturehead,qlcchannel,qlccapability,fixture,doc,
# fixturegroup,fixtureremapper}.h/.cpp and qmlui/{fixturemanager,
# fixturebrowser,fixturegroupeditor,fixtureremapmanager,fixtureutils}.
#
# See fixtures-notes.md for open questions, scope cuts, lockable resources,
# subscribe-gating and channel-message keys to add at merge time.

messages:

  # =====================================================================
  # 1. Fixture definition library browsing (read-only)
  # =====================================================================

  FixturesDefsListManufacturersRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.defs.listManufacturers }
        params:
          type: object
          description: No parameters. Present for envelope symmetry.

  FixturesDefsListManufacturersResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDefsListManufacturersOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesDefsListManufacturersOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [manufacturers]
          properties:
            manufacturers:
              type: array
              items: { type: string }
              description: >
                Sorted list of manufacturer names known to the fixture
                definition cache (QLCFixtureDefCache::manufacturers()).

  FixturesDefsListModelsRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.defs.listModels }
        params:
          type: object
          required: [manufacturer]
          properties:
            manufacturer: { type: string }

  FixturesDefsListModelsResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDefsListModelsOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesDefsListModelsOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [manufacturer, models, modelDetails]
          description: >
            Unknown manufacturer -> NOT_FOUND (never an empty list). Answered
            from QLCFixtureDefCache::fixtureCache(), i.e. FixturesMap.xml's
            index - no definition file is loaded by this call.
          properties:
            manufacturer: { type: string }
            models:
              type: array
              description: Plain model names, sorted (the web UI contract's shape).
              items: { type: string }
            modelDetails:
              type: array
              description: QLCFixtureDefCache::fixtureCache()[manufacturer], as a list - same models with their isUser flag.
              items:
                type: object
                required: [model, isUser]
                properties:
                  model: { type: string }
                  isUser:
                    type: boolean
                    description: >
                      true if this definition lives in the user's own
                      fixture-definition folder rather than the system one
                      (QLCFixtureDef::isUser()).

  FixturesDefsGetModelRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.defs.getModel }
        params:
          type: object
          required: [manufacturer, model]
          properties:
            manufacturer: { type: string }
            model: { type: string }

  FixturesDefsGetModelResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDefsGetModelOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesDefsGetModelOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [manufacturer, model, type, fixtureType, author, isUser, physical, modes]
          description: >
            Unknown manufacturer/model -> NOT_FOUND. This call lazily loads
            the definition file (QLCFixtureDefCache::fixtureDef() ->
            QLCFixtureDef::checkLoaded()), so modes/channels are complete.
          properties:
            manufacturer: { type: string }
            model: { type: string }
            type:
              type: string
              description: Same value as fixtureType (web UI contract spelling).
            fixtureType:
              type: string
              description: >
                QLCFixtureDef::FixtureType as string via typeToString()
                (e.g. "Moving Head", "Dimmer", "Color Changer", "Scanner"...).
            author: { type: string }
            isUser: { type: boolean }
            physical:
              $ref: '#/components/schemas/FixturesPhysical'
              description: The definition's global physical block (QLCFixtureDef::physical()).
            modes:
              type: array
              description: >
                Every mode with its channel list inline (so an Add Fixture
                dialog can show a mode's channels without a round-trip per
                mode); fixtures.defs.getMode adds heads, physical and the
                master intensity channel.
              items:
                type: object
                required: [name, channelCount, channels]
                properties:
                  name: { type: string }
                  channelCount: { type: integer }
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/FixturesModeChannel'

  FixturesDefsGetModeRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.defs.getMode }
        params:
          type: object
          required: [manufacturer, model, mode]
          properties:
            manufacturer: { type: string }
            model: { type: string }
            mode: { type: string }

  FixturesDefsGetModeResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDefsGetModeOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesDefsGetModeOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [manufacturer, model, mode, channelCount, physical, channels, heads]
          properties:
            manufacturer: { type: string }
            model: { type: string }
            mode: { type: string }
            channelCount: { type: integer }
            masterIntensityChannel:
              type: [integer, "null"]
              description: QLCFixtureMode::masterIntensityChannel(), null if none auto-detected.
            physical:
              $ref: '#/components/schemas/FixturesPhysical'
            useGlobalPhysical:
              type: boolean
              description: QLCFixtureMode::useGlobalPhysical() — whether "physical" above is the fixture's global one or a mode-specific override.
            channels:
              type: array
              description: Ordered by DMX channel index within the mode (QLCFixtureMode::channels()).
              items:
                $ref: '#/components/schemas/FixturesModeChannel'
            heads:
              type: array
              description: QLCFixtureMode::heads() — enough for a patch dialog to preview head layout.
              items:
                $ref: '#/components/schemas/FixturesModeHead'

  # =====================================================================
  # 2. Patching
  # =====================================================================

  FixturesListRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.list }
        params:
          type: object
          properties:
            universe:
              type: integer
              description: Optional filter — only fixtures patched into this universe.

  FixturesListResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesListOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesListOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [fixtures]
          properties:
            fixtures:
              type: array
              items:
                $ref: '#/components/schemas/FixturesPatchedFixture'

  FixturesGetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.get }
        params:
          type: object
          required: [fixtureId]
          properties:
            fixtureId: { type: string }

  FixturesGetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesGetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          $ref: '#/components/schemas/FixturesPatchedFixtureDetail'

  FixturesFindAvailableAddressRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.findAvailableAddress }
        params:
          type: object
          required: [universe, channels, requestedAddress]
          description: >
            Mirrors FixtureBrowser::availableChannel() — used by a patch
            dialog to default/validate the address field before submitting
            fixtures.patch. Purely advisory: fixtures.patch still
            authoritatively re-checks and can still return
            FIXTURES_ADDRESS_OVERLAP if the address was taken between this
            call and the patch request.
          properties:
            universe: { type: integer }
            channels:
              type: integer
              description: Channel footprint of one fixture instance.
            quantity: { type: integer, default: 1 }
            gap: { type: integer, default: 0 }
            requestedAddress: { type: integer, description: "0-based DMX address to try first." }
            excludeFixtureId:
              type: string
              description: >
                When checking whether a fixture can move to a new address,
                pass its own id here so it doesn't conflict with itself
                (mirrors the fixtureID overload of availableChannel()).

  FixturesFindAvailableAddressResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesFindAvailableAddressOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesFindAvailableAddressOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [available]
          properties:
            available:
              type: boolean
              description: false if no free block could be found anywhere in the universe.
            address:
              type: integer
              description: >
                The requested address if free, otherwise the first free
                address found. Absent if available is false.

  FixturesPatchRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.patch }
        params:
          type: object
          required: [universe, address, baseRevision]
          description: >
            The definition may be given either as the nested `definition`
            object below or - the web UI contract's spelling - as flat
            top-level manufacturer/model/mode (or generic) params, which are
            used whenever `definition` is absent. One of the two forms is
            required.
          properties:
            universe: { type: integer, description: "0-based universe index." }
            address: { type: integer, description: "0-based DMX address (0-511) for the first fixture." }
            definition:
              $ref: '#/components/schemas/FixturesDefinitionRef'
            manufacturer: { type: string, description: "Flat alias of definition.manufacturer." }
            model: { type: string, description: "Flat alias of definition.model." }
            mode: { type: string, description: "Flat alias of definition.mode." }
            name:
              type: string
              description: >
                Base friendly name. The engine appends " [<n>]"
                unconditionally — even for a single fixture (quantity == 1)
                — using the new fixture's own id + 1 as <n>, not a
                per-batch instance ordinal starting at 1
                (FixtureManager::addFixture(): `fxi->setName(QString("%1
                [%2]").arg(name).arg(fxi->id() + 1))`). Mirror this exactly
                server-side for parity with the current UI: a bulk-patch of
                quantity=3 does NOT necessarily produce "[1]", "[2]", "[3]"
                — it produces "[<id0+1>]", "[<id0+2>]", "[<id0+3>]", which
                only coincide with 1/2/3 if fixture ids happen to be
                contiguous from 0.
            quantity:
              type: integer
              default: 1
              minimum: 1
              description: Patch N identical fixtures in one call (bulk-patch, as the current Add Fixture dialog offers).
            gap:
              type: integer
              default: 0
              minimum: 0
              description: Extra unused channels left between each fixture's footprint when quantity > 1.
            baseRevision: { type: integer }
        description: >
          No "tags" field: Fixture (engine/src/fixture.h) has no tag concept,
          only id/name/universe/address/channels/definition — see
          fixtures-notes.md.

  FixturesPatchResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesPatchOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesPatchOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [docRevision, fixtureIds]
          properties:
            docRevision: { type: integer }
            fixtureIds:
              type: array
              items: { type: string }
              description: IDs of the fixture(s) created, in patch order (length == quantity).

  FixturesPatchedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: fixtures.patched }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [docRevision, fixtures]
          properties:
            docRevision: { type: integer }
            fixtures:
              type: array
              items:
                $ref: '#/components/schemas/FixturesPatchedFixture'

  FixturesUnpatchRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.unpatch }
        params:
          type: object
          required: [fixtureIds, baseRevision]
          properties:
            fixtureIds:
              type: array
              items: { type: string }
              minItems: 1
              description: >
                Bulk-capable, mirrors FixtureManager::deleteFixtures(IDList).
                Note: unpatching also silently deletes any fixture group left
                empty by the removal (see engine issue #2063 workaround in
                FixtureManager::deleteFixtures) — those deletions are
                reported via fixtures.group.deleted events, not inline here.
            baseRevision: { type: integer }

  FixturesUnpatchResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesUnpatchedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: fixtures.unpatched }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [fixtureIds, docRevision]
          properties:
            fixtureIds:
              type: array
              items: { type: string }
            docRevision: { type: integer }

  FixturesUpdateRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.update }
        params:
          type: object
          required: [fixtureId, baseRevision]
          description: >
            At least one of universe/address/name must be present. Moving
            universe/address is FixtureManager::moveFixture() (address only)
            extended to also cover universe, plus renameFixture(). The
            underlying engine setters (Fixture::setAddress/setUniverse) do
            NOT themselves reject overlaps — see fixtures-notes.md; the API
            server must run the same overlap check fixtures.patch does.
          properties:
            fixtureId: { type: string }
            universe: { type: integer }
            address: { type: integer }
            name: { type: string }
            baseRevision: { type: integer }

  FixturesUpdateResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesUpdatedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: fixtures.updated }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [fixture, docRevision]
          properties:
            fixture:
              $ref: '#/components/schemas/FixturesPatchedFixture'
            docRevision: { type: integer }

  # =====================================================================
  # 3. Fixture groups
  # =====================================================================

  FixturesGroupListRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.group.list }
        params:
          type: object

  FixturesGroupListResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesGroupListOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesGroupListOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [groups]
          properties:
            groups:
              type: array
              items:
                type: object
                required: [id, name, size, headCount]
                properties:
                  id: { type: string }
                  name: { type: string }
                  size:
                    type: object
                    required: [columns, rows]
                    properties:
                      columns: { type: integer }
                      rows: { type: integer }
                  headCount: { type: integer }

  FixturesGroupGetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.group.get }
        params:
          type: object
          required: [groupId]
          properties:
            groupId: { type: string }

  FixturesGroupGetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesGroupGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesGroupGetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          $ref: '#/components/schemas/FixturesGroup'

  FixturesGroupCreateRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.group.create }
        params:
          type: object
          required: [name, baseRevision]
          properties:
            name: { type: string }
            columns: { type: integer, default: 1 }
            rows: { type: integer, default: 1 }
            baseRevision: { type: integer }

  FixturesGroupCreateResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesGroupCreateOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesGroupCreateOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [docRevision, groupId]
          properties:
            docRevision: { type: integer }
            groupId: { type: string }

  FixturesGroupCreatedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: fixtures.group.created }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [group, docRevision]
          properties:
            group: { $ref: '#/components/schemas/FixturesGroup' }
            docRevision: { type: integer }

  FixturesGroupRenameRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.group.rename }
        params:
          type: object
          required: [groupId, name, baseRevision]
          properties:
            groupId: { type: string }
            name: { type: string }
            baseRevision: { type: integer }

  FixturesGroupRenameResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesGroupRenamedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: fixtures.group.renamed }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [groupId, name, docRevision]
          properties:
            groupId: { type: string }
            name: { type: string }
            docRevision: { type: integer }

  FixturesGroupDeleteRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.group.delete }
        params:
          type: object
          required: [groupId, baseRevision]
          properties:
            groupId: { type: string }
            baseRevision: { type: integer }

  FixturesGroupDeleteResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesGroupDeletedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: fixtures.group.deleted }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [groupId, docRevision]
          properties:
            groupId: { type: string }
            docRevision: { type: integer }

  FixturesGroupSetSizeRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.group.setSize }
        params:
          type: object
          required: [groupId, columns, rows, baseRevision]
          description: >
            FixtureGroup::setSize(). Shrinking below the current extent does
            not itself drop out-of-bounds heads (engine behaviour) — they
            become unreachable via the grid but stay in headsMap() until
            explicitly resigned. Note this UX wrinkle to the client.
          properties:
            groupId: { type: string }
            columns: { type: integer, minimum: 1 }
            rows: { type: integer, minimum: 1 }
            baseRevision: { type: integer }

  FixturesGroupSetSizeResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesGroupAssignFixtureRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.group.assignFixture }
        params:
          type: object
          required: [groupId, fixtureId, baseRevision]
          description: >
            FixtureGroup::assignFixture() — places all of the fixture's
            heads in consecutive cells starting at (x,y), wrapping to the
            next row at the group's column count. Omit x/y to auto-place
            each head in the next free cell instead (row-major scan).
          properties:
            groupId: { type: string }
            fixtureId: { type: string }
            x: { type: integer }
            y: { type: integer }
            baseRevision: { type: integer }

  FixturesGroupAssignFixtureResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesGroupAssignHeadRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.group.assignHead }
        params:
          type: object
          required: [groupId, fixtureId, headIndex, baseRevision]
          description: >
            FixtureGroup::assignHead(). If a head is already assigned
            elsewhere in the group it is moved; if (x,y) is already occupied
            by another head, the two heads swap places (see FixtureGroup
            header comment). Omit x/y to auto-place in the next free cell.
          properties:
            groupId: { type: string }
            fixtureId: { type: string }
            headIndex: { type: integer, description: "0 for a dimmer/non-multi-head fixture." }
            x: { type: integer }
            y: { type: integer }
            baseRevision: { type: integer }

  FixturesGroupAssignHeadResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesGroupUnassignHeadRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.group.unassignHead }
        params:
          type: object
          required: [groupId, x, y, baseRevision]
          description: FixtureGroup::resignHead() — clears one grid cell.
          properties:
            groupId: { type: string }
            x: { type: integer }
            y: { type: integer }
            baseRevision: { type: integer }

  FixturesGroupUnassignHeadResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesGroupUnassignFixtureRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.group.unassignFixture }
        params:
          type: object
          required: [groupId, fixtureId, baseRevision]
          description: FixtureGroup::resignFixture() — removes every head belonging to a fixture from the group.
          properties:
            groupId: { type: string }
            fixtureId: { type: string }
            baseRevision: { type: integer }

  FixturesGroupUnassignFixtureResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesGroupSwapHeadsRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.group.swapHeads }
        params:
          type: object
          required: [groupId, ax, ay, bx, by, baseRevision]
          description: FixtureGroup::swap() — exchanges (or moves, if one side is empty) the heads at two grid cells.
          properties:
            groupId: { type: string }
            ax: { type: integer }
            ay: { type: integer }
            bx: { type: integer }
            by: { type: integer }
            baseRevision: { type: integer }

  FixturesGroupSwapHeadsResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesGroupResetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.group.reset }
        params:
          type: object
          required: [groupId, baseRevision]
          description: FixtureGroup::reset() — clears all head assignments, keeps size/name.
          properties:
            groupId: { type: string }
            baseRevision: { type: integer }

  FixturesGroupResetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesGroupUpdatedEvent:
    payload:
      type: object
      required: [type, topic, data]
      description: >
        Shared broadcast for every head/size-affecting group mutation
        (setSize, assignFixture, assignHead, unassignHead, unassignFixture,
        swapHeads, reset) — carries the group's full resulting state so
        clients never need to diff a heads map by hand.
      properties:
        type: { const: event }
        topic: { const: fixtures.group.updated }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [group, docRevision]
          properties:
            group: { $ref: '#/components/schemas/FixturesGroup' }
            docRevision: { type: integer }

  # =====================================================================
  # 4. Fixture remapping (one-shot batch operation)
  # =====================================================================

  FixturesRemapSuggestChannelMapRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.remap.suggestChannelMap }
        params:
          type: object
          required: [sourceFixtureId, target]
          description: >
            Read-only helper mirroring FixtureRemapper::autoConnectFixtures()'s
            matching rules (1:1 index mapping when source and target share a
            definition+mode or are both generic dimmers; otherwise per-channel
            semantic matching by group/controlByte/colour) — computed against
            a target mode's channel layout directly, since (unlike the engine
            method) the target fixture need not exist yet. See
            fixtures-notes.md.
          properties:
            sourceFixtureId: { type: string }
            target:
              $ref: '#/components/schemas/FixturesDefinitionRef'

  FixturesRemapSuggestChannelMapResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesRemapSuggestChannelMapOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesRemapSuggestChannelMapOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [channelMap]
          properties:
            channelMap:
              type: array
              items:
                $ref: '#/components/schemas/FixturesChannelMapEntry'

  FixturesRemapApplyRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.remap.apply }
        params:
          type: object
          required: [mappings, baseRevision]
          description: >
            One-shot batch commit, mirroring FixtureRemapper::applyRemap():
            each mapping entry replaces one existing (source) fixture with a
            newly-created (target) fixture at the given address, and the
            supplied channelMap is used to carry forward every reference to
            the old fixture/channel — fixture groups, channel groups, and
            Scene/Sequence/EFX functions — onto the new one. Source fixtures
            not mentioned in "mappings" and not listed in
            "unmappedSourceFixtureIds" are left untouched. This is a single
            atomic document-state mutation; there is no incremental/partial
            variant. See fixtures-notes.md for the cross-domain fan-out
            (functions/monitor) this causes.
          properties:
            mappings:
              type: array
              minItems: 1
              items:
                type: object
                required: [sourceFixtureId, universe, address, definition, channelMap]
                properties:
                  sourceFixtureId: { type: string }
                  universe: { type: integer }
                  address: { type: integer }
                  definition:
                    $ref: '#/components/schemas/FixturesDefinitionRef'
                  name: { type: string }
                  channelMap:
                    type: array
                    items:
                      $ref: '#/components/schemas/FixturesChannelMapEntry'
            unmappedSourceFixtureIds:
              type: array
              items: { type: string }
              description: >
                Source fixtures to delete outright as part of the same
                commit (no replacement) — e.g. duplicates dropped during a
                remap. Optional; defaults to none.
            baseRevision: { type: integer }

  FixturesRemapApplyResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesRemapApplyOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesRemapApplyOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [docRevision, fixtureIds]
          properties:
            docRevision: { type: integer }
            fixtureIds:
              type: array
              items: { type: string }
              description: The created target fixtures, in the order of params.mappings.

  FixturesRemapAppliedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: fixtures.remap.applied }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [fixtures, replacedFixtureIds, deletedFixtureIds, docRevision]
          properties:
            fixtures:
              type: array
              items: { $ref: '#/components/schemas/FixturesPatchedFixture' }
              description: The newly-created target fixtures.
            replacedFixtureIds:
              type: array
              items: { type: string }
              description: Source fixture IDs that were replaced (no longer valid after this event).
            deletedFixtureIds:
              type: array
              items: { type: string }
              description: Source fixture IDs removed via unmappedSourceFixtureIds with no replacement.
            docRevision: { type: integer }

  # =====================================================================
  # 5. Monitor: 2D / 3D preview stage settings and fixture placement
  # =====================================================================
  # Grounded in engine/src/monitorproperties.h (what the .qxw <Monitor>
  # element stores) and engine/src/monitorlayout.h (the geometry shared with
  # qmlui's ContextManager). Positions are millimetres in document space
  # (X = width, Y = height/up, Z = depth), rotations degrees. Every item is
  # addressed by (fixtureId, headIndex, linkedIndex) - a fixture's base item
  # is (id, 0, 0); a multi-head fixture may carry one item per head and a
  # "linked fixture" is an extra copy with linkedIndex >= 1.

  FixturesMonitorGetRequest:
    payload:
      type: object
      required: [type, id, method]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.monitor.get }
        params:
          type: object
          properties: {}

  FixturesMonitorGetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesMonitorGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesMonitorGetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [stage, items, docRevision]
          properties:
            stage: { $ref: '#/components/schemas/FixturesMonitorStage' }
            items:
              type: array
              description: >
                Every fixture preview item in the monitor map, plus one
                synthetic entry (placed=false, position at the stage centre)
                for each patched fixture that has no monitor entry yet, so a
                client can draw the whole patch without a second lookup.
              items: { $ref: '#/components/schemas/FixturesMonitorItem' }
            docRevision: { type: integer }

  FixturesMonitorSetStageRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.monitor.setStage }
        params:
          type: object
          required: [baseRevision]
          description: >
            Partial update of the stage settings (any subset of the
            FixturesMonitorStage fields except its read-only ones).
            Setting pointOfView while it is still Undefined re-derives the
            grid depth like MonitorProperties::setPointOfView() does, so the
            response / event carry the whole re-read stage.
          properties:
            gridSize: { $ref: '#/components/schemas/FixturesVector3' }
            gridUnits: { type: string, enum: [Meters, Feet] }
            pointOfView: { type: string, enum: [Undefined, TopView, FrontView, RightSideView, LeftSideView] }
            stageType: { type: string, enum: [Simple, Box, Rock, Theatre] }
            showLabels: { type: boolean }
            backgroundImage:
              type: string
              description: Server-side file path of the common 2D background picture; empty string resets it.
            baseRevision: { type: integer }

  FixturesMonitorSetStageResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesMonitorSetPlacementRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.monitor.setPlacement }
        params:
          type: object
          required: [items, baseRevision]
          description: >
            Bulk partial update of fixture preview items - what dragging in
            the 2D view, the position / rotation fields, the gel colour
            picker and the invert / lock / hide toggles of the Qt UI write.
            Every entry names an item by fixtureId (+ headIndex, linkedIndex,
            both default 0) and any subset of the writable fields. An entry
            whose (fixtureId, headIndex, linkedIndex) does not exist yet is
            created - with linkedIndex >= 1 that is how a "linked fixture"
            copy is added (its unspecified fields are copied from the base
            item, like ContextManager::setLinkedFixture). remove=true deletes
            a linked copy (linkedIndex >= 1 only; a base item cannot be
            removed). A position / rotation change on a locked item is
            refused silently and reported in result.skippedLocked unless the
            same entry also clears locked. All-or-nothing validation; the
            docRevision bump happens once.
          properties:
            items:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/FixturesMonitorPlacementUpdate' }
            baseRevision: { type: integer }

  FixturesMonitorSetPlacementResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesMonitorPlacementsOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesMonitorPlacementsOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [items, docRevision]
          properties:
            items:
              type: array
              description: The full new state of every item the call touched.
              items: { $ref: '#/components/schemas/FixturesMonitorItem' }
            skippedLocked:
              type: array
              description: Item keys whose position / rotation change was ignored because the item is locked.
              items: { $ref: '#/components/schemas/FixturesMonitorItemKey' }
            docRevision: { type: integer }

  FixturesMonitorArrangeRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.monitor.arrange }
        params:
          type: object
          required: [items, op, baseRevision]
          description: >
            Runs one of ContextManager's placement tools server-side
            (engine/src/monitorlayout.h, the very same code the Qt UI runs)
            on the given items, in the stage's current point of view:
            circle {diameter (mm), lookAtCenter?}, grid {width, height (mm),
            columns? (0/absent = near-square), angle? (deg)}, line {length
            (mm), angle? (deg), lookAtCenter?}, rotate {angle (deg), around
            the centroid}, center {} (move the centroid onto the stage
            centre), align {edge: left|top} (to the FIRST item given),
            distribute {direction: horizontal|vertical} (>= 3 items).
            circle / line / rotate / center order the items by DMX address
            (Fixture::operator<, then head, then linked); grid uses the
            common Fixture Group's grid order when every item belongs to one
            group. Locked items keep their place (their slot stays empty),
            except for align / distribute which ignore the lock like the Qt
            UI does. Items whose fixture no longer exists -> NOT_FOUND.
          properties:
            items:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/FixturesMonitorItemKey' }
            op: { type: string, enum: [circle, grid, line, rotate, center, align, distribute] }
            args:
              type: object
              additionalProperties: true
            baseRevision: { type: integer }

  FixturesMonitorArrangeResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesMonitorPlacementsOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesMonitorDetectArrangementRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.monitor.detectArrangement }
        params:
          type: object
          required: [items]
          description: >
            Read-only "detect from placement" helper of the Arrange dialog:
            the circle diameter (mean distance from the centroid, doubled)
            and the best-fit line (principal axis angle + extent) of the
            items' current positions in the stage's point of view, plus the
            centroid. Needs >= 2 items (otherwise zeros).
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/FixturesMonitorItemKey' }

  FixturesMonitorDetectArrangementResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesMonitorDetectArrangementOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesMonitorDetectArrangementOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [circleDiameter, lineLength, lineAngle, centroid]
          properties:
            circleDiameter: { type: number, description: mm }
            lineLength: { type: number, description: mm }
            lineAngle: { type: number, description: degrees }
            centroid: { $ref: '#/components/schemas/FixturesVector3' }

  FixturesMonitorAimAtRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: fixtures.monitor.aimAt }
        params:
          type: object
          required: [items, point]
          description: >
            "Pick a 3D point" (Position3DTool.qml / ContextManager::
            setPositionPickPoint): points every given fixture's beam at
            point (mm, document space like positions) using its monitor
            position, rotation and - for a Moving Head with persisted
            LightEmitter data - the beam origin offset, then writes the
            resulting Pan / Tilt channel values as live Simple Desk
            overrides (io.simpleDesk.*; release them the usual way). Items
            without Pan or Tilt channels are skipped. Live (§4b): no
            baseRevision, nothing saved. The headless server has no 3D mesh
            fallback for the beam origin: fixtures without LightEmitter data
            aim from their root position.
          properties:
            items:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/FixturesMonitorItemKey' }
            point: { $ref: '#/components/schemas/FixturesVector3' }

  FixturesMonitorAimAtResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/FixturesMonitorAimAtOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  FixturesMonitorAimAtOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [fixtures, channels]
          properties:
            fixtures:
              type: array
              description: Per aimed fixture, the computed angles.
              items:
                type: object
                required: [fixtureId]
                properties:
                  fixtureId: { type: string }
                  headIndex: { type: integer }
                  panDegrees: { type: number }
                  tiltDegrees: { type: number }
            channels:
              type: array
              description: The absolute DMX addresses (universe*512+channel) and values written.
              items:
                type: object
                required: [address, value]
                properties:
                  address: { type: integer }
                  value: { type: integer }

  FixturesMonitorChangedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: fixtures.monitor.changed }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [docRevision]
          description: >
            Broadcast after setStage / setPlacement / arrange (and after
            fixtures.remap.apply moved monitor entries). stage is present
            when the stage settings changed; items lists the full new state
            of every touched item; removed lists deleted linked copies.
          properties:
            stage: { $ref: '#/components/schemas/FixturesMonitorStage' }
            items:
              type: array
              items: { $ref: '#/components/schemas/FixturesMonitorItem' }
            removed:
              type: array
              items: { $ref: '#/components/schemas/FixturesMonitorItemKey' }
            docRevision: { type: integer }

  # =====================================================================
  # Shared response building blocks
  # =====================================================================

  FixturesDocRevisionOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [docRevision]
          properties:
            docRevision: { type: integer }

schemas:

  FixturesPhysical:
    type: object
    description: QLCPhysical, flattened (bulb/lens/dimensions/focus/technical groups).
    properties:
      width: { type: integer }
      height: { type: integer }
      depth: { type: integer }
      weight: { type: number }
      powerConsumption: { type: integer, description: watts }
      dmxConnector: { type: string }
      bulbType: { type: string }
      bulbLumens: { type: integer }
      bulbColourTemperature: { type: integer }
      lensName: { type: string }
      lensDegreesMin: { type: number }
      lensDegreesMax: { type: number }
      focusType: { type: string }
      focusPanMax: { type: integer }
      focusTiltMax: { type: integer }
      layoutWidth:
        type: integer
        description: "Head arrangement grid width, for matrix/pixel fixtures (QLCPhysical::layoutSize()). Previously missing here despite being present on FixtureDefsPhysical in fixturedefs.yaml — same QLCPhysical field; fixtures.defs.getMode needs it to preview a matrix fixture's head layout in the patch dialog."
      layoutHeight:
        type: integer
        description: "Head arrangement grid height, for matrix/pixel fixtures. See layoutWidth."

  FixturesCapability:
    type: object
    description: >
      QLCCapability — one DMX value sub-range of a channel. This is a
      read-oriented summary shape (min/max/name/preset plus derived
      presetType/color1/color2 for direct UI rendering), distinct from
      FixtureDefsCapability in fixturedefs.yaml, which exposes the same
      engine object's raw authoring shape (resources/aliases/warning) for
      the definition editor. The two intentionally differ because they serve
      different consumers of the same QLCCapability — see fixturedefs.yaml's
      FixtureDefsCapability schema doc and fixturedefs-notes.md for why they
      aren't unified into one schema.
    required: [min, max, name]
    properties:
      min: { type: integer }
      max: { type: integer }
      name: { type: string }
      preset:
        type: string
        description: QLCCapability::Preset as string via presetToString(), "Custom" if none.
      presetType:
        type: string
        enum: [None, SingleColor, DoubleColor, SingleValue, DoubleValue, Picture]
        description: QLCCapability::presetType() — hints the UI what extra control (color swatch, numeric field...) to render.
      color1:
        type: string
        description: Primary resource color as hex, when presetType implies a color swatch (from resources()[0]).
      color2:
        type: string
        description: Secondary resource color as hex, for DoubleColor presets (from resources()[1]).

  FixturesModeChannel:
    type: object
    description: QLCChannel as arranged within one QLCFixtureMode.
    required: [index, name, group, controlByte, defaultValue, capabilities]
    properties:
      index: { type: integer, description: "DMX channel number within the mode (0-based)." }
      name: { type: string }
      group:
        type: string
        description: QLCChannel::Group as string via groupToString() (Intensity, Colour, Gobo, Speed, Pan, Tilt, Shutter, Prism, Beam, Effect, Maintenance, Nothing).
      preset:
        type: string
        description: QLCChannel::Preset as string via presetToString(), "Custom" if none (e.g. "IntensityRed", "PositionPan", "ShutterStrobeSlowFast"...).
      colour:
        type: string
        description: QLCChannel::PrimaryColour as string, only meaningful for Intensity-group channels.
      controlByte:
        type: string
        enum: [MSB, LSB]
      defaultValue: { type: integer, minimum: 0, maximum: 255 }
      capabilities:
        type: array
        items: { $ref: '#/components/schemas/FixturesCapability' }

  FixturesModeHead:
    type: object
    required: [index, channels]
    properties:
      index: { type: integer }
      channels:
        type: array
        items: { type: integer }
        description: Channel indices (within the mode) that belong to this head.

  FixturesDefinitionRef:
    type: object
    description: >
      Identifies what to patch/remap-to: either a real library definition
      (manufacturer+model+mode) or a generic dimmer with no real definition
      (Fixture::genericDimmerDef()/genericDimmerMode(), used when
      manufacturer/model/mode are absent). Exactly one of
      {manufacturer+model+mode, generic} must be given — INVALID_PARAMS
      otherwise.
    properties:
      manufacturer: { type: string }
      model: { type: string }
      mode: { type: string }
      generic:
        type: object
        required: [channels]
        properties:
          channels:
            type: integer
            minimum: 1
            description: Fixture::setChannels() — only valid for a generic dimmer.

  FixturesPatchedFixture:
    type: object
    description: One patched Fixture instance (engine/src/fixture.h), as used in lists and change events.
    required: [id, name, universe, address, channels, fixtureType, isGeneric]
    properties:
      id: { type: string }
      name: { type: string }
      universe: { type: integer }
      address: { type: integer, description: "0-based DMX start address within its universe." }
      channels: { type: integer, description: Fixture::channels() — the instance's channel footprint. }
      fixtureType:
        type: string
        description: >
          Fixture::typeString() — QLCFixtureDef::typeToString(fixtureDef()->type())
          when a real definition is attached, otherwise the literal string
          "Dimmer". There is no separate "Generic Dimmer" string anywhere in
          the engine: a generic fixture's fixtureType reads exactly "Dimmer",
          same as a real dimmer definition — use isGeneric to tell them
          apart, not this field.
      manufacturer: { type: string }
      model: { type: string }
      mode: { type: string }
      isGeneric:
        type: boolean
        description: >
          true if this fixture is a generic dimmer. qmlui always attaches a
          procedural QLCFixtureDef to generic fixtures (Fixture::
          genericDimmerDef(), fixture.cpp), so "no definition at all" is
          never the actual runtime state to test for — Fixture::fixtureDef()
          is never null for a live-patched fixture. The real discriminator,
          matching the engine's own check (fixture.cpp, e.g. around the
          generic-def-ownership check in Fixture::setFixtureDefinition), is
          whether the attached definition's manufacturer AND model are both
          the literal string "Generic" (QLCFixtureDef::manufacturer() ==
          "Generic" && model() == "Generic") — not identity/nullness of the
          definition pointer.
      crossUniverse:
        type: boolean
        description: Fixture::crossUniverse().

  FixturesPatchedFixtureDetail:
    allOf:
      - $ref: '#/components/schemas/FixturesPatchedFixture'
      - type: object
        required: [channelList]
        properties:
          channelList:
            type: array
            description: >
              Fixture's channels resolved to absolute DMX addresses
              (Fixture::channelAddress()) — enough for a UI to show "this
              fixture's Red channel is Universe 2, DMX 145" without the
              client re-deriving universe*512+address+index itself.
            items:
              type: object
              required: [index, name, group, absoluteAddress]
              properties:
                index: { type: integer }
                name: { type: string }
                group: { type: string }
                colour: { type: string }
                absoluteAddress:
                  type: integer
                  description: universe*512 + address + index (Fixture::channelAddress()).

  FixturesGroupHeadEntry:
    type: object
    required: [x, y, fixtureId, headIndex]
    properties:
      x: { type: integer }
      y: { type: integer }
      fixtureId: { type: string }
      headIndex: { type: integer }

  FixturesGroup:
    type: object
    description: FixtureGroup (engine/src/fixturegroup.h) — a named 2D layout grid of fixture heads.
    required: [id, name, size, heads]
    properties:
      id: { type: string }
      name: { type: string }
      size:
        type: object
        required: [columns, rows]
        properties:
          columns: { type: integer }
          rows: { type: integer }
      heads:
        type: array
        items: { $ref: '#/components/schemas/FixturesGroupHeadEntry' }

  FixturesChannelMapEntry:
    type: object
    required: [sourceChannel, targetChannel]
    properties:
      sourceChannel: { type: integer }
      targetChannel: { type: integer }

  FixturesVector3:
    type: object
    required: [x, y, z]
    properties:
      x: { type: number }
      y: { type: number }
      z: { type: number }

  FixturesMonitorStage:
    type: object
    description: MonitorProperties' environment settings (the .qxw <Monitor> element's Grid / StageItem / Background).
    required: [gridSize, gridUnits, pointOfView, stageType, showLabels]
    properties:
      gridSize:
        allOf: [{ $ref: '#/components/schemas/FixturesVector3' }]
        description: Stage size in gridUnits (x = width, y = height, z = depth).
      gridUnits: { type: string, enum: [Meters, Feet] }
      pointOfView:
        type: string
        enum: [Undefined, TopView, FrontView, RightSideView, LeftSideView]
        description: Undefined until the user picked one (PopupMonitor.qml asks on first 2D view open).
      stageType: { type: string, enum: [Simple, Box, Rock, Theatre] }
      showLabels: { type: boolean }
      backgroundImage: { type: string }
      gridCenter:
        allOf: [{ $ref: '#/components/schemas/FixturesVector3' }]
        description: Read-only convenience - the stage centre in mm (MonitorLayout::gridCenterPosition).

  FixturesMonitorItemKey:
    type: object
    required: [fixtureId]
    properties:
      fixtureId: { type: string }
      headIndex: { type: integer, default: 0 }
      linkedIndex: { type: integer, default: 0 }

  FixturesMonitorItem:
    type: object
    description: One fixture preview item (PreviewItem in monitorproperties.h) plus the read-only fixture facts a 2D view needs to draw it.
    required: [fixtureId, headIndex, linkedIndex, placed, position, rotation, flags]
    properties:
      fixtureId: { type: string }
      headIndex: { type: integer }
      linkedIndex: { type: integer }
      placed:
        type: boolean
        description: false for the synthetic entry of a fixture with no monitor entry yet (position = stage centre).
      name: { type: string, description: The fixture's name (Fixture::name()); linked copies may carry their own item name in itemName. }
      itemName: { type: string }
      position: { $ref: '#/components/schemas/FixturesVector3' }
      rotation: { $ref: '#/components/schemas/FixturesVector3' }
      gelColor: { type: [string, "null"], description: '#rrggbb, null when none.' }
      fixedZoom: { type: integer, description: Degrees, Dimmer-type fixtures only. }
      rotationScale: { type: number }
      positionRange: { type: number }
      flags:
        type: object
        required: [hidden, invertPan, invertTilt, locked]
        properties:
          hidden: { type: boolean }
          invertPan: { type: boolean }
          invertTilt: { type: boolean }
          locked: { type: boolean }
          invertPositionX: { type: boolean }
          invertPositionY: { type: boolean }
          invertPositionZ: { type: boolean }
          invertRotationX: { type: boolean }
          invertRotationY: { type: boolean }
          invertRotationZ: { type: boolean }
      fixtureType: { type: string, description: Fixture::typeString(). }
      universe: { type: integer }
      address: { type: integer }
      channels: { type: integer }
      heads: { type: integer, description: Number of heads of the fixture's mode. }
      headChannels:
        type: array
        description: Per head, the channel indices it owns (QLCFixtureHead::channels()), so a client can colour heads from the live DMX.
        items: { type: array, items: { type: integer } }
      physical:
        type: object
        description: Physical width / height / depth in mm with the 300 mm defaults the 2D view applies.
        properties:
          width: { type: number }
          height: { type: number }
          depth: { type: number }
          focusPanMax: { type: integer }
          focusTiltMax: { type: integer }
      hasPan: { type: boolean }
      hasTilt: { type: boolean }

  FixturesMonitorPlacementUpdate:
    type: object
    required: [fixtureId]
    properties:
      fixtureId: { type: string }
      headIndex: { type: integer, default: 0 }
      linkedIndex: { type: integer, default: 0 }
      position: { $ref: '#/components/schemas/FixturesVector3' }
      rotation: { $ref: '#/components/schemas/FixturesVector3' }
      gelColor: { type: [string, "null"], description: '#rrggbb sets, null clears.' }
      fixedZoom: { type: integer }
      rotationScale: { type: number }
      positionRange: { type: number }
      itemName: { type: string }
      hidden: { type: boolean }
      invertPan: { type: boolean }
      invertTilt: { type: boolean }
      locked: { type: boolean }
      invertPositionX: { type: boolean }
      invertPositionY: { type: boolean }
      invertPositionZ: { type: boolean }
      invertRotationX: { type: boolean }
      invertRotationY: { type: boolean }
      invertRotationZ: { type: boolean }
      remove: { type: boolean, description: Delete this linked copy (linkedIndex >= 1 only). }

