messages:
  PaletteListRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: palette.list
        params:
          type: object
  PaletteListResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/PaletteListOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  PaletteListOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - palettes
          - docRevision
          properties:
            palettes:
              type: array
              items:
                $ref: '#/components/schemas/PaletteSummary'
            docRevision:
              type: integer
  PaletteGetRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: palette.get
        params:
          type: object
          required:
          - paletteId
          properties:
            paletteId:
              type: integer
  PaletteGetResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/PaletteGetOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  PaletteGetOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/PaletteDetail'
  PaletteCreateRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: palette.create
        params:
          type: object
          required:
          - type
          - name
          - baseRevision
          properties:
            type:
              $ref: '#/components/schemas/PaletteTypeEnum'
            name:
              type: string
            values:
              $ref: '#/components/schemas/PaletteValues'
              description: >
                Initial value(s), in the type-appropriate encoding described
                on PaletteValues. Optional; a type-appropriate zero/default
                value is used if omitted (mirrors QLCPalette::resetValues()).
            fanning:
              $ref: '#/components/schemas/PaletteFanning'
            baseRevision:
              type: integer
              description: "docRevision this client last observed (see 00-conventions.md §4a)"
  PaletteCreateResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/PaletteCreateOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  PaletteCreateOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - paletteId
          - docRevision
          properties:
            paletteId:
              type: integer
            docRevision:
              type: integer
  PaletteCreatedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: palette.created
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - palette
          - docRevision
          properties:
            palette:
              $ref: '#/components/schemas/PaletteDetail'
            docRevision:
              type: integer
  PaletteUpdateRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: palette.update
        params:
          type: object
          required:
          - paletteId
          - baseRevision
          properties:
            paletteId:
              type: integer
            name:
              type: string
              description: Optional; rename the palette when present.
            values:
              $ref: '#/components/schemas/PaletteValues'
              description: >
                Optional; replace the palette's value(s) when present, in the
                type-appropriate encoding described on PaletteValues. The
                palette's type itself is immutable after creation (see
                QLCPalette::type(), CONSTANT), so it is never accepted here -
                delete and re-create instead if the type is wrong.
            fanning:
              $ref: '#/components/schemas/PaletteFanning'
              description: Optional; the keys present are applied (partial update).
            baseRevision:
              type: integer
  PaletteUpdateResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/PaletteUpdateOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  PaletteUpdateOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - docRevision
          properties:
            docRevision:
              type: integer
  PaletteUpdatedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: palette.updated
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - palette
          - docRevision
          properties:
            palette:
              $ref: '#/components/schemas/PaletteDetail'
            docRevision:
              type: integer
  PaletteDeleteRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: palette.delete
        params:
          type: object
          required:
          - paletteId
          - baseRevision
          properties:
            paletteId:
              type: integer
            baseRevision:
              type: integer
  PaletteDeleteResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/PaletteDeleteOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  PaletteDeleteOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - docRevision
          properties:
            docRevision:
              type: integer
  PaletteDeletedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: palette.deleted
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - paletteId
          - docRevision
          properties:
            paletteId:
              type: integer
            docRevision:
              type: integer
  PaletteApplyRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: palette.apply
        params:
          type: object
          required:
          - paletteId
          - fixtureIds
          description: >
            Applies a palette to fixtures on the live output, exactly like a
            double-click in the desktop Palette manager
            (PaletteManager::previewPalette): the channel values come from
            the engine's own QLCPalette::valuesFromFixtures() - every palette
            type (Dimmer, Color, Pan, Tilt, PanTilt, Position3D, Shutter,
            Gobo, Zoom) and the palette's fanning across the given fixtures,
            ordered by the fanning layout. The values are written as live
            Simple Desk overrides (io.simpleDesk.*; released the usual way,
            e.g. io.simpleDesk.resetChannel), the same path
            fixtures.monitor.aimAt uses. Live (§4b): no baseRevision, nothing
            is saved. Heads are not addressable: the engine takes whole
            fixtures and fills every head itself. A fixture the palette type
            does not map to (no gobo wheel, no zoom channel, a shutter
            without the palette's preset...) simply contributes nothing.
          properties:
            paletteId:
              type: integer
            fixtureIds:
              type: array
              minItems: 1
              description: >
                Fixture ids (strings, as elsewhere; numbers are accepted).
                The server has no notion of the client's selection, so this
                is required and must not be empty; every id must exist.
              items:
                type:
                - string
                - integer
  PaletteApplyResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/PaletteApplyOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  PaletteApplyOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - channels
          properties:
            channels:
              type: array
              description: >
                The values written, in valuesFromFixtures() order. address is
                the absolute DMX address (universe*512+channel), channel the
                fixture-relative channel index. Empty when the palette maps to
                no channel of the given fixtures (still ok).
              items:
                type: object
                required:
                - fixtureId
                - channel
                - address
                - value
                properties:
                  fixtureId:
                    type: string
                  channel:
                    type: integer
                  address:
                    type: integer
                  value:
                    type: integer

schemas:
  PaletteTypeEnum:
    type: string
    enum:
    - Dimmer
    - Color
    - Pan
    - Tilt
    - PanTilt
    - Position3D
    - Shutter
    - Gobo
    - Zoom
    description: >
      Mirrors QLCPalette::PaletteType (engine/src/qlcpalette.h). Fixed once a
      palette is created - palette.update never accepts it.
  PaletteValues:
    type: array
    items:
      type:
      - number
      - string
    description: >
      Direct JSON mirror of QLCPalette::values()'s QVariantList - one array
      element per stored value, in the same order the engine keeps them, with
      no per-type object wrapper (see palette-notes.md for why this shape was
      chosen over a type-specific object). Meaning per PaletteTypeEnum value:
        Dimmer: [level] - DMX 0-255, written as-is by valuesFromFixtures()
          (the desktop's IntensityTool stores percent * 2.55).
        Zoom: [degrees] - one float, the beam angle, mapped over each
          fixture's lens range by Fixture::zoomToValues() (BeamTool.qml).
        Color: [packed] - one string, "#rrggbb" or "#rrggbbwwaauv" (RGB, optionally
          followed by White/Amber/UV) exactly as produced/consumed by
          QLCPalette::colorToString()/stringToColor() - build/parse it with
          those semantics, don't hand-roll hex concatenation.
        Pan, Tilt: [degrees] - one integer (Fixture::positionToValues()).
        PanTilt: [pan, tilt] - two integers (degrees), in that order.
        Position3D: [x, y, z] - three floats, the target point in metres in
          stage space (Position3DTool.qml stores metres).
        Shutter: [preset, percent] - a QLCCapability::Preset ordinal and 0-100
          within the matching capability's range (valuesFromFixtures()).
        Gobo: [dmx] - the gobo wheel's DMX value.
      An empty array (or an absent `values` on palette.create) means "use
      QLCPalette's post-construction default", i.e. QLCPalette::resetValues().
  PaletteSummary:
    type: object
    required:
    - id
    - name
    - type
    properties:
      id:
        type: integer
      name:
        type: string
      type:
        $ref: '#/components/schemas/PaletteTypeEnum'
  PaletteDetail:
    type: object
    required:
    - id
    - name
    - type
    - values
    properties:
      id:
        type: integer
      name:
        type: string
      type:
        $ref: '#/components/schemas/PaletteTypeEnum'
      values:
        $ref: '#/components/schemas/PaletteValues'
      fanning:
        $ref: '#/components/schemas/PaletteFanning'
  PaletteFanning:
    type: object
    description: QLCPalette's fanning (PaletteFanningBox.qml; saved as Fan/Layout/Amount/FanValue). In palette.create
      / palette.update every key is optional (partial update).
    properties:
      type:
        type: string
        enum:
        - Flat
        - Linear
        - Sine
        - Square
        - Saw
      layout:
        type: string
        enum:
        - XAscending
        - XDescending
        - XCentered
        - YAscending
        - YDescending
        - YCentered
        - ZAscending
        - ZDescending
        - ZCentered
        description: Axis and ordering the fan is spread along.
      amount:
        type: integer
        description: Percent of the value range covered by the fan.
      value:
        type:
        - integer
        - string
        - 'null'
        description: 'End value: a number for Dimmer / Pan / Tilt / PanTilt / Zoom, a colour string (#rrggbb)
          for Color, null when unset.'
