messages:
  FunctionsListRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.list
        params:
          type: object
          properties:
            typeFilter:
              type: array
              description: Optional list of Function::Type strings to filter by. Omit/empty for all types.
              items:
                $ref: '#/components/schemas/FunctionsTypeEnum'
            pathFilter:
              type: string
              description: Optional folder path prefix filter (see Function::path).
  FunctionsListResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsListOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsListOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - functions
          properties:
            functions:
              type: array
              items:
                $ref: '#/components/schemas/FunctionsSummary'
  FunctionsGetRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.get
        params:
          type: object
          required:
          - functionId
          properties:
            functionId:
              type: string
  FunctionsGetResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsGetOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsGetOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/FunctionsDetail'
  FunctionsCreateRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.create
        params:
          type: object
          required:
          - type
          - baseRevision
          description: 'Creating type=Sequence auto-creates a hidden bound Scene as part of the same
            call (mirroring the Function Manager''s "New Sequence" action) - there is no params field
            to supply your own sceneId at creation time, since FunctionsSequenceDetail.boundSceneId
            is required and non-null from the moment the Sequence exists. Read it back via the immediately
            following functions.get, or repoint it afterward with functions.sequence.setBoundScene.

            '
          properties:
            type:
              $ref: '#/components/schemas/FunctionsTypeEnum'
            name:
              type: string
              description: Defaults to a generated name (e.g. 'New Scene') if omitted.
            path:
              type: string
              description: Folder path to create the function under. Defaults to root.
            fixtures:
              type: array
              description: 'Optional fixture IDs to seed the new function with (e.g. a new Scene is pre-populated
                with all channels of these fixtures, an EFX gets these fixtures added as participants).
                Ignored by types that don''t take fixtures at creation time.

                '
              items:
                type: string
            baseRevision:
              type: integer
  FunctionsCreateResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsCreateOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsCreateOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/FunctionsCreateResult'
  FunctionsCreatedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: functions.created
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - function
          - docRevision
          properties:
            function:
              $ref: '#/components/schemas/FunctionsSummary'
            docRevision:
              type: integer
  FunctionsDeleteRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.delete
        params:
          type: object
          required:
          - functionId
          - baseRevision
          properties:
            functionId:
              type: string
            baseRevision:
              type: integer
  FunctionsDeleteResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsDeleteOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsDeleteOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/FunctionsDocRevisionResult'
  FunctionsDeletedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: functions.deleted
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - functionId
          - docRevision
          properties:
            functionId:
              type: string
            docRevision:
              type: integer
  FunctionsRenameRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.rename
        params:
          type: object
          required:
          - functionId
          - name
          - baseRevision
          properties:
            functionId:
              type: string
            name:
              type: string
            baseRevision:
              type: integer
  FunctionsRenameResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsRenameOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsRenameOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/FunctionsDocRevisionResult'
  FunctionsRenamedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: functions.renamed
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - functionId
          - name
          - docRevision
          properties:
            functionId:
              type: string
            name:
              type: string
            docRevision:
              type: integer
  FunctionsMoveRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.move
        params:
          type: object
          required:
          - functionIds
          - path
          - baseRevision
          properties:
            functionIds:
              type: array
              description: One or more function IDs to move together (matches FunctionManager's multi-select
                move).
              items:
                type: string
            path:
              type: string
              description: New folder path, in the same simplified/bare form as FunctionsSummary.path
                (no type prefix - see Function::setPath, which strips a redundant "<TypeString>/" prefix
                if one is given, so either form is technically accepted, but round-tripping a value read
                from FunctionsSummary.path is the intended usage).
            baseRevision:
              type: integer
  FunctionsMoveResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsMoveOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsMoveOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/FunctionsDocRevisionResult'
  FunctionsMovedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: functions.moved
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - functionIds
          - path
          - docRevision
          properties:
            functionIds:
              type: array
              items:
                type: string
            path:
              type: string
            docRevision:
              type: integer
  FunctionsSetCommonAttributesRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.setCommonAttributes
        params:
          type: object
          required:
          - functionId
          - baseRevision
          description: All properties besides functionId/baseRevision are optional partial updates.
          properties:
            functionId:
              type: string
            runOrder:
              $ref: '#/components/schemas/FunctionsRunOrderEnum'
            direction:
              $ref: '#/components/schemas/FunctionsDirectionEnum'
            tempoType:
              $ref: '#/components/schemas/FunctionsTempoTypeEnum'
            fadeInSpeed:
              type: integer
              minimum: 0
              description: 'Milliseconds, or beats if tempoType is Beats. Two non-duration sentinel values
                are valid here (Function::infiniteSpeed()/defaultSpeed()) - see FunctionsDetail.fadeInSpeed
                for the shared encoding.

                '
            fadeOutSpeed:
              type: integer
              minimum: 0
              description: See fadeInSpeed above for the sentinel encoding.
            duration:
              type: integer
              minimum: 0
              description: See FunctionsDetail.duration for the sentinel encoding. A Chaser/Sequence's
                own duration here is normally overall/derived rather than set directly - see FunctionsChaserStep's
                description for how a step's own hold/duration relate.
            blendMode:
              $ref: '#/components/schemas/FunctionsBlendModeEnum'
            baseRevision:
              type: integer
  FunctionsSetCommonAttributesResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsSetCommonAttributesOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsSetCommonAttributesOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/FunctionsDocRevisionResult'
  FunctionsCommonAttributesChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: functions.commonAttributesChanged
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - functionId
          - docRevision
          properties:
            functionId:
              type: string
            runOrder:
              $ref: '#/components/schemas/FunctionsRunOrderEnum'
            direction:
              $ref: '#/components/schemas/FunctionsDirectionEnum'
            tempoType:
              $ref: '#/components/schemas/FunctionsTempoTypeEnum'
            fadeInSpeed:
              type: integer
            fadeOutSpeed:
              type: integer
            duration:
              type: integer
            blendMode:
              $ref: '#/components/schemas/FunctionsBlendModeEnum'
            docRevision:
              type: integer
  FunctionsStartRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.start
        params:
          type: object
          required:
          - functionId
          properties:
            functionId:
              type: string
            overrideFadeIn:
              type: integer
              description: Optional one-shot fade-in override in ms, not persisted.
            overrideFadeOut:
              type: integer
            overrideDuration:
              type: integer
            overrideTempoType:
              $ref: '#/components/schemas/FunctionsTempoTypeEnum'
  FunctionsStartResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsStopRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.stop
        params:
          type: object
          required:
          - functionId
          properties:
            functionId:
              type: string
            preserveAttributes:
              type: boolean
              default: false
              description: See Function::stop(preserveAttributes) - keep attribute overrides applied after
                stopping.
  FunctionsStopResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsSetPauseRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.setPause
        params:
          type: object
          required:
          - functionId
          - paused
          properties:
            functionId:
              type: string
            paused:
              type: boolean
  FunctionsSetPauseResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsTapRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.tap
        params:
          type: object
          required:
          - functionId
          properties:
            functionId:
              type: string
              description: See Function::tap() - tap-tempo, meaningful mainly for a running Chaser/Sequence.
  FunctionsTapResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsAdjustAttributeRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.adjustAttribute
        params:
          type: object
          required:
          - functionId
          - value
          anyOf:
          - required:
            - attributeIndex
          - required:
            - attributeName
          description: 'Exactly one of attributeIndex/attributeName must be present (enforced above via
            anyOf, not just prose).

            Writes the attribute''s persisted base value directly (Function::adjustAttribute with attributeId
            < the override-ID range) - the same thing a Function editor does, not a live runtime override.
            The engine also supports a separate override-acquire/release mechanism (Function::requestAttributeOverride/
            releaseAttributeOverride, used e.g. by VC controls layered on top of a function''s own value)
            with no client-facing equivalent here - see FunctionsAttribute.overridden/overrideValue for
            the read side of that gap.

            '
          properties:
            functionId:
              type: string
            attributeIndex:
              type: integer
              description: Index from FunctionsDetail.attributes. NOT reliably 0 = Intensity - true for
                most function types, but Show unregisters its Intensity attribute entirely (Show::Show,
                see engine/src/show.cpp), so index 0 on a Show is its first Track-mapped attribute. Always
                resolve by name or by walking FunctionsDetail.attributes, don't hardcode index 0.
            attributeName:
              type: string
            value:
              type: number
              description: Clamped server-side to the target attribute's own FunctionsAttribute.min/max
                (which varies per attribute and function type - e.g. EFX Width is 0-127, Video X-rotation
                is -360..360 - NOT a universal 0..1 range).
  FunctionsAdjustAttributeResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsStatusChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: functions.status.changed
        originClientId:
          type:
          - string
          - 'null'
        data:
          $ref: '#/components/schemas/FunctionsStatusData'
  FunctionsSceneSetValuesRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.scene.setValues
        params:
          type: object
          required:
          - functionId
          - values
          - baseRevision
          properties:
            functionId:
              type: string
            values:
              $ref: '#/components/schemas/FunctionsSceneValues'
              description: Full replacement of the Scene's value list (Scene::setValue per entry after
                Scene::clear()).
            baseRevision:
              type: integer
  FunctionsSceneSetValuesResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsSceneSetValuesOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsSceneSetValuesOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/FunctionsDocRevisionResult'
  FunctionsSceneSetValueRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.scene.setValue
        params:
          type: object
          required:
          - functionId
          - fixture
          - channel
          - value
          - baseRevision
          properties:
            functionId:
              type: string
            fixture:
              type: string
            channel:
              type: integer
              minimum: 0
            value:
              type: integer
              minimum: 0
              maximum: 255
            baseRevision:
              type: integer
  FunctionsSceneSetValueResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsSceneSetValueOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsSceneSetValueOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/FunctionsDocRevisionResult'
  FunctionsSceneUnsetValueRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.scene.unsetValue
        params:
          type: object
          required:
          - functionId
          - fixture
          - channel
          - baseRevision
          properties:
            functionId:
              type: string
            fixture:
              type: string
            channel:
              type: integer
              minimum: 0
            baseRevision:
              type: integer
  FunctionsSceneUnsetValueResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsSceneUnsetValueOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsSceneUnsetValueOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/FunctionsDocRevisionResult'
  FunctionsSceneValuesChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: functions.scene.valuesChanged
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - functionId
          - patch
          - docRevision
          properties:
            functionId:
              type: string
            patch:
              type: array
              description: 'RFC 6902 JSON Patch ops against the FunctionsSceneDetail.values map (see 00-conventions.md
                §4a). setValues emits one "replace" op at path "/values"; setValue emits "add"/"replace"
                at "/values/<fixtureId>.<channel>"; unsetValue emits "remove" at the same path.

                '
              items:
                $ref: '#/components/schemas/FunctionsPatchOp'
            docRevision:
              type: integer
  FunctionsSceneSetMembersRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.scene.setMembers
        params:
          type: object
          required:
          - functionId
          - baseRevision
          description: 'Full replacement of the Scene''s non-value membership lists (Scene::fixtures/fixtureGroups/channelGroups/palettes).
            Omitted properties are left unchanged.

            '
          properties:
            functionId:
              type: string
            fixtures:
              type: array
              items:
                type: string
            fixtureGroups:
              type: array
              items:
                type: string
            channelGroups:
              type: array
              items:
                $ref: '#/components/schemas/FunctionsSceneChannelGroupRef'
            palettes:
              type: array
              items:
                type: string
            baseRevision:
              type: integer
  FunctionsSceneSetMembersResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsSceneSetMembersOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsSceneSetMembersOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/FunctionsDocRevisionResult'
  FunctionsSceneMembersChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: functions.scene.membersChanged
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - functionId
          - docRevision
          properties:
            functionId:
              type: string
            fixtures:
              type: array
              items:
                type: string
            fixtureGroups:
              type: array
              items:
                type: string
            channelGroups:
              type: array
              items:
                $ref: '#/components/schemas/FunctionsSceneChannelGroupRef'
            palettes:
              type: array
              items:
                type: string
            docRevision:
              type: integer
  FunctionsChaserStepsChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: functions.chaser.stepsChanged
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - functionId
          - patch
          - docRevision
          properties:
            functionId:
              type: string
            patch:
              type: array
              description: 'RFC 6902 JSON Patch ops against the FunctionsChaserDetail.steps array (add/remove/replace/move
                at "/steps/<index>"), emitted by addStep/removeStep/replaceStep/moveStep.

                '
              items:
                $ref: '#/components/schemas/FunctionsPatchOp'
            docRevision:
              type: integer
  FunctionsChaserSetSpeedModesRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.chaser.setSpeedModes
        params:
          type: object
          required:
          - functionId
          - baseRevision
          properties:
            functionId:
              type: string
            fadeInMode:
              $ref: '#/components/schemas/FunctionsSpeedModeEnum'
            fadeOutMode:
              $ref: '#/components/schemas/FunctionsSpeedModeEnum'
            durationMode:
              $ref: '#/components/schemas/FunctionsSpeedModeEnum'
            baseRevision:
              type: integer
  FunctionsChaserSetSpeedModesResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsChaserSetSpeedModesOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsChaserSetSpeedModesOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/FunctionsDocRevisionResult'
