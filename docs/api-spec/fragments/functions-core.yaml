          const: functions.channelsgroup.setInputSource
        params:
          type: object
          required:
          - channelsGroupId
          - baseRevision
          properties:
            channelsGroupId:
              type: string
            inputSource:
              type:
              - object
              - 'null'
              description: null clears the external input assignment. Shape mirrors QLCInputSource (universe/channel),
                owned in full by the I/O domain fragment.
              properties:
                universe:
                  type: integer
                channel:
                  type: integer
            baseRevision:
              type: integer
  FunctionsChannelsGroupSetInputSourceResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsChannelsGroupChangedOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsChannelsGroupChangedOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/FunctionsDocRevisionResult'
  FunctionsChannelsGroupChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: functions.channelsgroup.changed
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - channelsGroup
          - docRevision
          description: Emitted by setChannels/setLevel/setInputSource; carries the full new detail (a
            ChannelsGroup is small).
          properties:
            channelsGroup:
              $ref: '#/components/schemas/FunctionsChannelsGroupDetail'
            docRevision:
              type: integer
  FunctionsStepsMutationOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/FunctionsDocRevisionResult'
  FunctionsStepsRemoveStepRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.steps.removeStep
        params:
          type: object
          required:
          - functionId
          - index
          - baseRevision
          properties:
            functionId:
              type: string
            index:
              type: integer
            baseRevision:
              type: integer
  FunctionsStepsRemoveStepResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsStepsMutationOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsStepsMoveStepRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.steps.moveStep
        params:
          type: object
          required:
          - functionId
          - sourceIndex
          - destIndex
          - baseRevision
          description: 'A real editor''s bulk step operations (ChaserEditor multi-move, duplicate, shuffle)
            have no single batch method here - they must be replicated as N sequential calls to removeStep/moveStep/addStep,
            each individually gated by its own baseRevision (§4a). Any call in the middle of such a sequence
            can CONFLICT (another client''s edit lands between two of the client''s own calls), leaving
            the step list in a partially-applied state with no rollback - a client implementing "duplicate
            3 steps" or "shuffle" should be prepared to detect this and re-fetch/retry/undo, not assume
            the whole batch is atomic.

            '
          properties:
            functionId:
              type: string
            sourceIndex:
              type: integer
            destIndex:
              type: integer
            baseRevision:
              type: integer
  FunctionsStepsMoveStepResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsStepsMutationOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsStepsAddStepRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.steps.addStep
        params:
          type: object
          required:
          - functionId
          - step
          - baseRevision
          description: params.step's shape is determined by the target function's own type (Chaser or
            Sequence, looked up server-side from functionId, not a separate discriminator field here)
            - see FunctionsChaserStep, FunctionsSequenceStep.
          properties:
            functionId:
              type: string
            step:
              oneOf:
              - $ref: '#/components/schemas/FunctionsChaserStep'
              - $ref: '#/components/schemas/FunctionsSequenceStep'
            index:
              type: integer
              description: Insertion index; omit/-1 to append (Chaser::addStep).
            baseRevision:
              type: integer
  FunctionsStepsAddStepResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsStepsMutationOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsStepsReplaceStepRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.steps.replaceStep
        params:
          type: object
          required:
          - functionId
          - index
          - step
          - baseRevision
          description: params.step's shape is determined by the target function's own type (Chaser or
            Sequence, looked up server-side from functionId, not a separate discriminator field here)
            - see FunctionsChaserStep, FunctionsSequenceStep.
          properties:
            functionId:
              type: string
            index:
              type: integer
            step:
              oneOf:
              - $ref: '#/components/schemas/FunctionsChaserStep'
              - $ref: '#/components/schemas/FunctionsSequenceStep'
            baseRevision:
              type: integer
  FunctionsStepsReplaceStepResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsStepsMutationOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
schemas:
  FunctionsTypeEnum:
    type: string
    enum:
    - Scene
    - Chaser
    - EFX
    - Collection
    - Script
    - RGBMatrix
    - Show
    - Sequence
    - Audio
    - Video
    description: Function::Type bitmask enum, stringified (function.cpp typeToString).
  FunctionsRunOrderEnum:
    type: string
    enum:
    - Loop
    - SingleShot
    - PingPong
    - Random
  FunctionsDirectionEnum:
    type: string
    enum:
    - Forward
    - Backward
  FunctionsTempoTypeEnum:
    type: string
    enum:
    - Time
    - Beats
    - Original
    description: 'Time/Beats are the two persistable tempo types (Function::TempoType). Original is a
      sentinel only valid as an override param on functions.start, meaning "don''t override, use the function''s
      own tempoType".

      '
  FunctionsBlendModeEnum:
    type: string
    enum:
    - Normal
    - Mask
    - Additive
    - Subtractive
    description: 'Universe::BlendMode, PascalCase matching Universe::blendModeToString()/stringToBlendMode()
      verbatim. This is the single canonical schema for the one persisted blendMode field - RGBMatrix::setBlendMode
      (functions-advanced.yaml, FunctionsRgbMatrixConfig.blendMode) overrides the generic Function-level
      setter but writes the same underlying value, so functions-advanced.yaml references this schema
      directly rather than redefining its own enum (previously a separate, differently-cased `FunctionsBlendMode`
      schema there - fixed since a value read from functions.get''s blendMode could not be written
      back through functions.rgbmatrix.setConfig without a client-side case translation).

      '
  FunctionsSpeedModeEnum:
    type: string
    enum:
    - Default
    - Common
    - PerStep
    description: Chaser::SpeedMode - also used by Sequence, which subclasses Chaser.
  FunctionsFadeControlModeEnum:
    type: string
    enum:
    - FromFunction
    - Blended
    - Crossfade
    - BlendedCrossfade
    description: Chaser::FadeControlMode, used by functions.chaser.setAction's fadeMode.
  FunctionsEfxAlgorithmEnum:
    type: string
    enum:
    - Circle
    - Eight
    - Line
    - Line2
    - Diamond
    - Square
    - SquareChoppy
    - SquareTrue
    - Leaf
    - Lissajous
  FunctionsEfxPropagationModeEnum:
    type: string
    enum:
    - Parallel
    - Serial
    - Asymmetric
  FunctionsEfxFixtureModeEnum:
    type: string
    enum:
    - PanTilt
    - Dimmer
    - RGB
    description: EFXFixture::Mode - which parameter(s) this fixture's participation animates. A clean-slate
      naming choice for the PanTilt value (every other enum in this fragment matches the engine's own
      XML string verbatim) - the engine's on-wire/XML string for it is "Position" (KXMLQLCEFXFixtureModePanTilt
      in engine/src/efxfixture.h), so a server implementation must map PanTilt<->"Position" explicitly
      rather than passing the enum value straight through.
  FunctionsDocRevisionResult:
    type: object
    required:
    - docRevision
    properties:
      docRevision:
        type: integer
  FunctionsCreateResult:
    type: object
    required:
    - functionId
    - docRevision
    properties:
      functionId:
        type: string
      docRevision:
        type: integer
  FunctionsPatchOp:
    type: object
    required:
    - op
    - path
    description: One RFC 6902 JSON Patch operation.
    properties:
      op:
        type: string
        enum:
        - add
        - remove
        - replace
        - move
      path:
        type: string
      from:
        type: string
        description: Only present when op is move.
      value: {}
  FunctionsAttribute:
    type: object
    required:
    - index
    - name
    - value
    - min
    - max
    description: 'Function::Attribute (registerAttribute/attributes()). Index 0 is Intensity for every
      function type EXCEPT Show, which unregisters its own Intensity attribute in its constructor
      (Show::Show, engine/src/show.cpp) so its attributes map 1:1 onto its tracks instead - resolve
      by name, don''t hardcode index 0.

      overridden/overrideValue reflect the engine''s separate runtime attribute-override mechanism
      (Function::requestAttributeOverride/adjustAttribute/releaseAttributeOverride) - e.g. a VC control
      layered on top of this function''s own base value. This is read-only telemetry here: functions.adjustAttribute
      only ever writes the base `value`, and there is currently no client-facing way to request or
      release an override, or to know who holds one - a real gap (see functions.adjustAttribute''s
      own description) worth a dedicated override-lifecycle API in a future revision, tracked rather
      than silently implied by these two fields.

      '
    properties:
      index:
        type: integer
      name:
        type: string
      value:
        type: number
      min:
        type: number
      max:
        type: number
      overridden:
        type: boolean
      overrideValue:
        type: number
      flags:
        type: array
        description: Function::Attribute's registration flags (Function::OverrideFlags), informational
          - describes how concurrent overrides on this attribute combine, not something a client sets.
        items:
          $ref: '#/components/schemas/FunctionsAttributeFlagEnum'
  FunctionsAttributeFlagEnum:
    type: string
    enum:
    - Multiply
    - LastWins
    - Single
    description: 'Function::OverrideFlags (engine/src/function.h). Multiply: the base value is multiplied
      by the overridden value(s). LastWins: the last-applied override replaces the base value outright.
      Single: only one override ID is ever allowed for this attribute at a time.

      '
  FunctionsSummary:
    type: object
    required:
    - id
    - name
    - type
    - path
    - hidden
    properties:
      id:
        type: string
      name:
        type: string
      type:
        $ref: '#/components/schemas/FunctionsTypeEnum'
      path:
        type: string
        description: Folder path, always the simplified/bare form (Function::path(true) - no leading
          "<TypeString>/" prefix). Use this form as-is when sending functions.move's path param; the
          type-prefixed form Function::path() returns by default in the engine (e.g. "Scene/MyFolder")
          is never what's on the wire here.
      hidden:
        type: boolean
        description: Function::isVisible() negated.
  FunctionsDetail:
    type: object
    required:
    - id
    - name
    - type
    - path
    - hidden
    - runOrder
    - direction
    - tempoType
    - fadeInSpeed
    - fadeOutSpeed
    - duration
    - totalDuration
    - blendMode
    - attributes
    - typeDetail
    description: Generic Function base detail, valid for all 10 types. Type-specific detail (values/steps/geometry/members)
      is always present as typeDetail below (the old per-type functions.<type>.get calls were consolidated
      away on the premise that it's never absent).
    properties:
      id:
        type: string
      name:
        type: string
      type:
        $ref: '#/components/schemas/FunctionsTypeEnum'
      path:
        type: string
        description: See FunctionsSummary.path - always the simplified/bare form.
      hidden:
        type: boolean
      runOrder:
        $ref: '#/components/schemas/FunctionsRunOrderEnum'
      direction:
        $ref: '#/components/schemas/FunctionsDirectionEnum'
      tempoType:
        $ref: '#/components/schemas/FunctionsTempoTypeEnum'
      fadeInSpeed:
        type: integer
        description: 'Milliseconds, or beats if tempoType is Beats. Two sentinel values are valid on
          this and every other speed/duration field in this fragment (fadeOutSpeed, duration below,
          ChaserStep/SequenceStep fadeIn/hold/fadeOut/duration, functions.setCommonAttributes''s speed
          params): 4294967294 ((uint)-2, Function::infiniteSpeed()) means "infinite"/"hold forever" -
          one of the most common real step configurations - and 4294967295 ((uint)-1, Function::defaultSpeed())
          means "use the default" (only meaningful in specific contexts, e.g. as a Chaser/Sequence speed-mode
          fallback). Clients send/receive these as plain (large) integers, not a separate null/"infinite"
          wire form.

          '
      fadeOutSpeed:
        type: integer
        description: See fadeInSpeed above for the sentinel encoding.
      duration:
        type: integer
        description: See fadeInSpeed above for the sentinel encoding.
      totalDuration:
        type: integer
        description: Function::totalDuration() - considers steps/stretch, may differ from duration.
      blendMode:
        $ref: '#/components/schemas/FunctionsBlendModeEnum'
      attributes:
        type: array
        items:
          $ref: '#/components/schemas/FunctionsAttribute'
      typeDetail:
        description: Type-specific detail, discriminated by `type` above. Replaces the old per-type functions.<type>.get
          round-trip - this single functions.get call now returns everything. Each branch still carries
          its own functionId/docRevision fields as originally authored (redundant with .id / the show's
          docRevision - left as-is by the consolidation pass rather than risk editing field semantics;
          a cosmetic follow-up, not a correctness issue).
        oneOf:
        - $ref: '#/components/schemas/FunctionsAudioDetail'
        - $ref: '#/components/schemas/FunctionsChaserDetail'
        - $ref: '#/components/schemas/FunctionsCollectionDetail'
        - $ref: '#/components/schemas/FunctionsEfxDetail'
        - $ref: '#/components/schemas/FunctionsRgbMatrixDetail'
        - $ref: '#/components/schemas/FunctionsSceneDetail'
        - $ref: '#/components/schemas/FunctionsScriptDetail'
        - $ref: '#/components/schemas/FunctionsSequenceDetail'
        - $ref: '#/components/schemas/FunctionsShowDetail'
        - $ref: '#/components/schemas/FunctionsVideoDetail'
  FunctionsStatusData:
    type: object
    required:
    - functionId
    - running
    - paused
    - elapsed
    description: 4b live/runtime status - see 00-conventions.md §4b, not revision-gated.
    properties:
      functionId:
        type: string
      running:
        type: boolean
      paused:
        type: boolean
      elapsed:
        type: integer
        description: Milliseconds since start (Function::elapsed()).
      elapsedBeats:
        type: integer
        description: Present when tempoType is Beats (Function::elapsedBeats()).
      attributes:
        type: array
        description: Current effective (possibly overridden) attribute values, same shape as FunctionsDetail.attributes.
        items:
          $ref: '#/components/schemas/FunctionsAttribute'
      currentStepIndex:
        type: integer
        description: Present for a running Chaser/Sequence (Chaser::currentStepIndex()).
      runningStepsNumber:
        type: integer
        description: Present for a running Chaser/Sequence - number of steps currently crossfading (Chaser::runningStepsNumber()).
  FunctionsSceneValues:
    type: object
    description: 'A Scene''s channel value list, keyed by "<fixtureId>.<channel>" (channel is relative
      to the fixture, per SceneValue) mapping to a 0-255 value. Modeled as a map rather than an array
      (mirroring the engine''s own QMap<SceneValue, uchar> storage in Scene::m_values) specifically so
      single-channel JSON Patch ops can address one entry by key instead of by fragile array index - see
      functions-core-notes.md.

      '
    additionalProperties:
      type: integer
      minimum: 0
      maximum: 255
  FunctionsSceneChannelGroupRef:
    type: object
    required:
    - id
    - level
    properties:
      id:
        type: string
        description: ChannelsGroup id (Scene::addChannelGroup).
      level:
        type: integer
        minimum: 0
        maximum: 255
  FunctionsSceneDetail:
    type: object
    required:
    - functionId
    - values
    - fixtures
    - fixtureGroups
    - channelGroups
    - palettes
    properties:
      functionId:
        type: string
      values:
        $ref: '#/components/schemas/FunctionsSceneValues'
      fixtures:
        type: array
        items:
          type: string
        description: Scene::fixtures() - whole fixtures participating (as opposed to individual channel
          values).
      fixtureGroups:
        type: array
        items:
          type: string
      channelGroups:
        type: array
        items:
          $ref: '#/components/schemas/FunctionsSceneChannelGroupRef'
      palettes:
        type: array
        items:
          type: string
        description: Referenced Palette ids (Scene::palettes()). Palette/color-filter definitions themselves
          are out of scope for this fragment - see notes.md.
      blendFunctionId:
        type:
        - string
        - 'null'
        description: Scene::blendFunctionID() - function to blend from when preparing this Scene's faders.
  FunctionsChaserStep:
    type: object
    required:
    - targetFunctionId
    - fadeIn
    - hold
    - fadeOut
    - duration
    additionalProperties: false
    description: 'ChaserStep, without the .values field (that''s Sequence-only, see FunctionsSequenceStep).
      `additionalProperties: false` is deliberate: it''s what makes this schema and FunctionsSequenceStep
      mutually exclusive under the `step` oneOf in functions.steps.addStep/replaceStep (a Sequence step''s
      `values` field would otherwise be silently accepted here too, and vice versa for `targetFunctionId`,
      letting both oneOf branches match the same object).

      hold is the authoritative field; duration is fadeIn + hold, with the same infinite-sentinel propagation
      described on FunctionsSequenceStep.hold below. If a client sends inconsistent fadeIn/hold/duration,
      the server recomputes duration from fadeIn+hold (ChaserStep::loadXML''s behavior).

      '
    properties:
      targetFunctionId:
        type: string
        description: ChaserStep::fid - the Function this step runs.
      fadeIn:
        type: integer
        minimum: 0
        description: Milliseconds. See FunctionsDetail.fadeInSpeed for the infinite/default sentinel encoding
          - fadeIn itself is not normally infinite, but is included in duration's derivation below.
      hold:
        type: integer
        minimum: 0
        description: Milliseconds, or the infinite sentinel (Function::infiniteSpeed(), see FunctionsDetail.fadeInSpeed)
          meaning "hold forever" - one of the most common real step configurations. Authoritative over
          duration - see the schema description above.
      fadeOut:
        type: integer
        minimum: 0
      duration:
        type: integer
        minimum: 0
        description: Derived as fadeIn + hold (or mirrors hold's infinite sentinel when hold is infinite)
          - see the schema description above for which field wins if a client's values disagree.
      note:
        type: string
  FunctionsChaserDetail:
    type: object
    required:
    - functionId
    - steps
    - fadeInMode
    - fadeOutMode
    - durationMode
    additionalProperties: false
    properties:
      functionId:
        type: string
      steps:
        type: array
        items:
          $ref: '#/components/schemas/FunctionsChaserStep'
      fadeInMode:
        $ref: '#/components/schemas/FunctionsSpeedModeEnum'
      fadeOutMode:
        $ref: '#/components/schemas/FunctionsSpeedModeEnum'
      durationMode:
        $ref: '#/components/schemas/FunctionsSpeedModeEnum'
  FunctionsSequenceStep:
    type: object
    required:
    - fadeIn
    - hold
    - fadeOut
    - duration
    - values
    additionalProperties: false
    description: 'A Sequence step (ChaserStep in sequence mode). Unlike a Chaser step it has no targetFunctionId
      of its own - every step implicitly targets the Sequence''s boundSceneId, and instead carries its
      own value overrides. `additionalProperties: false` is deliberate - see FunctionsChaserStep''s description
      for why.

      '
    properties:
      fadeIn:
        type: integer
        minimum: 0
      hold:
        type: integer
        minimum: 0
        description: Same authoritative-over-duration and infinite-sentinel semantics as FunctionsChaserStep.hold.
      fadeOut:
        type: integer
        minimum: 0
      duration:
        type: integer
        minimum: 0
        description: See FunctionsChaserStep.duration.
      note:
        type: string
      values:
        $ref: '#/components/schemas/FunctionsSceneValues'
  FunctionsSequenceDetail:
    type: object
    required:
    - functionId
    - boundSceneId
    - steps
    - fadeInMode
    - fadeOutMode
    - durationMode
    additionalProperties: false
    description: '`additionalProperties: false` is deliberate: without it, a freshly-created 0-step Sequence
      (which has every field FunctionsChaserDetail requires, plus boundSceneId) would validate against
      *both* branches of FunctionsDetail.typeDetail''s oneOf, since FunctionsChaserDetail''s required
      set is a strict subset of this schema''s and neither closed out extra properties - failing oneOf''s
      "exactly one match" rule for every empty Sequence. Closing both schemas makes them mutually exclusive
      instead.

      '
    properties:
      functionId:
        type: string
      boundSceneId:
        type: string
        description: Sequence::boundSceneID().
      steps:
        type: array
        items:
          $ref: '#/components/schemas/FunctionsSequenceStep'
      fadeInMode:
        $ref: '#/components/schemas/FunctionsSpeedModeEnum'
      fadeOutMode:
        $ref: '#/components/schemas/FunctionsSpeedModeEnum'
      durationMode:
        $ref: '#/components/schemas/FunctionsSpeedModeEnum'
  FunctionsEfxFixture:
    type: object
    required:
    - fixture
    - head
    - direction
    - startOffset
    - mode
    description: EFXFixture - one fixture (head)'s participation in an EFX.
    properties:
      fixture:
        type: string
      head:
        type: integer
      direction:
        $ref: '#/components/schemas/FunctionsDirectionEnum'
      startOffset:
        type: integer
        description: Phase offset in degrees, used by Serial/Asymmetric propagation.
      mode:
        $ref: '#/components/schemas/FunctionsEfxFixtureModeEnum'
  FunctionsEfxDetail:
    type: object
    required:
    - functionId
    - algorithm
    - propagationMode
    - width
    - height
    - rotation
    - startOffset
    - isRelative
    - xOffset
    - yOffset
    - xFrequency
    - yFrequency
    - xPhase
    - yPhase
    - dimmerControlEnabled
    - fixtures
    properties:
      functionId:
        type: string
      algorithm:
        $ref: '#/components/schemas/FunctionsEfxAlgorithmEnum'
      propagationMode:
        $ref: '#/components/schemas/FunctionsEfxPropagationModeEnum'
      width:
        type: integer
      height:
        type: integer
      rotation:
        type: integer
      startOffset:
        type: integer
      isRelative:
        type: boolean
      xOffset:
        type: integer
      yOffset:
        type: integer
      xFrequency:
        type: integer
        description: Lissajous X frequency, 0-32 (see functions.efx.setParameters.xFrequency).
      yFrequency:
        type: integer
      xPhase:
        type: integer
      yPhase:
        type: integer
      dimmerControlEnabled:
        type: boolean
      fixtures:
        type: array
        items:
          $ref: '#/components/schemas/FunctionsEfxFixture'
  FunctionsCollectionDetail:
    type: object
    required:
    - functionId
    - functions
    properties:
      functionId:
        type: string
      functions:
        type: array
        items:
          type: string
        description: Collection::functions() - member function ids, run together on start.
  FunctionsChannelsGroupChannelRef:
    type: object
    required:
    - fixture
    - channel
    properties:
      fixture:
        type: string
      channel:
        type: integer
        minimum: 0
  FunctionsChannelsGroupSummary:
    type: object
    required:
    - id
    - name
    - channelCount
    - level
    properties:
      id:
        type: string
      name:
        type: string
      channelCount:
        type: integer
      level:
        type: integer
        minimum: 0
        maximum: 255
  FunctionsChannelsGroupDetail:
    type: object
    required:
    - id
    - name
    - channels
    - level
    properties:
      id:
        type: string
      name:
        type: string
      channels:
        type: array
        items:
          $ref: '#/components/schemas/FunctionsChannelsGroupChannelRef'
      level:
        type: integer
        minimum: 0
        maximum: 255
        description: ChannelsGroup's master value, persisted to XML.
      inputSource:
        type:
        - object
        - 'null'
        properties:
          universe:
            type: integer
          channel:
            type: integer
operations:
  sendFunctionsList:
    action: send
    channel:
      $ref: '#/channels/qlcplus'
    messages:
    - $ref: '#/channels/qlcplus/messages/functionsListRequest'
  receiveFunctionsListResponse:
    action: receive
    channel:
      $ref: '#/channels/qlcplus'
    messages:
    - $ref: '#/channels/qlcplus/messages/functionsListResponse'
  sendFunctionsGet:
