                - that code is reserved for baseRevision mismatches per 00-conventions.md §7) if it would
                overlap a following item (error.details then carries {blockingItemId, maxDuration}, the
                largest duration that still fits), if the item is locked, or if it is below the
                timeline minimum (1 ms in a Time Show, 125 ms in a Beats Show, like
                ShowManager::minimumTimelineDuration).

                This only changes the ShowFunction wrapper''s own duration/trim on the timeline (equivalent
                to the real editor''s "stretch" toggle being off) - it has no counterpart to the real
                editor''s stretch-resize mode (ShowManager.stretchFunctions), which instead proportionally
                rescales an underlying Chaser''s per-step durations (converting its speed mode from Common
                to PerStep as needed, see ShowManager::convertChaserCommonToPerStep) so the Chaser''s
                own content stretches to fill the new timeline duration rather than being trimmed/looped.
