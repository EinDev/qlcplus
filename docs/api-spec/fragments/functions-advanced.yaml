messages:
  FunctionsRgbMatrixListAlgorithmsRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.rgbmatrix.listAlgorithms
        params:
          type: object
          description: No parameters. The algorithm catalog (built-ins + installed RGBScripts) is global,
            not per-function.
  FunctionsRgbMatrixListAlgorithmsResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsRgbMatrixListAlgorithmsOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsRgbMatrixListAlgorithmsOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - algorithms
          properties:
            algorithms:
              type: array
              items:
                type: object
                required:
                - name
                - type
                properties:
                  name:
                    type: string
                    description: Algorithm/script display name, e.g. 'Plain', 'Text', 'Balls'. Pass as
                      algorithm.scriptName when type=script.
                  type:
                    $ref: '#/components/schemas/FunctionsRgbMatrixAlgorithmType'
                  apiVersion:
                    type: integer
                    description: Script API version (type=script only)
                  author:
                    type: string
                    description: Script author (type=script only)
                  acceptedColors:
                    type: integer
                    enum:
                    - 0
                    - 1
                    - 2
                    description: RGBAlgorithm::acceptColors() - how many of FunctionsRgbMatrixConfig.colors'
                      5 slots this algorithm actually uses. 0 = none (it generates its own colors), 1
                      = only Color1/slot 0, 2 = Color1 and Color2/slots 0-1. Drives the real editor's
                      dynamic color-slot count - a client showing all 5 slots regardless of this value
                      will offer slots the algorithm silently ignores.
  FunctionsRgbMatrixGetScriptPropertiesRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.rgbmatrix.getScriptProperties
        params:
          type: object
          required:
          - scriptName
          properties:
            scriptName:
              type: string
              description: A name returned by functions.rgbmatrix.listAlgorithms with type=script
  FunctionsRgbMatrixGetScriptPropertiesResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsRgbMatrixGetScriptPropertiesOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsRgbMatrixGetScriptPropertiesOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - properties
          properties:
            properties:
              type: array
              description: UI-editable properties this script exposes (RGBScriptProperty). Values themselves
                live per-function in FunctionsRgbMatrixConfig.algorithm.scriptProperties.
              items:
                $ref: '#/components/schemas/FunctionsRgbMatrixScriptPropertyDef'
  FunctionsRgbMatrixGetPreviewRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.rgbmatrix.getPreview
        params:
          type: object
          required:
          - functionId
          - step
          properties:
            functionId:
              type: string
            step:
              type: integer
              description: Step index to render, 0-based, modulo the algorithm's stepsCount (see result.stepsCount)
  FunctionsRgbMatrixGetPreviewResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsRgbMatrixGetPreviewOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsRgbMatrixGetPreviewOkResponse:
    payload:
