schemas:
  FunctionsRgbMatrixAlgorithmType:
    type: string
    enum:
    - plain
    - text
    - script
    - image
    - audio
    description: RGBAlgorithm::Type. 'audio' here means the audio-reactive color algorithm (RGBAudio),
      unrelated to the Audio function type.
  FunctionsRgbMatrixAlgorithm:
    type: object
    required:
    - type
    description: 'Flat, not a strict oneOf: only the fields relevant to `type` are meaningful, the rest
      are ignored by the engine. See functions-advanced-notes.md for why this shape was chosen over a
      discriminated union.

      '
    properties:
      type:
        $ref: '#/components/schemas/FunctionsRgbMatrixAlgorithmType'
      name:
        type: string
        readOnly: true
        description: Read side only (functions.get / configChanged) - the loaded algorithm's catalog
          name as functions.rgbmatrix.listAlgorithms lists it ('Plain Color', 'Text', 'Image',
          'Audio Spectrum', or the script name). Ignored in setConfig, where type (+ scriptName)
          selects the algorithm.
      acceptedColors:
        type: integer
        readOnly: true
        description: Read side only - RGBAlgorithm::acceptColors() of the loaded algorithm right now
          (see listAlgorithms; scripts may change it from their own properties, e.g. Plasma), so a
          client sizes its colour-slot row from the function itself instead of the catalog.
      scriptName:
        type: string
        description: type=script only. One of functions.rgbmatrix.listAlgorithms' script entries
      scriptProperties:
        type: array
        description: type=script only. Current values of the script's exposed properties.
        items:
          type: object
          required:
          - name
          - value
          properties:
            name:
              type: string
            value:
              type: string
      text:
        type: string
        description: type=text only
      font:
        type: object
        description: 'type=text only. Deliberate subset of the engine''s full QFont (RGBText stores/round-trips
          a complete QFont, and the real editor exposes it via a native font picker, qmlui/rgbmatrixeditor.h''s
          algoTextFont) - only family/pointSize/bold/italic are exposed here. Other QFont attributes
          the editor lets you set (underline, weight values beyond plain bold/regular, stretch, letter
          spacing, etc.) are not represented in this schema; a client-authored functions.rgbmatrix.setConfig
          silently drops/resets them rather than preserving whatever the file already had.

          '
        properties:
          family:
            type: string
          pointSize:
            type: integer
          bold:
            type: boolean
          italic:
            type: boolean
      imagePath:
        type: string
        description: type=image only. Path resolved on the engine host machine.
      animationStyle:
        type: string
        description: 'type=text only: one of staticLetters, horizontal, vertical. type=image only: one
          of static, horizontal, vertical, animation (the animated-source case, e.g. an animated GIF).

          '
        enum:
        - staticLetters
        - static
        - horizontal
        - vertical
        - animation
      xOffset:
        type: integer
        description: type=text|image only
      yOffset:
        type: integer
        description: type=text|image only
  FunctionsRgbMatrixScriptPropertyDef:
    type: object
    required:
    - name
    - displayName
    - type
    properties:
      name:
        type: string
        description: Key to use in FunctionsRgbMatrixAlgorithm.scriptProperties / functions.rgbmatrix.setScriptProperty
      displayName:
        type: string
      type:
        type: string
        enum:
        - list
        - range
        - float
        - string
      listValues:
        type: array
        items:
          type: string
        description: type=list only
      rangeMin:
        type: integer
        description: type=range only
      rangeMax:
        type: integer
        description: type=range only
  FunctionsRgbMatrixControlMode:
    type: string
    enum:
    - rgb
    - white
    - amber
    - uv
    - dimmer
    - shutter
    description: RGBMatrix::ControlMode
  FunctionsRgbMatrixConfig:
    type: object
    required:
    - fixtureGroupId
    - algorithm
    - colors
    - controlMode
    properties:
      fixtureGroupId:
        type:
        - string
        - 'null'
        description: Opaque Fixture Group ID (owned by the fixtures domain fragment). null when the
          matrix is not bound to any group yet (a functions.create'd RGB Matrix - the engine's
          FixtureGroup::invalidId(); the Qt editor silently binds the first group on open, the API
          does not), in which case getPreview reports 0 x 0 and the function outputs nothing.
      algorithm:
        $ref: '#/components/schemas/FunctionsRgbMatrixAlgorithm'
      colors:
        type: array
        description: Up to 5 slots (Color1..Color5); a slot's value is null when unset (RGBMatrixEditor::hasColorAtIndex()==false,
          algorithm falls back to its own default)
        minItems: 5
        maxItems: 5
        items:
          type:
          - string
          - 'null'
      controlMode:
        $ref: '#/components/schemas/FunctionsRgbMatrixControlMode'
      blendMode:
        $ref: '#/components/schemas/FunctionsBlendModeEnum'
        description: Same schema and PascalCase casing as functions-core.yaml's FunctionsDetail.blendMode
          - this is the same persisted Function-level field (RGBMatrix::setBlendMode overrides the generic
          setter but writes the same value), previously duplicated here under a different, lowercase-cased
          local schema; a value read from functions.get can now be written back here directly with no
          case translation.
      dimmerControl:
        type: boolean
        description: Legacy flag, superseded by controlMode=dimmer. See notes.md.
  FunctionsShowTimeDivision:
    type: string
    enum:
    - time
    - bpm_4_4
    - bpm_3_4
    - bpm_2_4
    description: Show::TimeDivision
  FunctionsShowItem:
    type: object
    required:
    - id
    - functionId
    - startTime
    - duration
    - color
    - locked
    properties:
      id:
        type: string
        description: ShowFunction ID, unique within the Show
      functionId:
        type: string
        description: The generic function object placed on the timeline
      functionType:
        $ref: '#/components/schemas/FunctionsTypeEnum'
        description: Read-only convenience, the placed function's type (a client draws Audio/Video/Chaser
          items differently without a functions.get per item). Absent when the function no longer exists.
      functionName:
        type: string
        description: Read-only convenience, the placed function's current name. Absent when the function
          no longer exists.
      startTime:
        type: integer
        description: Milliseconds from the Show's start
      duration:
        type: integer
        description: Milliseconds; independent of the placed function's own duration
      color:
        type: string
      locked:
        type: boolean
  FunctionsShowTrack:
    type: object
    required:
    - id
    - name
    - mute
    - items
    properties:
      id:
        type: string
      name:
        type: string
      sceneId:
        type: string
        description: Bound Scene function, if any (absent for an audio/video-only track)
      mute:
        type: boolean
      items:
        type: array
        items:
          $ref: '#/components/schemas/FunctionsShowItem'
      spout:
        $ref: '#/components/schemas/FunctionsShowTrackSpout'
        description: Added 2026-09-27; absent on a track without Spout-mode Videos and without a fixed
          size.
  FunctionsAudioConfig:
    type: object
    required:
    - sourceFileName
    - volume
    - duration
    properties:
      sourceFileName:
        type: string
      volume:
        type: number
        minimum: 0
        maximum: 1
        description: Persisted startup volume
      duration:
        type: integer
        description: Milliseconds; playback duration (may differ from the source file's own detected length,
          see Audio::setTotalDuration)
      audioDevice:
        type: string
        description: Output device identifier on the engine host; empty = global default
      muted:
        type: boolean
        description: Read-only here (Audio::muted(), the editors' Mute checkbox); no API setter yet
      bpm:
        type: object
        description: Result of the fork's offline BPM analysis (Audio::detectedBpm() etc.), read-only
        properties:
          state:
            type: string
            enum: [notAnalyzed, analyzing, done, failed]
          value:
            type: number
          confidence:
            type: number
      sampleRate:
        type: integer
        description: Decoder-reported sample rate in Hz (0 when no decoder is loaded)
      channels:
        type: integer
        description: Decoder-reported channel count (0 when no decoder is loaded)
      bitrate:
        type: integer
        description: Decoder-reported bitrate in kb/s (0 when no decoder is loaded)
  FunctionsVideoConfig:
    type: object
    required:
    - sourceUrl
    - customGeometry
    - rotation
    - zIndex
    - screen
    - fullscreen
    - outputMode
    properties:
      sourceUrl:
        type: string
      isPicture:
        type: boolean
        description: Read-only, detected from the source
      customGeometry:
        type:
        - object
        - 'null'
        description: null when the video renders at its natural / fullscreen size (Video::customGeometry().isNull())
        properties:
          x:
            type: integer
          y:
            type: integer
          width:
            type: integer
          height:
            type: integer
      rotation:
        type: object
        properties:
          x:
            type: number
          y:
            type: number
          z:
            type: number
      zIndex:
        type: integer
      screen:
        type: integer
        description: Index into functions.video.listCapabilities' screens
      fullscreen:
        type: boolean
        description: outputMode == fullscreen (kept for the original request/event shapes)
      outputMode:
        type: string
        enum: [windowed, fullscreen, spout]
        description: Video::OutputMode. spout is this fork's Spout texture-sharing output (Windows only);
          its window / sender is desktop-only, the mode itself is document state.
      spoutSize:
        type: object
        description: Spout sender size, 0x0 = native resolution. Set with functions.video.setSpoutSize.
        properties:
          width:
            type: integer
          height:
            type: integer
      spoutSenderName:
        type: string
        description: Read-only. The Spout sender name (Video::defaultSpoutSenderName()), derived from the
          function name - rename the function to change it.
      volume:
        type: number
        description: Read-only here (Video::volume(), 0-100); no API setter yet
      muted:
        type: boolean
        description: Read-only here (Video::muted()); no API setter yet
      resolution:
        type: object
        description: Read-only, detected from the source; absent until the host probed the file
        properties:
          width:
            type: integer
          height:
            type: integer
      detectedDurationMs:
        type: integer
        description: Video::totalDuration(); 0 for a picture or an unprobed source
      videoCodec:
        type: string
        description: Read-only, detected
      audioCodec:
        type: string
        description: Read-only, detected
  FunctionsRgbMatrixDetail:
    type: object
    required:
    - functionId
    - config
    - docRevision
    properties:
      functionId:
        type: string
      config:
        $ref: '#/components/schemas/FunctionsRgbMatrixConfig'
      docRevision:
        type: integer
  FunctionsScriptDetail:
    type: object
    required:
    - functionId
    - source
    - docRevision
    properties:
      functionId:
        type: string
      source:
        type: string
        description: 'Full raw script text (Script::data()). Deliberately no syntax errors here: on a
          scriptv4 build a syntax check evaluates the body in a QJSEngine without an interrupt, which a
          read path must never do - call functions.script.validate explicitly.'
      docRevision:
        type: integer
  FunctionsShowDetail:
    type: object
    required:
    - functionId
    - timeDivisionType
    - timeDivisionBPM
    - tracks
    - docRevision
    properties:
      functionId:
        type: string
      timeDivisionType:
        $ref: '#/components/schemas/FunctionsShowTimeDivision'
      timeDivisionBPM:
        type: integer
      tracks:
        type: array
        items:
          $ref: '#/components/schemas/FunctionsShowTrack'
        description: In Show::tracks() order (ascending track id - Show::moveTrack swaps the ids of the two
          tracks it reorders, so a track's id changes when it is moved; re-read the tracks after
          functions.show.track.move).
      totalDuration:
        type: integer
        description: Read-only, Show::totalDuration() in ms - the end of the last item on any track (an
          item with duration 0 counts with its function's own totalDuration).
      previewing:
        type: boolean
        description: Added 2026-09-27, runtime. The Show runs frozen at a cursor (functions.show.preview,
          or the desktop Show Manager's own preview) - Show::isScrubMode().
      docRevision:
        type: integer
  FunctionsAudioDetail:
    type: object
    required:
    - functionId
    - source
    - managed
    - docRevision
    properties:
      functionId:
        type: string
      source:
        $ref: '#/components/schemas/FunctionsMediaSource'
      managed:
        $ref: '#/components/schemas/FunctionsMediaManaged'
      importPending:
        $ref: '#/components/schemas/FunctionsMediaImportPending'
      origin:
        $ref: '#/components/schemas/FunctionsMediaOrigin'
      originAvailable:
        $ref: '#/components/schemas/FunctionsMediaOriginAvailable'
      originChanged:
        $ref: '#/components/schemas/FunctionsMediaOriginChanged'
      config:
        $ref: '#/components/schemas/FunctionsAudioConfig'
      docRevision:
        type: integer
  FunctionsVideoDetail:
    type: object
    required:
    - functionId
    - source
    - managed
    - docRevision
    properties:
      functionId:
        type: string
      source:
        $ref: '#/components/schemas/FunctionsMediaSource'
      managed:
        $ref: '#/components/schemas/FunctionsMediaManaged'
      importPending:
        $ref: '#/components/schemas/FunctionsMediaImportPending'
      origin:
        $ref: '#/components/schemas/FunctionsMediaOrigin'
      originAvailable:
        $ref: '#/components/schemas/FunctionsMediaOriginAvailable'
      originChanged:
        $ref: '#/components/schemas/FunctionsMediaOriginChanged'
      config:
        $ref: '#/components/schemas/FunctionsVideoConfig'
      docRevision:
        type: integer
  FunctionsMediaSource:
    type: string
    description: 'The Audio/Video source as the engine holds it. For a file in the project''s media
      store (managed = true) this is the workspace-relative path the .qxw persists, e.g.
      "show.qxw.assets/3f2a9c1b7d5e/intro.wav" (absolute only while the project is still untitled and
      has no workspace directory). Otherwise the raw absolute path or scheme:// URL.

      '
  FunctionsMediaManaged:
    type: boolean
    description: True when the source lives in <project>.qxw.assets/<sha1-12>/ and moves with the
      project; false for an external file reference or a stream URL.
  FunctionsMediaImportPending:
    type: boolean
    description: True while a background copy of this source into the media store is still running
      (large files); the function is relinked to the copy, and managed becomes true, once it lands.
  FunctionsMediaOrigin:
    type:
    - string
    - 'null'
    description: Absolute path the managed copy was imported from, as recorded in the media store's
      manifest.json (kept per stored copy, so undoing a Replace/Reload restores that copy's own
      origin). Always absolute - it lives outside the workspace by nature. null for an external
      reference, a stream URL, or a copy imported before provenance was recorded.
  FunctionsMediaOriginAvailable:
    type: boolean
    description: True when origin is known and that file still exists on disk (the precondition for
      functions.media.reload on a managed copy).
  FunctionsMediaOriginChanged:
    type: boolean
    description: True when the origin file differs from the managed copy (size or mtime differ, an
      equal-size file confirmed by content hash). A missing origin reports false - unavailable is not
      changed. Never acted on automatically; see functions.media.reload.
  FunctionsMediaReloadStatus:
    type: string
    enum:
    - reloaded
    - unchanged
    - queued
    - missing
    - notManaged
    description: 'reloaded: a fresh copy was stored and the function re-pointed at it (the previous
      copy stays on disk; functions.media.reloaded follows). unchanged: origin content identical, or
      an external file re-probed in place. queued: origin above the background-copy threshold, the
      function is re-pointed when the copy lands (functions.media.reloaded then). missing: no origin
      recorded or the origin file is gone (error says which). notManaged: nothing to reload.'
  FunctionsMediaReloadResult:
    type: object
    description: The function's refreshed FunctionsAudioDetail/FunctionsVideoDetail plus the reload
      outcome. A duration change does not touch Show clips (ShowFunction keeps its own duration);
      the engine logs a "[Media]" line with the old/new values instead.
    required:
    - functionId
    - source
    - managed
    - status
    - docRevision
    properties:
      functionId:
        type: string
      source:
        $ref: '#/components/schemas/FunctionsMediaSource'
      managed:
        $ref: '#/components/schemas/FunctionsMediaManaged'
      importPending:
        $ref: '#/components/schemas/FunctionsMediaImportPending'
      origin:
        $ref: '#/components/schemas/FunctionsMediaOrigin'
      originAvailable:
        $ref: '#/components/schemas/FunctionsMediaOriginAvailable'
      originChanged:
        $ref: '#/components/schemas/FunctionsMediaOriginChanged'
      status:
        $ref: '#/components/schemas/FunctionsMediaReloadStatus'
      error:
        type: string
        description: Present for status missing - the path that could not be found
      docRevision:
        type: integer
  FunctionsShowSpoutSize:
    type: object
    required:
    - width
    - height
    properties:
      width:
        type: integer
      height:
        type: integer
  FunctionsShowTrackSpout:
    type: object
    description: 'Added 2026-09-27. The track''s shared Spout output (TrackDelegate.qml''s label,
      ShowManager::trackSpoutInfo): present on a track that holds Spout-mode Videos or a fixed size.
      mismatch is true when some clip with a known size differs from outputSize - what
      PopupSpoutSizeMismatch.qml asks about when such a clip is placed.

      '
    required:
    - fixedSize
    - outputSize
    - clips
    - mismatch
    properties:
      fixedSize:
        oneOf:
        - $ref: '#/components/schemas/FunctionsShowSpoutSize'
        - type: 'null'
        description: Track::spoutSize, null when not fixed.
      outputSize:
        oneOf:
        - $ref: '#/components/schemas/FunctionsShowSpoutSize'
        - type: 'null'
        description: What the sender outputs - the fixed size, otherwise the live sender's size as the
          desktop app reports it (created by the first clip); null when there is no sender yet or no
          desktop host (headless).
      clips:
        type: array
        description: The track's Spout-mode Videos in start-time order; size = the Video's own
          spoutSize, else its resolution, 0x0 while unknown.
        items:
          type: object
          required:
          - itemId
          - functionId
          - name
          - width
          - height
          properties:
            itemId:
              type: string
            functionId:
              type: string
            name:
              type: string
            width:
              type: integer
            height:
              type: integer
      mismatch:
        type: boolean
