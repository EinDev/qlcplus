      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.show.preview
        params:
          type: object
          required:
          - showId
          - time
          description: 'Added 2026-09-27, runtime (no baseRevision). Preview the Show at the cursor while
            it is stopped or paused - the desktop Show Manager''s preview-at-cursor (ShowManager::previewAt,
            engine Show::setScrubMode / requestSeek). A stopped Show is started frozen at $time (fixtures
            and video follow the cursor, Audio stays silent, nothing advances); a previewing Show seeks
            to $time (seeks posted between two MasterTimer ticks coalesce); a paused Show is handed
            over to the frozen state at $time. A playing Show is INVALID_STATE, and so is one that is
            still stopping (retry). Broadcasts functions.show.previewChanged when a preview starts
            (not on every seek). Outputs real DMX, like previewing a Function in the Function Manager.

