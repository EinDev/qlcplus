  FunctionsScriptListCommandsResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsScriptListCommandsOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsScriptListCommandsOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - commands
          - snippets
          properties:
            commands:
              type: array
              description: 'The Script::*Cmd keyword set. On a qmlui (QLC+ 5) build the engine''s Script is
                the JavaScript-based scriptv4 (engine/src/scriptv4.cpp, selected by engine/src/scriptwrapper.h)
                and the keywords are the `Engine.<method>` names its ScriptRunner exposes: Engine.startFunction,
                Engine.stopFunction, Engine.isFunctionRunning, Engine.setFunctionAttribute, Engine.setFixture,
                Engine.getChannelValue, Engine.waitTime, Engine.waitFunctionStart, Engine.waitFunctionStop,
                Engine.setBlackout, Engine.stopOnExit, Engine.systemCommand, Engine.setBPM, Engine.random.
                A legacy (QLC+ 4) build would report the line-command keywords instead (stoponexit,
                startfunction, stopfunction, blackout, wait, waitkey, waitfunctionstart, waitfunctionstop,
                setfixture, systemcommand, label, jump).'
              items:
                type: string
            snippets:
              type: array
              description: 'Editor helper entries mirroring ScriptEditor.qml''s "Add a method call at cursor
                position" menu: `insert` is the text to place at the cursor (e.g. "Engine.startFunction();"),
                `caretOffset` how many characters before the end of `insert` the caret should land (3 puts
                it between the parentheses), `label`/`icon` are for the menu row.'
              items:
                type: object
                required:
                - label
                - insert
                properties:
                  label:
                    type: string
                  insert:
                    type: string
                  caretOffset:
                    type: integer
                  icon:
                    type: string
                    description: A hint name (play, stop, sliders, hourglass, dice, moon, terminal), not a path
