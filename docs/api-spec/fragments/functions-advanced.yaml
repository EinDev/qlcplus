schemas:
  FunctionsRgbMatrixAlgorithmType:
    type: string
    enum:
    - plain
    - text
    - script
    - image
    - audio
    description: RGBAlgorithm::Type. 'audio' here means the audio-reactive color algorithm (RGBAudio),
      unrelated to the Audio function type.
  FunctionsRgbMatrixAlgorithm:
    type: object
    required:
    - type
    description: 'Flat, not a strict oneOf: only the fields relevant to `type` are meaningful, the rest
      are ignored by the engine. See functions-advanced-notes.md for why this shape was chosen over a
      discriminated union.

      '
    properties:
      type:
        $ref: '#/components/schemas/FunctionsRgbMatrixAlgorithmType'
      scriptName:
        type: string
        description: type=script only. One of functions.rgbmatrix.listAlgorithms' script entries
      scriptProperties:
        type: array
        description: type=script only. Current values of the script's exposed properties.
        items:
          type: object
          required:
          - name
          - value
          properties:
            name:
              type: string
            value:
              type: string
      text:
        type: string
        description: type=text only
      font:
        type: object
        description: 'type=text only. Deliberate subset of the engine''s full QFont (RGBText stores/round-trips
          a complete QFont, and the real editor exposes it via a native font picker, qmlui/rgbmatrixeditor.h''s
          algoTextFont) - only family/pointSize/bold/italic are exposed here. Other QFont attributes
          the editor lets you set (underline, weight values beyond plain bold/regular, stretch, letter
          spacing, etc.) are not represented in this schema; a client-authored functions.rgbmatrix.setConfig
          silently drops/resets them rather than preserving whatever the file already had.

          '
        properties:
          family:
            type: string
          pointSize:
            type: integer
          bold:
            type: boolean
          italic:
            type: boolean
      imagePath:
        type: string
        description: type=image only. Path resolved on the engine host machine.
      animationStyle:
        type: string
        description: 'type=text only: one of staticLetters, horizontal, vertical. type=image only: one
          of static, horizontal, vertical, animation (the animated-source case, e.g. an animated GIF).

          '
        enum:
        - staticLetters
        - static
        - horizontal
        - vertical
        - animation
      xOffset:
        type: integer
        description: type=text|image only
      yOffset:
        type: integer
        description: type=text|image only
  FunctionsRgbMatrixScriptPropertyDef:
    type: object
    required:
    - name
    - displayName
    - type
    properties:
      name:
        type: string
        description: Key to use in FunctionsRgbMatrixAlgorithm.scriptProperties / functions.rgbmatrix.setScriptProperty
      displayName:
        type: string
      type:
        type: string
        enum:
        - list
        - range
        - float
        - string
      listValues:
        type: array
        items:
          type: string
        description: type=list only
      rangeMin:
        type: integer
        description: type=range only
      rangeMax:
        type: integer
        description: type=range only
  FunctionsRgbMatrixControlMode:
    type: string
    enum:
    - rgb
    - white
    - amber
    - uv
    - dimmer
    - shutter
    description: RGBMatrix::ControlMode
  FunctionsRgbMatrixConfig:
    type: object
    required:
    - fixtureGroupId
    - algorithm
    - colors
    - controlMode
    properties:
      fixtureGroupId:
        type: string
        description: Opaque Fixture Group ID (owned by the fixtures domain fragment)
      algorithm:
        $ref: '#/components/schemas/FunctionsRgbMatrixAlgorithm'
      colors:
        type: array
        description: Up to 5 slots (Color1..Color5); a slot's value is null when unset (RGBMatrixEditor::hasColorAtIndex()==false,
          algorithm falls back to its own default)
        minItems: 5
        maxItems: 5
        items:
          type:
          - string
          - 'null'
      controlMode:
        $ref: '#/components/schemas/FunctionsRgbMatrixControlMode'
      blendMode:
        $ref: '#/components/schemas/FunctionsBlendModeEnum'
        description: Same schema and PascalCase casing as functions-core.yaml's FunctionsDetail.blendMode
          - this is the same persisted Function-level field (RGBMatrix::setBlendMode overrides the generic
          setter but writes the same value), previously duplicated here under a different, lowercase-cased
          local schema; a value read from functions.get can now be written back here directly with no
          case translation.
      dimmerControl:
        type: boolean
        description: Legacy flag, superseded by controlMode=dimmer. See notes.md.
  FunctionsShowTimeDivision:
    type: string
    enum:
    - time
    - bpm_4_4
    - bpm_3_4
    - bpm_2_4
    description: Show::TimeDivision
  FunctionsShowItem:
    type: object
    required:
    - id
    - functionId
    - startTime
    - duration
    - color
    - locked
    properties:
      id:
        type: string
        description: ShowFunction ID, unique within the Show
      functionId:
        type: string
        description: The generic function object placed on the timeline
      startTime:
        type: integer
        description: Milliseconds from the Show's start
      duration:
        type: integer
        description: Milliseconds; independent of the placed function's own duration
      color:
        type: string
      locked:
        type: boolean
  FunctionsShowTrack:
    type: object
    required:
    - id
    - name
    - mute
    - items
    properties:
      id:
        type: string
      name:
        type: string
      sceneId:
        type: string
        description: Bound Scene function, if any (absent for an audio/video-only track)
      mute:
        type: boolean
      items:
        type: array
        items:
          $ref: '#/components/schemas/FunctionsShowItem'
  FunctionsAudioConfig:
    type: object
    required:
    - sourceFileName
    - volume
    - duration
    properties:
      sourceFileName:
        type: string
      volume:
        type: number
        minimum: 0
        maximum: 1
        description: Persisted startup volume
      duration:
        type: integer
        description: Milliseconds; playback duration (may differ from the source file's own detected length,
          see Audio::setTotalDuration)
      audioDevice:
        type: string
        description: Output device identifier on the engine host; empty = global default
  FunctionsVideoConfig:
    type: object
    required:
    - sourceUrl
    - customGeometry
    - zIndex
    - screen
    - fullscreen
    properties:
      sourceUrl:
        type: string
      isPicture:
        type: boolean
        description: Read-only, detected from the source
      resolution:
        type: object
        description: Read-only, detected from the source
        properties:
          width:
            type: integer
          height:
            type: integer
      videoCodec:
        type: string
        description: Read-only, detected
      audioCodec:
        type: string
        description: Read-only, detected
      customGeometry:
        type:
        - object
        - 'null'
        properties:
          x:
            type: integer
          y:
            type: integer
          width:
            type: integer
          height:
            type: integer
      rotation:
        type: object
        properties:
          x:
            type: number
          y:
            type: number
          z:
            type: number
      zIndex:
        type: integer
      screen:
        type: integer
      fullscreen:
        type: boolean
  FunctionsRgbMatrixDetail:
    type: object
    required:
    - functionId
    - config
    - docRevision
    properties:
      functionId:
        type: string
      config:
        $ref: '#/components/schemas/FunctionsRgbMatrixConfig'
      docRevision:
        type: integer
  FunctionsScriptDetail:
    type: object
    required:
    - functionId
    - source
    - docRevision
    properties:
      functionId:
        type: string
      source:
        type: string
        description: Full raw script text (Script::data())
      docRevision:
        type: integer
  FunctionsShowDetail:
    type: object
    required:
    - functionId
    - timeDivisionType
    - timeDivisionBPM
    - tracks
    - docRevision
    properties:
      functionId:
        type: string
      timeDivisionType:
        $ref: '#/components/schemas/FunctionsShowTimeDivision'
      timeDivisionBPM:
        type: integer
      tracks:
        type: array
        items:
          $ref: '#/components/schemas/FunctionsShowTrack'
      docRevision:
        type: integer
  FunctionsAudioDetail:
    type: object
    required:
    - functionId
    - config
    - docRevision
    properties:
      functionId:
        type: string
      config:
        $ref: '#/components/schemas/FunctionsAudioConfig'
      docRevision:
        type: integer
  FunctionsVideoDetail:
    type: object
    required:
    - functionId
    - config
    - docRevision
    properties:
      functionId:
        type: string
      config:
        $ref: '#/components/schemas/FunctionsVideoConfig'
      docRevision:
        type: integer
