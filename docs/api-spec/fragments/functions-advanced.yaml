messages:
  FunctionsRgbMatrixListAlgorithmsRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.rgbmatrix.listAlgorithms
        params:
          type: object
          description: No parameters. The algorithm catalog (built-ins + installed RGBScripts) is global,
            not per-function.
  FunctionsRgbMatrixListAlgorithmsResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsRgbMatrixListAlgorithmsOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsRgbMatrixListAlgorithmsOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - algorithms
          properties:
            algorithms:
              type: array
              items:
                type: object
                required:
                - name
                - type
                properties:
                  name:
                    type: string
                    description: Algorithm/script display name, e.g. 'Plain', 'Text', 'Balls'. Pass as
                      algorithm.scriptName when type=script.
                  type:
                    $ref: '#/components/schemas/FunctionsRgbMatrixAlgorithmType'
                  apiVersion:
                    type: integer
                    description: Script API version (type=script only)
                  author:
                    type: string
                    description: Script author (type=script only)
                  acceptedColors:
                    type: integer
                    minimum: 0
                    maximum: 5
                    description: RGBAlgorithm::acceptColors() - how many of FunctionsRgbMatrixConfig.colors'
                      5 slots this algorithm actually uses. 0 = none (it generates its own colors), 1
                      = only Color1/slot 0, 2 = Color1 and Color2/slots 0-1, up to 5 (apiVersion >= 3
                      scripts such as Plasma declare acceptColors = 5, and may even change it at run
                      time from one of their own properties). Drives the real editor's dynamic
                      color-slot count - a client showing all 5 slots regardless of this value will
                      offer slots the algorithm silently ignores. The same value is repeated live on
                      FunctionsRgbMatrixAlgorithm.acceptedColors for the loaded algorithm.
  FunctionsRgbMatrixGetScriptPropertiesRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.rgbmatrix.getScriptProperties
        params:
          type: object
          required:
          - scriptName
          properties:
            scriptName:
              type: string
              description: A name returned by functions.rgbmatrix.listAlgorithms with type=script
  FunctionsRgbMatrixGetScriptPropertiesResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsRgbMatrixGetScriptPropertiesOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsRgbMatrixGetScriptPropertiesOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - properties
          properties:
            properties:
              type: array
              description: UI-editable properties this script exposes (RGBScriptProperty). Values themselves
                live per-function in FunctionsRgbMatrixConfig.algorithm.scriptProperties.
              items:
                $ref: '#/components/schemas/FunctionsRgbMatrixScriptPropertyDef'
  FunctionsRgbMatrixGetPreviewRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.rgbmatrix.getPreview
        params:
          type: object
          required:
          - functionId
          - step
          properties:
            functionId:
              type: string
            step:
              type: integer
              description: Step index to render, 0-based, modulo the algorithm's stepsCount (see result.stepsCount)
  FunctionsRgbMatrixGetPreviewResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsRgbMatrixGetPreviewOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsRgbMatrixGetPreviewOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - stepsCount
          - width
          - height
          - pixels
          properties:
            stepsCount:
              type: integer
              description: Total steps the current algorithm produces at the bound Fixture Group's size.
                0 when the function has no (valid) Fixture Group - pixels is then empty.
            step:
              type: integer
              description: The step actually rendered - params.step normalised into 0..stepsCount-1
                (negative values wrap too), so a client animating by polling can keep its own counter
                free-running.
            width:
              type: integer
              description: Fixture Group matrix width
            height:
              type: integer
              description: Fixture Group matrix height
            pixels:
              type: array
              description: height rows x width columns of packed 0xRRGGBB colors (0 = off/black)
              items:
                type: array
                items:
                  type: integer
  FunctionsRgbMatrixSetConfigRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.rgbmatrix.setConfig
        params:
          type: object
          required:
          - functionId
          - config
          - baseRevision
          properties:
            functionId:
              type: string
            config:
              $ref: '#/components/schemas/FunctionsRgbMatrixConfig'
              description: May be partial - every key absent from config (and, inside algorithm, every
                parameter absent) is left unchanged, so a client can send one field per control.
                A full config is of course valid too. Applied in the order fixture group -> algorithm
                -> algorithm parameters/script properties -> colors -> modes, so a script's own colour
                read-back (RGBMatrix::setAlgorithm/setProperty) never clobbers the requested colors.
                Nothing is applied if any part fails validation (unknown script/group, bad color
                string or enum value).
            baseRevision:
              type: integer
  FunctionsRgbMatrixSetConfigResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsRgbMatrixSetConfigOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsRgbMatrixSetConfigOkResponse:
    payload:
