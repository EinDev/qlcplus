  FunctionsScriptValidateRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: functions.script.validate
        params:
          type: object
          required:
          - functionId
          properties:
            functionId:
              type: string
  FunctionsScriptValidateResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/FunctionsScriptValidateOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  FunctionsScriptValidateOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - syntaxErrorLines
          - syntaxErrors
          - functionRefs
          - fixtureRefs
          properties:
            syntaxErrorLines:
              type: array
              items:
                type: integer
              description: '1-based line numbers that failed to parse, counted over the full raw source
                text (Script::setData) INCLUDING blank lines - i.e. usable directly as a 1-based index
                into functions.script.setSource''s source split on newlines. This is a DIFFERENT numbering
                space from functionRefs/fixtureRefs''s `line` below - do not mix the two when highlighting
                source lines in an editor. On a qmlui (scriptv4) build the source is evaluated by a QJSEngine
                (ScriptRunner::collectScriptData) and this is the line the JavaScript error was raised on -
                one entry per error, 0 when the engine reported no line.

                '
            syntaxErrors:
              type: array
              description: 'One entry per error, same order as syntaxErrorLines, with the engine''s message
                (scriptv4: the QJSEngine error text, e.g. "SyntaxError: Expected token `;''"; legacy: the
                tokenizer''s "Unrecognized command" message). Empty when the script is valid.'
              items:
                type: object
                required:
                - line
                - message
                properties:
                  line:
                    type: integer
                  message:
                    type: string
            functionRefs:
              type: array
              description: 'Functions referenced via startfunction. NOTE: despite the name, the engine''s
                Script::functionList() helper this is built from only recognizes the startfunction command
                - stopfunction/waitfunctionstart/waitfunctionstop references are NOT currently reported
                here even though the script language supports them; treat this as a known under-reporting
                gap, not full coverage of every function reference in the script. `line` here is a 0-based
                index into the engine''s blank-line-skipping tokenized line list (Script::m_lines), NOT
                the same numbering as syntaxErrorLines above - a client cannot use the two interchangeably
                to highlight the same source line.

                '
              items:
                type: object
                required:
                - functionId
                - line
                properties:
                  functionId:
                    type: string
                  line:
                    type: integer
            fixtureRefs:
              type: array
              description: 'Fixtures referenced via setfixture / Engine.setFixture. `line` here uses the same
                0-based, blank-skipping tokenized-list numbering as functionRefs.line above - see its note
                on the two distinct line-number spaces in this response. On a qmlui (scriptv4) build the
                engine''s Script::fixtureList() reports ids only, so `line` is omitted there.

                '
              items:
                type: object
                required:
                - fixtureId
                properties:
                  fixtureId:
                    type: string
                  line:
                    type: integer
  FunctionsScriptListCommandsRequest:
    payload:
