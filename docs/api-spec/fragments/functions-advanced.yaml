        id:
          type: string
        method:
          const: functions.show.track.setSolo
        params:
          type: object
          required:
          - showId
          - trackId
          - solo
          - baseRevision
          description: 'Convenience mutation mirroring ShowManager::setTrackSolo - mutes every other track
            in the Show and unmutes this one (solo=true). solo=false is NOT the inverse of solo=true:
            it unmutes EVERY track in the Show (verified against ShowManager::setTrackSolo), not just
            this one - there is no per-track "was this soloed" state to restore, since solo isn''t a
            persisted flag, just sugar over multiple mute changes. A client wanting "restore this show''s
            mute pattern from before I soloed a track" must snapshot each track''s mute state itself
            before calling solo=true.

            '
          properties:
            showId:
              type: string
            trackId:
              type: string
            solo:
              type: boolean
            baseRevision:
              type: integer
