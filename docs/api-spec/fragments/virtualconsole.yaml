messages:
  VcDocRevisionOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - docRevision
          properties:
            docRevision:
              type: integer
  VcPageListRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.page.list
        params:
          type: object
  VcPageListResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcPageListOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcPageListOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - pages
          - selectedPage
          properties:
            pages:
              type: array
              items:
                $ref: '#/components/schemas/VcPage'
            selectedPage:
              type: integer
              description: Live/runtime - see vc.page.select.
  VcPageCreateRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.page.create
        params:
          type: object
          required:
          - index
          - baseRevision
          properties:
            index:
              type: integer
              description: VirtualConsole::addPage() - insertion index; the new page's caption defaults
                to "Page N".
            baseRevision:
              type: integer
  VcPageCreateResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcDocRevisionOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcPageCreatedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: vc.page.created
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - page
          - docRevision
          properties:
            page:
              $ref: '#/components/schemas/VcPage'
            docRevision:
              type: integer
  VcPageDeleteRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.page.delete
        params:
          type: object
          required:
          - index
          - baseRevision
          description: VirtualConsole::deletePage() - also recursively deletes every widget on the page.
          properties:
            index:
              type: integer
            baseRevision:
              type: integer
  VcPageDeleteResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcDocRevisionOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcPageDeletedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: vc.page.deleted
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - index
          - deletedWidgetIds
          - docRevision
          properties:
            index:
              type: integer
            deletedWidgetIds:
              type: array
              items:
                type: string
            docRevision:
              type: integer
  VcPageRenameRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.page.rename
        params:
          type: object
          required:
          - index
          - name
          - baseRevision
          description: A VCPage's name is its inherited VCWidget caption.
          properties:
            index:
              type: integer
            name:
              type: string
            baseRevision:
              type: integer
  VcPageRenameResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcDocRevisionOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcPageRenamedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: vc.page.renamed
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - index
          - name
          - docRevision
          properties:
            index:
              type: integer
            name:
              type: string
            docRevision:
              type: integer
  VcPageSetPinRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.page.setPin
        params:
          type: object
          required:
          - index
          - baseRevision
          description: 'VirtualConsole::setPagePIN(). currentPIN must match the page''s existing PIN (empty
            string if none); newPIN empty clears protection. Mirrors vc.frame.setPin for a nested VCFrame''s
            own PIN - a VCPage IS-A VCFrame (see VCPage : public VCFrame) but page-level PIN is set through
            this dedicated pair for symmetry with VirtualConsole''s own page API.

            '
          properties:
            index:
              type: integer
            currentPIN:
              type: string
              default: ''
            newPIN:
              type: string
              default: ''
            baseRevision:
              type: integer
  VcPageSetPinResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcDocRevisionOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcPageValidatePinRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.page.validatePin
        params:
          type: object
          required:
          - index
          - pin
          description: 'VirtualConsole::validatePagePIN(). Live/session-scoped: a correct PIN unlocks
            the page for this client''s session only (per-connection, not broadcast), matching "remember"
            behaviour in the current UI.

            '
          properties:
            index:
              type: integer
            pin:
              type: string
  VcPageValidatePinResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcPageValidatePinOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcPageValidatePinOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - valid
          properties:
            valid:
              type: boolean
  VcPageSelectRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.page.select
        params:
          type: object
          required:
          - index
          description: 'Live/runtime (§4b) - "which VC page is showing" is explicitly called out as ephemeral
            in 00-conventions.md §4b. Per-client in spirit (each operator''s screen can show a different
            page), but modelled here as a single shared value mirroring VirtualConsole::selectedPage,
            matching today''s single-selection engine model. See notes.md.

            '
          properties:
            index:
              type: integer
  VcPageSelectResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcPageSelectedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: vc.page.selected
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - index
          properties:
            index:
              type: integer
  VcWidgetListRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.widget.list
        params:
          type: object
          description: VirtualConsole::widgetsList().
          properties:
            page:
              type: integer
              description: Optional filter - only widgets on this top-level page.
            parentId:
              type: string
              description: Optional filter - only direct children of this Frame/SoloFrame/Page widget.
            typeFilters:
              type: array
              items:
                $ref: '#/components/schemas/VcWidgetType'
  VcWidgetListResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcWidgetListOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcWidgetListOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - widgets
          properties:
            widgets:
              type: array
              items:
                $ref: '#/components/schemas/VcWidgetSummary'
  VcWidgetGetRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.widget.get
        params:
          type: object
          required:
          - widgetId
          properties:
            widgetId:
              type: string
  VcWidgetGetResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcWidgetGetOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcWidgetGetOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/VcWidgetDetail'
  VcWidgetUsageRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.widget.usage
        params:
          type: object
          required:
          - functionId
          properties:
            functionId:
              type: string
              description: VirtualConsole::usageList() - every widget that references this Function ID
                in some way (attached, controlled, chaser, schedule...).
  VcWidgetUsageResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcWidgetUsageOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcWidgetUsageOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - widgets
          properties:
            widgets:
              type: array
              items:
                $ref: '#/components/schemas/VcWidgetSummary'
  VcWidgetCreateRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.widget.create
        params:
          type: object
          required:
          - widgetType
          - page
          - geometry
          - baseRevision
          description: 'Generic creation for any of the 11 widget types. $parentId is the containing Frame/SoloFrame
            widget ID, or absent to place the widget directly on the page''s root. $typeConfig''s shape
            depends on $widgetType - see the Vc<Type>Config schemas (VcButtonConfig, VcSliderConfig, VcXyPadConfig,
            VcFrameConfig, VcSoloFrameConfig, VcClockConfig, VcCueListConfig, VcSpeedDialConfig, VcAnimationConfig,
            VcAudioTriggersConfig; VCLabel has no type-specific config). Omit $typeConfig for engine defaults.

            '
          properties:
            widgetType:
              $ref: '#/components/schemas/VcWidgetType'
            page:
              type: integer
            parentId:
              type: string
            geometry:
              $ref: '#/components/schemas/VcGeometry'
            style:
              $ref: '#/components/schemas/VcWidgetStyle'
            typeConfig:
              type: object
            baseRevision:
              type: integer
  VcWidgetCreateResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcWidgetCreateOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcWidgetCreateOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - docRevision
          - widgetId
          properties:
            docRevision:
              type: integer
            widgetId:
              type: string
  VcWidgetCreatedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      description: Broadcast after vc.widget.create only. The bulk creators, vc.widget.createMatrix
        and vc.widget.createFromFunctions, broadcast on vc.widget.bulkUpdated instead (see
        VcWidgetsBulkUpdatedEvent) - a client must listen on both topics to observe every new widget.
      properties:
        type:
          const: event
        topic:
          const: vc.widget.created
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - widget
          - docRevision
          properties:
            widget:
              $ref: '#/components/schemas/VcWidgetDetail'
            docRevision:
              type: integer
  VcWidgetCreateMatrixRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.widget.createMatrix
        params:
          type: object
          required:
          - page
          - matrixType
          - position
          - matrixSize
          - widgetSize
          - baseRevision
          description: VCFrame::addWidgetMatrix() - bulk-creates a grid of identical widgets, optionally
            wrapped in a container Frame/SoloFrame. $parentId is the containing Frame/SoloFrame widget
            ID, or absent to place the matrix directly on $page's root - mirrors vc.widget.create's
            handling of the same case (VCPage IS-A VCFrame, so the server resolves "page N's root" to
            that page's own VCFrame internally). $page is required even when $parentId is given, since
            it is otherwise the only way to reach the root of an empty page (there is no message that
            exposes a page-root widget ID to pass as $parentId instead).
          properties:
            parentId:
              type: string
            page:
              type: integer
            matrixType:
              type: string
              enum:
              - Button
              - Slider
              description: Only these two widget types are supported by the engine (VCFrame::addWidgetMatrix()
                creates Button widgets for "buttonmatrix" and Slider widgets for anything else) - NOT the
                full VcWidgetType enum used elsewhere in this fragment. A server implementing this literally
                treats every other value as a slider matrix, so validate client-side against exactly these
                two.
            position:
              type: object
              required:
              - x
              - y
              properties:
                x:
                  type: integer
                y:
                  type: integer
            matrixSize:
              type: object
              required:
              - columns
              - rows
              properties:
                columns:
                  type: integer
                rows:
                  type: integer
            widgetSize:
              type: object
              required:
              - width
              - height
              properties:
                width:
                  type: integer
                height:
                  type: integer
            soloFrame:
              type: boolean
              default: false
              description: Wrap the matrix in a VCSoloFrame instead of a plain VCFrame.
            baseRevision:
              type: integer
  VcWidgetCreateMatrixResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcWidgetCreateMatrixOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcWidgetCreateMatrixOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - docRevision
          - widgetIds
          properties:
            docRevision:
              type: integer
            widgetIds:
              type: array
              items:
                type: string
  VcWidgetCreateFromFunctionsRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.widget.createFromFunctions
        params:
          type: object
          required:
          - page
          - functionIds
          - position
          - widgetHint
          - baseRevision
          description: 'VCFrame::addFunctions() - the "drop Functions from the Function Manager onto the
            VC" gesture. $widgetHint mirrors the drag''s keyModifiers: "button" creates one VCButton per
            Function; "adjustSlider" creates one VCSlider per Function in Adjust mode controlling Intensity;
            "cueList" creates a single VCCueList (only valid when every functionId is a Chaser). $parentId
            is the containing Frame/SoloFrame widget ID, or absent to place the result(s) directly on
            $page''s root - mirrors vc.widget.create''s handling of the same case (VCPage IS-A VCFrame,
            resolved server-side from $page). $page is required even when $parentId is given, for the
            same reason as vc.widget.createMatrix above.

            '
          properties:
            parentId:
              type: string
            page:
              type: integer
            functionIds:
              type: array
              items:
                type: string
              minItems: 1
            position:
              type: object
              required:
              - x
              - y
              properties:
                x:
                  type: integer
                y:
                  type: integer
            widgetHint:
              type: string
              enum:
              - button
              - adjustSlider
              - cueList
            baseRevision:
              type: integer
  VcWidgetCreateFromFunctionsResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcWidgetCreateMatrixOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcWidgetUpdateRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.widget.update
        params:
          type: object
          required:
          - widgetId
          - baseRevision
          description: 'Updates any VCWidget base property (geometry/z-order/style/ enable/visibility/page);
            at least one optional field must be present. For type-specific config use vc.widget.setConfig.

            '
          properties:
            widgetId:
              type: string
            geometry:
              $ref: '#/components/schemas/VcGeometry'
            zIndex:
              type: integer
            allowResize:
              type: boolean
            isDisabled:
              type: boolean
              description: 'VCWidget::setDisabled() - persisted (e.g. VCFrame''s "Enable" header button
                state is saved to the show file), so document-state despite also being a common live show-control
                gesture. See notes.md.

                '
            isVisible:
              type: boolean
            page:
              type: integer
              description: Move the widget to a different top-level VC page.
            style:
              $ref: '#/components/schemas/VcWidgetStyle'
            baseRevision:
              type: integer
  VcWidgetUpdateResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcDocRevisionOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcWidgetUpdatedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      description: Broadcast after vc.widget.update and after vc.widget.reparent - reparent moves
        exactly one widget, so it is reported here, NOT on vc.widget.bulkUpdated (which is reserved
        for the genuinely multi-widget operations - align/distribute/bulkStyle - plus the
        vc.widget.createMatrix/createFromFunctions creation events, see VcWidgetsBulkUpdatedEvent).
        Position-only moves within the same parent use vc.widget.repositioned instead, see below.
      properties:
        type:
          const: event
        topic:
          const: vc.widget.updated
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - widget
          - docRevision
          properties:
            widget:
              $ref: '#/components/schemas/VcWidgetDetail'
            docRevision:
              type: integer
  VcWidgetSetConfigRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.widget.setConfig
        params:
          type: object
          required:
          - widgetId
          - config
          - baseRevision
          description: 'Structural (§4a) update of a widget''s type-specific configuration. $config is
            a partial patch merged onto the existing typeConfig; shape depends on the widget''s type -
            see the Vc<Type>Config schemas referenced from vc.widget.create.

            '
          properties:
            widgetId:
              type: string
            config:
              type: object
            baseRevision:
              type: integer
  VcWidgetSetConfigResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcDocRevisionOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcWidgetConfigChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: vc.widget.configChanged
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - widget
          - docRevision
          properties:
            widget:
              $ref: '#/components/schemas/VcWidgetDetail'
            docRevision:
              type: integer
  VcWidgetDeleteRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.widget.delete
        params:
          type: object
          required:
          - widgetIds
          - baseRevision
          description: VirtualConsole::deleteVCWidgets() - bulk. Deleting a Frame/SoloFrame/Page recursively
            deletes its children too.
          properties:
            widgetIds:
              type: array
              items:
                type: string
              minItems: 1
            baseRevision:
              type: integer
  VcWidgetDeleteResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcDocRevisionOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  VcWidgetDeletedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: vc.widget.deleted
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - widgetIds
          - docRevision
          properties:
            widgetIds:
              type: array
              items:
                type: string
            docRevision:
              type: integer
  VcWidgetReparentRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.widget.reparent
        params:
          type: object
          required:
          - widgetId
          - position
          - baseRevision
          description: VirtualConsole::reparentWidget()+moveWidget() - drag a widget into a different
            Frame/SoloFrame (or to page root via absent newParentId), at the given position within the
            new parent.
          properties:
            widgetId:
              type: string
            newParentId:
              type: string
            position:
              type: object
              required:
              - x
              - y
              properties:
                x:
                  type: integer
                y:
                  type: integer
            baseRevision:
              type: integer
  VcWidgetReparentResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/VcDocRevisionOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
