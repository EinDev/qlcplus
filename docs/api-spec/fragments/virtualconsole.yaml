  VcClockScheduleUpdateRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: vc.clock.schedule.update
        params:
          type: object
          required:
          - widgetId
          - index
          - baseRevision
          description: 'VCClockSchedule setters - startTime/stopTime are seconds-since-midnight;
            stopTime=-1 means "no stop time" (run to completion / indefinitely, only cut off by
            weekFlags repeat gating below - see VCClock::checkSchedules()). weekFlags bits 0-6
            (0x7F) are a Mon..Sun day-of-week mask where all-zero means "every day", and bit 7
            (0x80) is a separate repeat flag: 0 = play this schedule once then stop re-triggering
            it until reset, 1 = re-trigger every matching day. Bit 7 is easy to omit by only
            reading/writing bits 0-6 - it is a live engine gate, not just a UI label.

            '
          properties:
            widgetId:
              type: string
            index:
              type: integer
            startTime:
              type: integer
            stopTime:
              type: integer
              description: -1 means no stop time - see the params description above.
            weekFlags:
              type: integer
              description: Mon=bit0..Sun=bit6 day mask (0x7F, all-zero = every day) PLUS bit7 (0x80)
                = repeat flag - see the params description above. Do not treat this as a 7-bit value.
            baseRevision:
              type: integer
