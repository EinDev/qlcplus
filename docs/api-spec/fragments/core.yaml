# "core" domain fragment: project/session lifecycle, undo/redo, engine mode,
# global engine settings, and the generic log/error event stream.
#
# Grounded in: engine/src/doc.h, engine/src/doc.cpp, qmlui/app.h, qmlui/app.cpp,
# qmlui/tardis/tardis.h, qmlui/tardis/tardis.cpp, qmlui/main.cpp,
# engine/src/qlcfile.cpp, engine/src/mastertimer.cpp, webaccess/src/webaccess.cpp.
# See core-notes.md for the reasoning behind every non-obvious choice below.

messages:

  # -----------------------------------------------------------------------
  # Project (Doc) lifecycle
  # -----------------------------------------------------------------------

  CoreProjectNewRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.new }
        params:
          type: object
          description: >
            Discards the current document (unsaved changes are lost) and
            replaces it with a blank, never-saved project. Mirrors
            App::newWorkspace(). Deliberately carries no baseRevision: this
            is a full-document replace, not an incremental structural edit,
            so there is nothing to rebase against (see core-notes.md).
          properties: {}

  CoreProjectNewResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectOpenRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.open }
        params:
          type: object
          required: [source]
          description: >
            Two supported transfer modes, see core-notes.md for the
            assumption behind this split: "path" asks the engine to read a
            .qxw file that already exists on the machine the engine process
            runs on (e.g. a headless-server deployment where the operator
            picks from a server-side project library); "upload" carries the
            whole XML file inline, base64-encoded, for the case where the
            file lives only on the Electron client's machine. Exactly one of
            (path) / (contentBase64) must be supplied, matching the chosen
            source. No baseRevision: this discards the current document
            entirely, same reasoning as core.project.new.
          properties:
            source:
              type: string
              enum: [path, upload]
            path:
              type: string
              description: "Server-local filesystem path to a .qxw file. Required when source=path."
            fileName:
              type: string
              description: "Original file name (with .qxw extension), used for the recent-files list and Save. Required when source=upload."
            contentBase64:
              type: string
              description: "Base64-encoded UTF-8 XML content of the .qxw file. Required when source=upload."

  CoreProjectOpenResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreProjectOpenOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectOpenOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [docRevision]
          properties:
            docRevision: { type: integer }
            warningsHtml:
              type: [string, "null"]
              description: >
                Non-fatal problems found while parsing the file (missing
                fixture definitions, out-of-bounds addresses, missing
                audio/video files, etc. - see Doc::appendToErrorLog() call
                sites). HTML-formatted (as produced by the engine today),
                null if the load was clean. The same lines are also emitted
                individually as core.log warning events, see core-notes.md.

  CoreProjectCloseRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.close }
        params:
          type: object
          description: >
            The engine always has *a* document open (Doc is never null), so
            "close" is defined as: discard the current document and replace
            it with a blank one, exactly like core.project.new. Exposed as
            a distinct method for UI-affordance clarity (a client's "Close
            Project" menu item shouldn't have to call something literally
            named "new"), see core-notes.md.
          properties: {}

  CoreProjectCloseResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectLoadedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.project.loaded }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [reason, project]
          description: >
            Broadcast after core.project.new, core.project.open or
            core.project.close - all three fully replace the document, this
            is the one place clients should refresh all their domain state
            from (fixtures, functions, VC, I/O patches, everything), rather
            than trying to diff against what they had before.
          properties:
            reason:
              type: string
              enum: [new, opened, closed]
            project:
              $ref: '#/components/schemas/CoreProjectMetadata'

  CoreProjectSaveRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.save }
        params:
          type: object
          description: >
            Saves to the file the document was last opened/saved-as from.
            No baseRevision: saving serializes current state to disk, it
            does not mutate document content, so there is nothing to
            conflict with (see core-notes.md §"why save has no baseRevision").
          properties: {}

  CoreProjectSaveResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreProjectSaveOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectSaveOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [docRevision, filePath]
          properties:
            docRevision:
              type: integer
              description: "Unchanged by a save; included for convenience so the client can confirm what was saved."
            filePath: { type: string }

  CoreProjectSaveAsRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.saveAs }
        params:
          type: object
          required: [target]
          description: >
            Mirror of core.project.open's two-mode split. "serverPath"
            writes the file on the engine machine's filesystem at (path)
            and that becomes the project's file for subsequent
            core.project.save calls. "download" does not touch the server
            filesystem at all - it serializes the document and hands the
            bytes back in the response for the Electron client to write
            wherever the user picked via its own native Save dialog; the
            engine's own notion of "current file" is left untouched in this
            case (see core-notes.md).
          properties:
            target:
              type: string
              enum: [serverPath, download]
            path:
              type: string
              description: "Target path on the engine's filesystem. Required when target=serverPath. .qxw is appended if missing."

  CoreProjectSaveAsResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreProjectSaveAsOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectSaveAsOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [docRevision]
          properties:
            docRevision: { type: integer }
            filePath:
              type: [string, "null"]
              description: "Set when target=serverPath, null when target=download."
            fileName:
              type: [string, "null"]
              description: "Set when target=download (suggested file name for the client to save as), null when target=serverPath."
            contentBase64:
              type: [string, "null"]
              description: "Set when target=download: the full .qxw XML content, base64-encoded. Null when target=serverPath."

  CoreProjectSavedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.project.saved }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [docRevision, filePath, fileName]
          description: >
            Broadcast after a successful core.project.save or
            core.project.saveAs with target=serverPath. NOT broadcast for
            saveAs with target=download, since that mode doesn't change the
            engine's own "current file" state (see core-notes.md) - only
            the requester's response carries those bytes.
          properties:
            docRevision:
              type: integer
              description: "Also serves as the client's 'clean' marker: isModified == (docRevision !== docRevisionAtLastSave from CoreProjectMetadata)."
            filePath: { type: string }
            fileName: { type: string }

  CoreProjectGetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.get }
        params:
          type: object
          properties: {}

  CoreProjectGetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreProjectGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectGetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          $ref: '#/components/schemas/CoreProjectMetadata'

  CoreProjectRecentFilesRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.recentFiles }
        params:
          type: object
          properties: {}

  CoreProjectRecentFilesResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreProjectRecentFilesOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectRecentFilesOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [files]
          properties:
            files:
              type: array
              description: "Most-recently-opened first, capped at 10 entries (matches App::MAX_RECENT_FILES)."
              items:
                $ref: '#/components/schemas/CoreRecentFileEntry'

  CoreProjectRecentFilesChangedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.project.recentFilesChanged }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [files]
          description: >
            Broadcast whenever the recent-files list changes (after a
            successful open, or a save/saveAs to a new path). This list is
            global engine/app state persisted outside the document (QSettings,
            not the .qxw file) - it is not part of docRevision.
          properties:
            files:
              type: array
              items:
                $ref: '#/components/schemas/CoreRecentFileEntry'

  # -----------------------------------------------------------------------
  # Engine mode (Doc::Mode - Design / Operate)
  # -----------------------------------------------------------------------

  CoreModeGetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.mode.get }
        params:
          type: object
          properties: {}

  CoreModeGetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreModeGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreModeGetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [design, operate]

  CoreModeSetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.mode.set }
        params:
          type: object
          required: [mode]
          description: >
            Live/runtime state (tier §4b) - Doc::Mode is never written to
            the .qxw file (see core-notes.md), so no baseRevision. Maps
            1:1 to Doc::Mode: design=Doc::Design(0), operate=Doc::Operate(1).
            Switching to "operate" auto-starts the project's startup
            function if one is set (Doc::setMode's real side effect, see
            core-notes.md); switching away from "operate" has no automatic
            side effect - running functions keep running.
          properties:
            mode:
              type: string
              enum: [design, operate]

  CoreModeSetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/GenericAckResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreModeChangedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.mode.changed }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [design, operate]

  # -----------------------------------------------------------------------
  # Beat generator (InputOutputMap::setBeatGeneratorType/setBpmNumber) -
  # §4b live state: no baseRevision, last write wins. Added for the web UI's
  # toolbar BPM/tap button (2026-09-26).
  # -----------------------------------------------------------------------

  CoreBpmGetRequest:
    payload:
      type: object
      required: [type, id, method]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.bpm.get }
        params:
          type: object
          description: No parameters.

  CoreBpmGetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreBpmGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreBpmGetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          $ref: '#/components/schemas/CoreBpmState'

  CoreBpmSetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.bpm.set }
        params:
          type: object
          description: >
            At least one of bpm / generator. bpm > 0 sets the tempo; if the
            generator is currently "disabled" it is switched to "internal"
            first (InputOutputMap::setBpmNumber() is a silent no-op while
            disabled - the same thing picking Internal in the toolbar's beat
            panel does). bpm = 0 disables the generator ("BPM: Off"). While a
            "plugin" or "audio" source owns the tempo, setting bpm is refused
            with INVALID_STATE (details.generator) - send generator:"internal"
            first. generator:"audio" starts the audio input capture, exactly
            like the beat panel's Audio choice.
          properties:
            bpm:
              type: integer
              minimum: 0
              maximum: 1000
              description: 0 = off. Upper bound is the same cap qmlui's tap button applies.
            generator:
              type: string
              enum: [disabled, internal, plugin, audio]

  CoreBpmSetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/GenericAckResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreBpmTapRequest:
    payload:
      type: object
      required: [type, id, method]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.bpm.tap }
        params:
          type: object
          description: >
            Tap tempo, server-timed: the tempo is the mean spacing of the
            last (up to) 4 taps within the current run; a gap of more than
            2 s starts a new run, whose first tap sets no tempo. Applies the
            same generator rules as core.bpm.set (disabled -> internal;
            plugin/audio -> INVALID_STATE). Tap timing is global engine
            state, not per client - as on a physical console.

  CoreBpmTapResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreBpmTapOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreBpmTapOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [bpm, tapCount]
          properties:
            bpm:
              type: integer
              description: The tempo now in effect (unchanged by a run's first tap).
            tapCount:
              type: integer
              description: Taps counted in the current run (1 after a run's first tap).

  CoreBpmChangedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.bpm.changed }
        originClientId: { type: [string, "null"] }
        data:
          $ref: '#/components/schemas/CoreBpmState'
          description: >
            Broadcast (not subscribe-gated) on InputOutputMap::bpmNumberChanged
            and beatGeneratorTypeChanged - a generator switch typically
            produces two of these in a row. originClientId is the requester
            for API-driven changes, null when a plugin/audio source re-derived
            the tempo or the QML UI changed it.

  CoreBeatEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.beat }
        originClientId: { type: "null" }
        data:
          type: object
          required: [bpm]
          properties:
            bpm: { type: integer }
          description: >
            One frame per beat of the active generator (InputOutputMap::beat):
            MasterTimer's ticks for "internal", the source's processed beats
            for "plugin"/"audio"; never fires while disabled. Deliberately NOT
            subscribe-gated despite §5's ~2 Hz rule of thumb: the web UI
            contract has clients simply listen for it, the frame is tiny and
            the rate is bounded by the 1000 BPM cap.

  # -----------------------------------------------------------------------
  # Undo / Redo (Tardis)
  # -----------------------------------------------------------------------

  CoreHistoryGetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.history.get }
        params:
          type: object
          description: >
            Reports the shared undo/redo stack's state (one Tardis instance
            for the whole engine, not per client - see core-notes.md for what
            that means for multi-client undo). Reset to empty by
            core.project.new/open/close (Tardis::resetHistory(), called
            from App::clearDocument()). UNSUPPORTED when the server runs
            without a qmlui host (no undo engine at all).
          properties:
            limit:
              type: integer
              description: "Reserved. Tardis exposes only the next undo/redo step, not the stack, so entries is currently always empty and limit is ignored."

  CoreHistoryGetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreHistoryGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreHistoryGetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [entries, canUndo, canRedo, docRevision]
          properties:
            entries:
              type: array
              description: Currently always empty (see params.limit); kept for a future Tardis history accessor.
              items:
                $ref: '#/components/schemas/CoreHistoryEntry'
            canUndo: { type: boolean }
            canRedo: { type: boolean }
            undoText:
              type: string
              description: Tardis action name of the next undo step (e.g. "FunctionSetName"); present only when canUndo.
            redoText:
              type: string
              description: Tardis action name of the next redo step; present only when canRedo.
            docRevision: { type: integer }

  CoreUndoRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.undo }
        params:
          type: object
          description: >
            Undoes the last (or last N) recorded action batch(es), global
            to the engine regardless of which client originally made the
            change - see core-notes.md, "what undo means with multiple
            clients", for the reasoning and tradeoff. No baseRevision: you
            are asking "undo whatever is on top of the stack right now",
            not applying a diff against a known base. Two implementation
            limits (core-notes.md, "Undo/redo as implemented"): only edits
            made through the qmlui UI are recorded - this API's own
            structural methods bypass Tardis and are not undoable - and an
            undo re-invokes engine setters directly, so no domain change
            event describes what changed; refetch on the docRevision bump.
            UNSUPPORTED without a qmlui host.
          properties:
            steps:
              type: integer
              minimum: 1
              default: 1
              description: "Number of action batches to undo (Tardis groups actions fired within 150ms of each other into one undo step)."

  CoreUndoResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreUndoRedoOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreRedoRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.redo }
        params:
          type: object
          properties:
            steps:
              type: integer
              minimum: 1
              default: 1

  CoreRedoResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreUndoRedoOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreHistoryChangedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.history.changed }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [docRevision, canUndo, canRedo]
          description: >
            Broadcast (originClientId null) whenever the history stack's
            shape changed: an action was recorded by the qmlui UI, undone,
            redone, or the history was reset - coalesced over 50 ms since a
            drag records dozens of actions. This is a meta notification for
            the stack itself (docRevision + undo/redo availability) - it
            deliberately does NOT describe what changed. Note that, unlike
            the original assumption here, the affected domain's own change
            event does NOT fire for an undo/redo today: controlapi domains
            broadcast from their request handlers, not from engine signals,
            and Tardis re-invokes engine setters directly. Treat a
            docRevision bump as "refetch".
          properties:
            docRevision: { type: integer }
            canUndo: { type: boolean }
            canRedo: { type: boolean }
            undoText:
              type: string
              description: Present only when canUndo (see CoreHistoryGetOkResponse).
            redoText:
              type: string
              description: Present only when canRedo.

  # -----------------------------------------------------------------------
  # General engine-level settings (not per-project)
  # -----------------------------------------------------------------------

  CoreSettingsGetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.settings.get }
        params:
          type: object
          properties: {}

  CoreSettingsGetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreSettingsGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreSettingsGetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          $ref: '#/components/schemas/CoreSettings'

  CoreSettingsSetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.settings.set }
        params:
          type: object
          minProperties: 1
          description: >
            Partial update - only include the fields being changed.
            Persisted immediately (QSettings-backed, same as today); see
            core-notes.md for which of these apply live vs. only after the
            engine process restarts (masterTimerFrequencyHz is read once at
            MasterTimer construction today).
          properties:
            locale:
              type: [string, "null"]
              description: "e.g. \"en_US\", \"de_DE\". Governs only the language of engine-generated log/error strings (Doc::appendToErrorLog, qWarning/qDebug tr() text) - NOT client UI chrome, see core-notes.md exclusions."
            defaultWorkingPath:
              type: [string, "null"]
              description: "Default directory the engine uses to resolve/browse relative file operations (project files, imports, fixture resources). Maps to App::workingPath / SETTINGS_WORKINGPATH."
            masterTimerFrequencyHz:
              type: integer
              description: "DMX/function output tick rate. Maps to MasterTimer's MASTERTIMER_FREQUENCY QSetting. Takes effect on next engine start, not live (see core-notes.md)."

  CoreSettingsSetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreSettingsSetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreSettingsSetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          $ref: '#/components/schemas/CoreSettings'

  CoreSettingsChangedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.settings.changed }
        originClientId: { type: [string, "null"] }
        data:
          $ref: '#/components/schemas/CoreSettings'

  # -----------------------------------------------------------------------
  # Log / error event stream
  # -----------------------------------------------------------------------

  CoreLogEvent:
    payload:
      type: object
      required: [type, topic, data]
      description: >
        Structured equivalent of QLC+'s own message handler (see
        qmlui/main.cpp's qInstallMessageHandler, only installed today under
        -d). The server is expected to install a process-wide Qt message
        handler and republish every qDebug/qWarning/qCritical/qFatal call
        engine-wide through this event, so an Electron UI gets an error
        console with parity to what -d currently dumps to stderr - not
        just core-domain messages, this is the generic sink for the whole
        engine process. Subscribe-gated (see core-notes.md): pick the
        single "core.log" topic for a firehose, or one of the per-level
        topics to filter volume.
      properties:
        type: { const: event }
        topic:
          type: string
          enum: [core.log, core.log.debug, core.log.info, core.log.warning, core.log.critical]
        originClientId:
          type: "null"
          description: "Always null - these originate from engine-internal logging, never from a specific client's request."
        data:
          type: object
          required: [level, message, timestampMs]
          properties:
            level:
              type: string
              enum: [debug, info, warning, critical, fatal]
              description: "fatal messages are also published on the core.log.critical topic (there is no separate core.log.fatal topic, see core-notes.md)."
            message: { type: string }
            timestampMs:
              type: integer
              description: "Wall-clock epoch milliseconds. (Tardis's own internal timestamps are process-uptime-relative, not wall-clock - the server must convert, see core-notes.md.)"
            file:
              type: [string, "null"]
              description: "Source file, from QMessageLogContext, when available."
            line:
              type: [integer, "null"]
            function:
              type: [string, "null"]

  # -----------------------------------------------------------------------
  # Host file system (read-only directory listing for server-side file
  # pickers - the browser equivalent of popup/PopupFolderBrowser.qml).
  # Added 2026-09-27 (web UI media editors slice).
  # -----------------------------------------------------------------------

  CoreFsListRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.fs.list }
        params:
          type: object
          description: >
            Lists one directory on the machine the engine runs on, so a remote
            client can pick audio / video / image / project files for methods
            that take a server-side path (core.project.open, functions.audio.
            setSource, functions.video.setSource, ...). Read-only: nothing is
            created, renamed or deleted. Hidden entries and "."/".." are never
            listed (QDir::NoDotAndDotDot, hidden files excluded like
            qmlui/folderbrowser.cpp). Entries are sorted directories first,
            then case-insensitively by name.
          properties:
            path:
              type: string
              description: >
                Absolute directory path on the engine host, forward or back
                slashes. Empty / omitted lists the roots instead (the user's
                home directory plus every drive on Windows, "/" on Unix) and
                returns no entries. A relative path is INVALID_PARAMS; a path
                that does not exist or is not a directory is NOT_FOUND.
            extensions:
              type: array
              items: { type: string }
              description: >
                Optional glob patterns ("*.mp3", "*.qxw") in the form the
                capability methods report; files not matching any pattern are
                left out, directories are always listed. Omitted or empty =
                every file.
            includeFiles:
              type: boolean
              description: "false lists directories only (a folder picker). Default true."

  CoreFsListResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreFsListOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreFsListOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [path, parent, entries, roots]
          properties:
            path:
              type: string
              description: "The listed directory, normalised (QDir::absolutePath, forward slashes, no trailing slash except a bare drive root like C:/). Empty when the roots were listed."
            parent:
              type: [string, "null"]
              description: "Absolute path of the parent directory, or null at a root (drive root / '/', or when path was empty)."
            entries:
              type: array
              items:
                $ref: '#/components/schemas/CoreFsEntry'
            roots:
              type: array
              description: "Always present so a picker can render a drives/places bar without a second call: home directory first, then the drive roots (QDir::drives()), then the places 'Project' (folder of the loaded project file, only when it has one) and 'Gobos' (the gobo picture folder of the installation, QLCFile::systemDirectory(GOBODIR), only when it exists)."
              items:
                type: object
                required: [name, path]
                properties:
                  name: { type: string, description: "Display name: 'Home', 'C:/', ..." }
                  path: { type: string }

  # -----------------------------------------------------------------------
  # Shared response building blocks
  # -----------------------------------------------------------------------

  CoreDocRevisionOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      description: >
        Shared ok-response for core.project.new and core.project.close:
        both fully replace the document with a blank one and return only
        the new docRevision (full state comes from the paired
        CoreProjectLoadedEvent broadcast, not this response).
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [docRevision]
          properties:
            docRevision:
              type: integer
              description: "Revision of the new blank document (see CoreProjectLoadedEvent for full state)."

  CoreUndoRedoOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      description: >
        Shared ok-response for core.undo and core.redo - identical result
        shape for both directions.
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [ok, docRevision, stepsApplied, direction, canUndo, canRedo]
          properties:
            ok:
              type: boolean
              description: "true if at least one step was applied (stepsApplied > 0); false when there was nothing to undo/redo - still an ok:true envelope, not an error."
            description:
              type: string
              description: "Tardis action name of the (first) step applied, e.g. \"FunctionSetName\"; present only when ok."
            direction:
              type: string
              enum: [undo, redo]
            docRevision:
              type: integer
              description: "Only changes if at least one undone/redone action was structural; unchanged if the affected step(s) were purely live/runtime actions."
            stepsApplied:
              type: integer
              description: "May be less than requested steps if history ran out."
            canUndo: { type: boolean }
            canRedo: { type: boolean }
            undoText:
              type: string
              description: Present only when canUndo.
            redoText:
              type: string
              description: Present only when canRedo.

  CoreProjectSetStartupFunctionRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: core.project.setStartupFunction
        params:
          type: object
          required:
          - baseRevision
          description: 'Doc::setStartupFunction(): the function started when the project enters Operate
            mode (<Workspace Autostart="id"> in the .qxw). Structural (4a). core.project.get carries it
            as startupFunctionId.'
          properties:
            functionId:
              type:
              - string
              - 'null'
              description: null (or omitted) clears it.
            baseRevision:
              type: integer
  CoreProjectSetStartupFunctionResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/CoreProjectSetStartupFunctionOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  CoreProjectSetStartupFunctionOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - docRevision
          properties:
            docRevision:
              type: integer
  CoreProjectStartupFunctionChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: core.project.startupFunctionChanged
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - startupFunctionId
          - docRevision
          properties:
            startupFunctionId:
              type:
              - string
              - 'null'
            docRevision:
              type: integer
  # --- Show Wizard (qmlui/stagewizard) and Import from project (qmlui/importmanager.cpp) ---

  CoreWizardGetOptionsRequest:
    payload:
      type: object
      required: [type, id, method]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.wizard.getOptions }
        params:
          type: object
          description: >
            No fields. Read-only: the catalogues the six Show Wizard steps offer
            (qmlui/qml/stagewizard/WizardStep1..6) plus the project-dependent
            parts (existing fixture groups with detected capabilities, patched
            input controllers).

  CoreWizardGetOptionsResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreWizardGetOptionsOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreWizardGetOptionsOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result: { $ref: '#/components/schemas/CoreWizardOptions' }

  CoreWizardPreviewRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.wizard.preview }
        params:
          type: object
          required: [choices]
          description: >
            Read-only dry run: resolves a choice set the way the wizard would
            (auto-detected roles, show-type effect defaults, suggested stage
            size, availability per effect) and returns what Step 6 "Summary"
            shows. Nothing in the document changes.
          properties:
            choices: { $ref: '#/components/schemas/CoreWizardChoices' }

  CoreWizardPreviewResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreWizardPreviewOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreWizardPreviewOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result: { $ref: '#/components/schemas/CoreWizardPreview' }

  CoreWizardGenerateRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.wizard.generate }
        params:
          type: object
          required: [baseRevision, choices]
          description: >
            Runs StageWizard::generate() for the choice set: creates the new
            fixture groups (+ an "All Groups" aggregate), places fixtures in the
            3D stage when a new group is selected, generates palettes, scenes,
            chasers, EFX, RGB matrices and a Virtual Console multipage frame,
            and maps a patched controller when chosen. Structural (4a). Every
            created resource is announced with its own domain's usual event
            (fixtures.group.created, functions.created, vc.page.created,
            vc.widget.created, palette.created), then core.wizard.generated.
            NOT undoable: API edits bypass qmlui's Tardis (see ApiProjectHost).
          properties:
            baseRevision: { type: integer }
            choices: { $ref: '#/components/schemas/CoreWizardChoices' }

  CoreWizardGenerateResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreWizardGenerateOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreWizardGenerateOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result: { $ref: '#/components/schemas/CoreWizardGenerated' }

  CoreWizardGeneratedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.wizard.generated }
        originClientId: { type: [string, 'null'] }
        data: { $ref: '#/components/schemas/CoreWizardGenerated' }

  CoreProjectImportListRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.importList }
        params:
          allOf:
            - $ref: '#/components/schemas/CoreProjectImportSource'
          description: >
            Read-only: parses another project (.qxw) and lists what the
            "Import from project" popup (PopupImportProject.qml) offers - its
            fixtures (by universe, with linked fixtures), fixture groups,
            palettes and functions (by folder path), each function with its
            direct dependencies so a client can pre-check them the way the
            popup does. Nothing is kept server side: core.project.import takes
            the same source again.

  CoreProjectImportListResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreProjectImportListOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectImportListOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result: { $ref: '#/components/schemas/CoreProjectImportContents' }

  CoreProjectImportRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.import }
        params:
          allOf:
            - $ref: '#/components/schemas/CoreProjectImportSource'
            - type: object
              required: [baseRevision]
              properties:
                baseRevision: { type: integer }
                fixtureIds:
                  type: array
                  items: { type: string }
                  description: "Fixture ids in the SOURCE project. A fixture brings its linked-fixture names along."
                fixtureGroupIds:
                  type: array
                  items: { type: string }
                  description: "Fixture group ids in the source project; a group brings its fixtures."
                functionIds:
                  type: array
                  items: { type: string }
                  description: "Function ids in the source project; each brings its dependencies (fixtures, groups, palettes, functions) - the closure is always computed server side."
          description: >
            Structural (4a). ImportManager::apply(): fixtures whose name already
            exists in this project are matched (not duplicated) and their id
            remapped; new ones are patched at the first free address from their
            original universe/address on; groups and palettes are matched by
            name the same way; every function is copied with a NEW id, in
            dependency order, and its references (scene values, groups,
            palettes, chaser steps, collection members, sequence bound scene,
            EFX heads, RGB matrix group) are rewritten to the new ids;
            Audio/Video sources are copied into this project's media store.
            Announced with fixtures.patched, fixtures.group.created,
            functions.created (and palette.created), then core.project.imported.

  CoreProjectImportResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreProjectImportOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectImportOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result: { $ref: '#/components/schemas/CoreProjectImported' }

  CoreProjectImportedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.project.imported }
        originClientId: { type: [string, 'null'] }
        data: { $ref: '#/components/schemas/CoreProjectImported' }

schemas:

  CoreBpmState:
    type: object
    required: [bpm, generator]
    description: >
      InputOutputMap's beat generator state (core.bpm.get result and
      core.bpm.changed data). No beatsPerBar: the engine has no bar concept
      at generator level (only Show has a per-show beatsDivision), so the web
      UI contract's optional field is simply absent.
    properties:
      bpm:
        type: integer
        description: InputOutputMap::bpmNumber() - 0 while the generator is disabled (or a plugin/audio source hasn't detected a tempo yet).
      generator:
        type: string
        enum: [disabled, internal, plugin, audio]
        description: InputOutputMap::BeatGeneratorType, lower-case (NOT the capitalized .qxw persistence spelling).

  CoreProjectMetadata:
    type: object
    required: [filePath, fileName, isModified, docRevision, docRevisionAtLastSave, creator]
    properties:
      filePath:
        type: [string, "null"]
        description: "Full path on the engine's filesystem. Null for a never-saved project, or one opened via source=upload that hasn't been saved yet."
      fileName:
        type: [string, "null"]
        description: "Basename of filePath, for display. Null under the same conditions as filePath."
      isModified:
        type: boolean
        description: "Mirrors Doc::isModified()."
      docRevision:
        type: integer
      docRevisionAtLastSave:
        type: [integer, "null"]
        description: "docRevision at the moment of the last successful save (or saveAs with target=serverPath) this session. Null if never saved this session. Equivalent way to derive isModified: docRevision !== docRevisionAtLastSave."
      startupFunctionId:
        type: [string, "null"]
        description: "Additive (2026-09-27). The autostart function (Doc::startupFunction()), started when the project enters Operate mode; null when unset. Set with core.project.setStartupFunction."
      creator:
        type: [object, "null"]
        description: >
          Informational only, read-only via this API - the engine has no
          concept of an editable project title/author/notes field (see
          core-notes.md, "what Doc actually tracks"). Null for a brand-new
          unsaved project. Reflects the <Creator> block of the last
          loaded/saved file; QLC+ currently always rewrites author to the
          OS user name at save time regardless of what was loaded, this API
          surfaces that behavior as-is rather than inventing a settable field.
        properties:
          name: { type: [string, "null"] }
          version: { type: [string, "null"] }
          author: { type: [string, "null"] }

  CoreRecentFileEntry:
    type: object
    required: [filePath, fileName]
    properties:
      filePath: { type: string }
      fileName: { type: string }

  CoreHistoryEntry:
    type: object
    required: [index, actionCode, actionName, tier, timestampMs]
    properties:
      index:
        type: integer
        description: "Position in the history stack, 0-based."
      actionCode:
        type: integer
        description: "Raw Tardis::ActionCodes value."
      actionName:
        type: string
        description: "Symbolic name, e.g. \"FunctionSetName\", \"VCWidgetGeometry\" (Tardis::actionToString())."
      tier:
        type: string
        enum: [structural, live]
        description: "structural = actionCode < 0xF000 (LIVE_ACTIONS_START_CODE), i.e. it bumps docRevision/isModified. live = a runtime action (fader move, button press, function start/stop, ...) - see core-notes.md for why the shared undo stack mixes both."
      timestampMs:
        type: integer
        description: "Wall-clock epoch milliseconds (converted from Tardis's internal process-uptime-relative timestamp, see core-notes.md)."

  CoreSettings:
    type: object
    required: [locale, defaultWorkingPath, masterTimerFrequencyHz]
    properties:
      locale:
        type: [string, "null"]
      defaultWorkingPath:
        type: [string, "null"]
      masterTimerFrequencyHz:
        type: integer

  CoreFsEntry:
    type: object
    required: [name, path, isDir, size, mtime]
    properties:
      name:
        type: string
        description: "File or directory name without the directory part."
      path:
        type: string
        description: "Absolute path of the entry (forward slashes), ready to be passed back as `path` or to a setSource / open method."
      isDir:
        type: boolean
      size:
        type: integer
        description: "Bytes; 0 for a directory."
      mtime:
        type: integer
        description: "Last modification time, epoch milliseconds (UTC); 0 when unknown."

  # --- Show Wizard ---

  CoreWizardShowType:
    type: string
    enum: [ClubNight, Concert, Theatrical, Architectural, Custom]
    description: StageWizard::ShowType. Drives the default stage type and the default effect set.

  CoreWizardRole:
    type: string
    enum: [Key, Fill, Back, Side, Effect, Strip, Blinder, Hazer, Floor]
    description: StageWizard::FixtureRole. Decides 3D placement and which VC widgets a group gets.

  CoreWizardStageType:
    type: string
    enum: [Simple, Box, Rock, Theatre]
    description: MonitorProperties::StageType (Open Space, Box / Club, Rock Stage, Theatre).

  CoreWizardEffect:
    type: string
    enum: [ColorPalette, ColorRainbow, SplitColor, GoboPalette, Shutter, BlinderHit, StrobeChase,
           Heartbeat, PositionPreset, FlyOut, FlyIn, CircleChase, FigureEight, AudienceSweep,
           PixelChase, Wave, Fireworks, Plasma, Marquee, AmbientLoop]
    description: StageWizard::EffectFlag without the "Effect" prefix.

  CoreWizardEnvSize:
    type: object
    required: [width, height, depth]
    description: Stage size in whole metres. Clamped server side to width/depth 2..100, height 2..30.
    properties:
      width: { type: number }
      height: { type: number }
      depth: { type: number }

  CoreWizardCapabilities:
    type: object
    description: StageWizard::detectGroupCapabilities() over the group's fixtures.
    properties:
      hasMovement: { type: boolean, description: "Pan and Tilt" }
      hasRGB: { type: boolean, description: "RGB or CMY colour mixing" }
      hasColorWheel: { type: boolean }
      hasGobo: { type: boolean }
      hasShutter: { type: boolean }
      hasDimmer: { type: boolean }

  CoreWizardController:
    type: object
    description: "A universe with an input patch (StageWizard::controllersModel())."
    properties:
      universe: { type: integer, description: "0-based universe index" }
      universeName: { type: string }
      plugin: { type: string }
      line: { type: integer }
      lineName: { type: string }
      profile: { type: string }
      hasProfile: { type: boolean }
      buttons: { type: integer }
      faders: { type: integer }
      hasColorTable: { type: boolean }
      feedback: { type: boolean }

  CoreWizardOptions:
    type: object
    required: [showTypes, roles, stageTypes, effects, groups, controllers, envSize]
    properties:
      showTypes:
        type: array
        description: Step 1 cards (WizardStep1ShowType.qml).
        items:
          type: object
          properties:
            id: { $ref: '#/components/schemas/CoreWizardShowType' }
            name: { type: string }
            description: { type: string }
            stage: { type: string, description: "Venue the type suggests" }
            stageType: { $ref: '#/components/schemas/CoreWizardStageType' }
            tags: { type: array, items: { type: string } }
      roles:
        type: array
        description: Step 2 role picker + Step 3 placement blurbs.
        items:
          type: object
          properties:
            id: { $ref: '#/components/schemas/CoreWizardRole' }
            name: { type: string }
            placement: { type: string }
      stageTypes:
        type: array
        description: Step 3 venue cards (WizardStep3Venue.qml).
        items:
          type: object
          properties:
            id: { $ref: '#/components/schemas/CoreWizardStageType' }
            name: { type: string }
            description: { type: string }
            bestFor: { type: array, items: { type: string } }
      effects:
        type: array
        description: Step 4 catalogue in display order (availability depends on the groups, see core.wizard.preview).
        items:
          type: object
          properties:
            id: { $ref: '#/components/schemas/CoreWizardEffect' }
            name: { type: string }
            family: { type: string, enum: [Color, Intensity, Movement, Matrix, Show Cues] }
      groups:
        type: array
        description: Existing fixture groups of the project (Step 2 loads them as unticked boxes).
        items:
          allOf:
            - $ref: '#/components/schemas/CoreWizardCapabilities'
            - type: object
              properties:
                groupId: { type: string }
                name: { type: string }
                fixtureIds: { type: array, items: { type: string } }
                suggestedRole: { $ref: '#/components/schemas/CoreWizardRole' }
      controllers:
        type: array
        items: { $ref: '#/components/schemas/CoreWizardController' }
      envSize: { $ref: '#/components/schemas/CoreWizardEnvSize' }

  CoreWizardChoices:
    type: object
    required: [showType, groups]
    description: >
      Everything the operator picks across the six steps. Omitted optional
      fields take the wizard's own defaults, exactly as when the operator
      clicks Next without touching a step.
    properties:
      showType: { $ref: '#/components/schemas/CoreWizardShowType' }
      groups:
        type: array
        minItems: 1
        description: >
          The ticked group boxes. An entry with groupId selects an EXISTING
          group (its membership and grid are left untouched on generate); an
          entry without groupId is a NEW group the wizard creates (and places
          on stage). At least one group must end up with fixtures.
        items:
          type: object
          properties:
            groupId: { type: string, description: "Existing fixture group id; omit for a new group" }
            name: { type: string, description: "Required for a new group" }
            fixtureIds:
              type: array
              items: { type: string }
              description: "Required for a new group. A fixture belongs to one box only (last one wins)."
            role: { $ref: '#/components/schemas/CoreWizardRole' }
      stageType: { $ref: '#/components/schemas/CoreWizardStageType' }
      envSize: { $ref: '#/components/schemas/CoreWizardEnvSize' }
      effects:
        type: array
        items: { $ref: '#/components/schemas/CoreWizardEffect' }
        description: "Enabled effects. Omitted = the show type's defaults. Unavailable effects are ignored."
      controller:
        type: object
        properties:
          universe: { type: [integer, 'null'], description: "Patched input universe (0-based); null/-1 = no controller" }
          map: { type: boolean, default: true }
          feedback: { type: boolean, default: true }
          colors: { type: boolean, default: true }

  CoreWizardPreview:
    type: object
    required: [showType, groups, placesFixtures, stageType, envSize, effects, controller, summary]
    properties:
      showType: { $ref: '#/components/schemas/CoreWizardShowType' }
      groups:
        type: array
        description: The resolved ticked groups (Step 2 column 3 / StageWizard::fixtureRoleModel()).
        items:
          allOf:
            - $ref: '#/components/schemas/CoreWizardCapabilities'
            - type: object
              properties:
                groupId: { type: [string, 'null'] }
                name: { type: string }
                fixtureIds: { type: array, items: { type: string } }
                role: { $ref: '#/components/schemas/CoreWizardRole' }
      placesFixtures:
        type: boolean
        description: "StageWizard::hasNewGroups(): false = the Venue step is skipped and generation leaves stage and positions alone."
      stageType: { $ref: '#/components/schemas/CoreWizardStageType' }
      envSize: { $ref: '#/components/schemas/CoreWizardEnvSize' }
      effects:
        type: array
        items:
          type: object
          properties:
            id: { $ref: '#/components/schemas/CoreWizardEffect' }
            name: { type: string }
            family: { type: string }
            enabled: { type: boolean }
            available: { type: boolean }
            preview: { type: string, description: "StageWizard::effectPreview(), e.g. \"3 chaser(s)\"" }
      controller:
        type: object
        properties:
          universe: { type: integer, description: "-1 = none" }
          map: { type: boolean }
          feedback: { type: boolean }
          colors: { type: boolean }
          mappingPreview: { type: string }
      summary:
        type: array
        description: StageWizard::summaryModel().
        items:
          type: object
          properties:
            section: { type: string }
            detail: { type: string }

  CoreWizardGenerated:
    type: object
    required: [docRevision]
    properties:
      docRevision: { type: integer }
      fixtureGroupIds: { type: array, items: { type: string } }
      functionIds: { type: array, items: { type: string } }
      paletteIds: { type: array, items: { type: string } }
      vcPageIndexes: { type: array, items: { type: integer }, description: "Pages created" }
      vcWidgetIds: { type: array, items: { type: string }, description: "Every widget created (nested ones included)" }

  # --- Import from project ---

  CoreProjectImportSource:
    type: object
    required: [source]
    description: Same transfer modes as core.project.open.
    properties:
      source: { type: string, enum: [path, upload] }
      path: { type: string, description: "Server-local .qxw path. Required when source=path." }
      fileName: { type: string, description: "Original file name, informational. source=upload." }
      contentBase64: { type: string, description: "Base64 UTF-8 XML of the .qxw. Required when source=upload." }

  CoreProjectImportContents:
    type: object
    required: [universes, fixtures, fixtureGroups, palettes, functions]
    properties:
      universes:
        type: array
        items:
          type: object
          properties:
            universe: { type: integer, description: "0-based" }
            name: { type: string }
      fixtures:
        type: array
        items:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            universe: { type: integer, description: "0-based" }
            address: { type: integer, description: "0-based" }
            channels: { type: integer }
            manufacturer: { type: string }
            model: { type: string }
            mode: { type: string }
            existsInProject:
              type: boolean
              description: "A fixture with the same name exists here: it will be matched, not created."
            linked:
              type: array
              description: Linked fixtures (monitor-only duplicates) named in the 3D view.
              items:
                type: object
                properties:
                  headIndex: { type: integer }
                  linkedIndex: { type: integer }
                  name: { type: string }
      fixtureGroups:
        type: array
        items:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            fixtureIds: { type: array, items: { type: string } }
      palettes:
        type: array
        items:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            type: { type: string }
      functions:
        type: array
        description: Visible functions only (hidden helpers such as a Sequence's bound scene come along as dependencies).
        items:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            type: { type: string }
            path: { type: string, description: "Folder path, '/'-separated, empty at the root" }
            dependencies:
              type: object
              description: "Everything checking this function would pull in (full closure)."
              properties:
                fixtureIds: { type: array, items: { type: string } }
                fixtureGroupIds: { type: array, items: { type: string } }
                paletteIds: { type: array, items: { type: string } }
                functionIds: { type: array, items: { type: string } }

  CoreProjectImported:
    type: object
    required: [docRevision, fixtureIdMap, fixtureGroupIdMap, paletteIdMap, functionIdMap]
    description: Source id -> id in this project, per resource kind.
    properties:
      docRevision: { type: integer }
      fixtureIdMap: { type: object, additionalProperties: { type: string } }
      fixtureGroupIdMap: { type: object, additionalProperties: { type: string } }
      paletteIdMap: { type: object, additionalProperties: { type: string } }
      functionIdMap: { type: object, additionalProperties: { type: string } }
      createdFixtureIds: { type: array, items: { type: string }, description: "Source ids of the fixtures newly patched (not name-matched); fixtureIdMap gives their new ids" }
      skippedFixtureIds:
        type: array
        items: { type: string }
        description: "Source fixtures that could not be created (definition missing here, or no free address)"

