# "core" domain fragment: project/session lifecycle, undo/redo, engine mode,
# global engine settings, and the generic log/error event stream.
#
# Grounded in: engine/src/doc.h, engine/src/doc.cpp, qmlui/app.h, qmlui/app.cpp,
# qmlui/tardis/tardis.h, qmlui/tardis/tardis.cpp, qmlui/main.cpp,
# engine/src/qlcfile.cpp, engine/src/mastertimer.cpp, webaccess/src/webaccess.cpp.
# See core-notes.md for the reasoning behind every non-obvious choice below.

messages:

  # -----------------------------------------------------------------------
  # Project (Doc) lifecycle
  # -----------------------------------------------------------------------

  CoreProjectNewRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.new }
        params:
          type: object
          description: >
            Discards the current document (unsaved changes are lost) and
            replaces it with a blank, never-saved project. Mirrors
            App::newWorkspace(). Deliberately carries no baseRevision: this
            is a full-document replace, not an incremental structural edit,
            so there is nothing to rebase against (see core-notes.md).
          properties: {}

  CoreProjectNewResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectOpenRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.open }
        params:
          type: object
          required: [source]
          description: >
            Two supported transfer modes, see core-notes.md for the
            assumption behind this split: "path" asks the engine to read a
            .qxw file that already exists on the machine the engine process
            runs on (e.g. a headless-server deployment where the operator
            picks from a server-side project library); "upload" carries the
            whole XML file inline, base64-encoded, for the case where the
            file lives only on the Electron client's machine. Exactly one of
            (path) / (contentBase64) must be supplied, matching the chosen
            source. No baseRevision: this discards the current document
            entirely, same reasoning as core.project.new.
          properties:
            source:
              type: string
              enum: [path, upload]
            path:
              type: string
              description: "Server-local filesystem path to a .qxw file. Required when source=path."
            fileName:
              type: string
              description: "Original file name (with .qxw extension), used for the recent-files list and Save. Required when source=upload."
            contentBase64:
              type: string
              description: "Base64-encoded UTF-8 XML content of the .qxw file. Required when source=upload."

  CoreProjectOpenResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreProjectOpenOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectOpenOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [docRevision]
          properties:
            docRevision: { type: integer }
            warningsHtml:
              type: [string, "null"]
              description: >
                Non-fatal problems found while parsing the file (missing
                fixture definitions, out-of-bounds addresses, missing
                audio/video files, etc. - see Doc::appendToErrorLog() call
                sites). HTML-formatted (as produced by the engine today),
                null if the load was clean. The same lines are also emitted
                individually as core.log warning events, see core-notes.md.

  CoreProjectCloseRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.close }
        params:
          type: object
          description: >
            The engine always has *a* document open (Doc is never null), so
            "close" is defined as: discard the current document and replace
            it with a blank one, exactly like core.project.new. Exposed as
            a distinct method for UI-affordance clarity (a client's "Close
            Project" menu item shouldn't have to call something literally
            named "new"), see core-notes.md.
          properties: {}

  CoreProjectCloseResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreDocRevisionOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectLoadedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.project.loaded }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [reason, project]
          description: >
            Broadcast after core.project.new, core.project.open or
            core.project.close - all three fully replace the document, this
            is the one place clients should refresh all their domain state
            from (fixtures, functions, VC, I/O patches, everything), rather
            than trying to diff against what they had before.
          properties:
            reason:
              type: string
              enum: [new, opened, closed]
            project:
              $ref: '#/components/schemas/CoreProjectMetadata'

  CoreProjectSaveRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.save }
        params:
          type: object
          description: >
            Saves to the file the document was last opened/saved-as from.
            No baseRevision: saving serializes current state to disk, it
            does not mutate document content, so there is nothing to
            conflict with (see core-notes.md §"why save has no baseRevision").
          properties: {}

  CoreProjectSaveResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreProjectSaveOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectSaveOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [docRevision, filePath]
          properties:
            docRevision:
              type: integer
              description: "Unchanged by a save; included for convenience so the client can confirm what was saved."
            filePath: { type: string }

  CoreProjectSaveAsRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.saveAs }
        params:
          type: object
          required: [target]
          description: >
            Mirror of core.project.open's two-mode split. "serverPath"
            writes the file on the engine machine's filesystem at (path)
            and that becomes the project's file for subsequent
            core.project.save calls. "download" does not touch the server
            filesystem at all - it serializes the document and hands the
            bytes back in the response for the Electron client to write
            wherever the user picked via its own native Save dialog; the
            engine's own notion of "current file" is left untouched in this
            case (see core-notes.md).
          properties:
            target:
              type: string
              enum: [serverPath, download]
            path:
              type: string
              description: "Target path on the engine's filesystem. Required when target=serverPath. .qxw is appended if missing."

  CoreProjectSaveAsResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreProjectSaveAsOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectSaveAsOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [docRevision]
          properties:
            docRevision: { type: integer }
            filePath:
              type: [string, "null"]
              description: "Set when target=serverPath, null when target=download."
            fileName:
              type: [string, "null"]
              description: "Set when target=download (suggested file name for the client to save as), null when target=serverPath."
            contentBase64:
              type: [string, "null"]
              description: "Set when target=download: the full .qxw XML content, base64-encoded. Null when target=serverPath."

  CoreProjectSavedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.project.saved }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [docRevision, filePath, fileName]
          description: >
            Broadcast after a successful core.project.save or
            core.project.saveAs with target=serverPath. NOT broadcast for
            saveAs with target=download, since that mode doesn't change the
            engine's own "current file" state (see core-notes.md) - only
            the requester's response carries those bytes.
          properties:
            docRevision:
              type: integer
              description: "Also serves as the client's 'clean' marker: isModified == (docRevision !== docRevisionAtLastSave from CoreProjectMetadata)."
            filePath: { type: string }
            fileName: { type: string }

  CoreProjectGetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.get }
        params:
          type: object
          properties: {}

  CoreProjectGetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreProjectGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectGetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          $ref: '#/components/schemas/CoreProjectMetadata'

  CoreProjectRecentFilesRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.project.recentFiles }
        params:
          type: object
          properties: {}

  CoreProjectRecentFilesResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreProjectRecentFilesOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreProjectRecentFilesOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [files]
          properties:
            files:
              type: array
              description: "Most-recently-opened first, capped at 10 entries (matches App::MAX_RECENT_FILES)."
              items:
                $ref: '#/components/schemas/CoreRecentFileEntry'

  CoreProjectRecentFilesChangedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.project.recentFilesChanged }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [files]
          description: >
            Broadcast whenever the recent-files list changes (after a
            successful open, or a save/saveAs to a new path). This list is
            global engine/app state persisted outside the document (QSettings,
            not the .qxw file) - it is not part of docRevision.
          properties:
            files:
              type: array
              items:
                $ref: '#/components/schemas/CoreRecentFileEntry'

  # -----------------------------------------------------------------------
  # Engine mode (Doc::Mode - Design / Operate)
  # -----------------------------------------------------------------------

  CoreModeGetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.mode.get }
        params:
          type: object
          properties: {}

  CoreModeGetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreModeGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreModeGetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [design, operate]

  CoreModeSetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.mode.set }
        params:
          type: object
          required: [mode]
          description: >
            Live/runtime state (tier §4b) - Doc::Mode is never written to
            the .qxw file (see core-notes.md), so no baseRevision. Maps
            1:1 to Doc::Mode: design=Doc::Design(0), operate=Doc::Operate(1).
            Switching to "operate" auto-starts the project's startup
            function if one is set (Doc::setMode's real side effect, see
            core-notes.md); switching away from "operate" has no automatic
            side effect - running functions keep running.
          properties:
            mode:
              type: string
              enum: [design, operate]

  CoreModeSetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/GenericAckResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreModeChangedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.mode.changed }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [design, operate]

  # -----------------------------------------------------------------------
  # Beat generator (InputOutputMap::setBeatGeneratorType/setBpmNumber) -
  # §4b live state: no baseRevision, last write wins. Added for the web UI's
  # toolbar BPM/tap button (2026-09-26).
  # -----------------------------------------------------------------------

  CoreBpmGetRequest:
    payload:
      type: object
      required: [type, id, method]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.bpm.get }
        params:
          type: object
          description: No parameters.

  CoreBpmGetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreBpmGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreBpmGetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          $ref: '#/components/schemas/CoreBpmState'

  CoreBpmSetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.bpm.set }
        params:
          type: object
          description: >
            At least one of bpm / generator. bpm > 0 sets the tempo; if the
            generator is currently "disabled" it is switched to "internal"
            first (InputOutputMap::setBpmNumber() is a silent no-op while
            disabled - the same thing picking Internal in the toolbar's beat
            panel does). bpm = 0 disables the generator ("BPM: Off"). While a
            "plugin" or "audio" source owns the tempo, setting bpm is refused
            with INVALID_STATE (details.generator) - send generator:"internal"
            first. generator:"audio" starts the audio input capture, exactly
            like the beat panel's Audio choice.
          properties:
            bpm:
              type: integer
              minimum: 0
              maximum: 1000
              description: 0 = off. Upper bound is the same cap qmlui's tap button applies.
            generator:
              type: string
              enum: [disabled, internal, plugin, audio]

  CoreBpmSetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/GenericAckResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreBpmTapRequest:
    payload:
      type: object
      required: [type, id, method]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.bpm.tap }
        params:
          type: object
          description: >
            Tap tempo, server-timed: the tempo is the mean spacing of the
            last (up to) 4 taps within the current run; a gap of more than
            2 s starts a new run, whose first tap sets no tempo. Applies the
            same generator rules as core.bpm.set (disabled -> internal;
            plugin/audio -> INVALID_STATE). Tap timing is global engine
            state, not per client - as on a physical console.

  CoreBpmTapResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreBpmTapOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreBpmTapOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [bpm, tapCount]
          properties:
            bpm:
              type: integer
              description: The tempo now in effect (unchanged by a run's first tap).
            tapCount:
              type: integer
              description: Taps counted in the current run (1 after a run's first tap).

  CoreBpmChangedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.bpm.changed }
        originClientId: { type: [string, "null"] }
        data:
          $ref: '#/components/schemas/CoreBpmState'
          description: >
            Broadcast (not subscribe-gated) on InputOutputMap::bpmNumberChanged
            and beatGeneratorTypeChanged - a generator switch typically
            produces two of these in a row. originClientId is the requester
            for API-driven changes, null when a plugin/audio source re-derived
            the tempo or the QML UI changed it.

  CoreBeatEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.beat }
        originClientId: { type: "null" }
        data:
          type: object
          required: [bpm]
          properties:
            bpm: { type: integer }
          description: >
            One frame per beat of the active generator (InputOutputMap::beat):
            MasterTimer's ticks for "internal", the source's processed beats
            for "plugin"/"audio"; never fires while disabled. Deliberately NOT
            subscribe-gated despite §5's ~2 Hz rule of thumb: the web UI
            contract has clients simply listen for it, the frame is tiny and
            the rate is bounded by the 1000 BPM cap.

  # -----------------------------------------------------------------------
  # Undo / Redo (Tardis)
  # -----------------------------------------------------------------------

  CoreHistoryGetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.history.get }
        params:
          type: object
          description: >
            Reports the shared undo/redo stack's state (one Tardis instance
            for the whole engine, not per client - see core-notes.md for what
            that means for multi-client undo). Reset to empty by
            core.project.new/open/close (Tardis::resetHistory(), called
            from App::clearDocument()). UNSUPPORTED when the server runs
            without a qmlui host (no undo engine at all).
          properties:
            limit:
              type: integer
              description: "Reserved. Tardis exposes only the next undo/redo step, not the stack, so entries is currently always empty and limit is ignored."

  CoreHistoryGetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreHistoryGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreHistoryGetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [entries, canUndo, canRedo, docRevision]
          properties:
            entries:
              type: array
              description: Currently always empty (see params.limit); kept for a future Tardis history accessor.
              items:
                $ref: '#/components/schemas/CoreHistoryEntry'
            canUndo: { type: boolean }
            canRedo: { type: boolean }
            undoText:
              type: string
              description: Tardis action name of the next undo step (e.g. "FunctionSetName"); present only when canUndo.
            redoText:
              type: string
              description: Tardis action name of the next redo step; present only when canRedo.
            docRevision: { type: integer }

  CoreUndoRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.undo }
        params:
          type: object
          description: >
            Undoes the last (or last N) recorded action batch(es), global
            to the engine regardless of which client originally made the
            change - see core-notes.md, "what undo means with multiple
            clients", for the reasoning and tradeoff. No baseRevision: you
            are asking "undo whatever is on top of the stack right now",
            not applying a diff against a known base. Two implementation
            limits (core-notes.md, "Undo/redo as implemented"): only edits
            made through the qmlui UI are recorded - this API's own
            structural methods bypass Tardis and are not undoable - and an
            undo re-invokes engine setters directly, so no domain change
            event describes what changed; refetch on the docRevision bump.
            UNSUPPORTED without a qmlui host.
          properties:
            steps:
              type: integer
              minimum: 1
              default: 1
              description: "Number of action batches to undo (Tardis groups actions fired within 150ms of each other into one undo step)."

  CoreUndoResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreUndoRedoOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreRedoRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.redo }
        params:
          type: object
          properties:
            steps:
              type: integer
              minimum: 1
              default: 1

  CoreRedoResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreUndoRedoOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreHistoryChangedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.history.changed }
        originClientId: { type: [string, "null"] }
        data:
          type: object
          required: [docRevision, canUndo, canRedo]
          description: >
            Broadcast (originClientId null) whenever the history stack's
            shape changed: an action was recorded by the qmlui UI, undone,
            redone, or the history was reset - coalesced over 50 ms since a
            drag records dozens of actions. This is a meta notification for
            the stack itself (docRevision + undo/redo availability) - it
            deliberately does NOT describe what changed. Note that, unlike
            the original assumption here, the affected domain's own change
            event does NOT fire for an undo/redo today: controlapi domains
            broadcast from their request handlers, not from engine signals,
            and Tardis re-invokes engine setters directly. Treat a
            docRevision bump as "refetch".
          properties:
            docRevision: { type: integer }
            canUndo: { type: boolean }
            canRedo: { type: boolean }
            undoText:
              type: string
              description: Present only when canUndo (see CoreHistoryGetOkResponse).
            redoText:
              type: string
              description: Present only when canRedo.

  # -----------------------------------------------------------------------
  # General engine-level settings (not per-project)
  # -----------------------------------------------------------------------

  CoreSettingsGetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.settings.get }
        params:
          type: object
          properties: {}

  CoreSettingsGetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreSettingsGetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreSettingsGetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          $ref: '#/components/schemas/CoreSettings'

  CoreSettingsSetRequest:
    payload:
      type: object
      required: [type, id, method, params]
      properties:
        type: { const: request }
        id: { type: string }
        method: { const: core.settings.set }
        params:
          type: object
          minProperties: 1
          description: >
            Partial update - only include the fields being changed.
            Persisted immediately (QSettings-backed, same as today); see
            core-notes.md for which of these apply live vs. only after the
            engine process restarts (masterTimerFrequencyHz is read once at
            MasterTimer construction today).
          properties:
            locale:
              type: [string, "null"]
              description: "e.g. \"en_US\", \"de_DE\". Governs only the language of engine-generated log/error strings (Doc::appendToErrorLog, qWarning/qDebug tr() text) - NOT client UI chrome, see core-notes.md exclusions."
            defaultWorkingPath:
              type: [string, "null"]
              description: "Default directory the engine uses to resolve/browse relative file operations (project files, imports, fixture resources). Maps to App::workingPath / SETTINGS_WORKINGPATH."
            masterTimerFrequencyHz:
              type: integer
              description: "DMX/function output tick rate. Maps to MasterTimer's MASTERTIMER_FREQUENCY QSetting. Takes effect on next engine start, not live (see core-notes.md)."

  CoreSettingsSetResponse:
    payload:
      oneOf:
        - $ref: '#/components/messages/CoreSettingsSetOkResponse/payload'
        - $ref: '#/components/messages/ErrorResponse/payload'

  CoreSettingsSetOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          $ref: '#/components/schemas/CoreSettings'

  CoreSettingsChangedEvent:
    payload:
      type: object
      required: [type, topic, data]
      properties:
        type: { const: event }
        topic: { const: core.settings.changed }
        originClientId: { type: [string, "null"] }
        data:
          $ref: '#/components/schemas/CoreSettings'

  # -----------------------------------------------------------------------
  # Log / error event stream
  # -----------------------------------------------------------------------

  CoreLogEvent:
    payload:
      type: object
      required: [type, topic, data]
      description: >
        Structured equivalent of QLC+'s own message handler (see
        qmlui/main.cpp's qInstallMessageHandler, only installed today under
        -d). The server is expected to install a process-wide Qt message
        handler and republish every qDebug/qWarning/qCritical/qFatal call
        engine-wide through this event, so an Electron UI gets an error
        console with parity to what -d currently dumps to stderr - not
        just core-domain messages, this is the generic sink for the whole
        engine process. Subscribe-gated (see core-notes.md): pick the
        single "core.log" topic for a firehose, or one of the per-level
        topics to filter volume.
      properties:
        type: { const: event }
        topic:
          type: string
          enum: [core.log, core.log.debug, core.log.info, core.log.warning, core.log.critical]
        originClientId:
          type: "null"
          description: "Always null - these originate from engine-internal logging, never from a specific client's request."
        data:
          type: object
          required: [level, message, timestampMs]
          properties:
            level:
              type: string
              enum: [debug, info, warning, critical, fatal]
              description: "fatal messages are also published on the core.log.critical topic (there is no separate core.log.fatal topic, see core-notes.md)."
            message: { type: string }
            timestampMs:
              type: integer
              description: "Wall-clock epoch milliseconds. (Tardis's own internal timestamps are process-uptime-relative, not wall-clock - the server must convert, see core-notes.md.)"
            file:
              type: [string, "null"]
              description: "Source file, from QMessageLogContext, when available."
            line:
              type: [integer, "null"]
            function:
              type: [string, "null"]

  # -----------------------------------------------------------------------
  # Shared response building blocks
  # -----------------------------------------------------------------------

  CoreDocRevisionOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      description: >
        Shared ok-response for core.project.new and core.project.close:
        both fully replace the document with a blank one and return only
        the new docRevision (full state comes from the paired
        CoreProjectLoadedEvent broadcast, not this response).
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [docRevision]
          properties:
            docRevision:
              type: integer
              description: "Revision of the new blank document (see CoreProjectLoadedEvent for full state)."

  CoreUndoRedoOkResponse:
    payload:
      type: object
      required: [type, id, ok, result]
      description: >
        Shared ok-response for core.undo and core.redo - identical result
        shape for both directions.
      properties:
        type: { const: response }
        id: { type: string }
        ok: { const: true }
        result:
          type: object
          required: [ok, docRevision, stepsApplied, direction, canUndo, canRedo]
          properties:
            ok:
              type: boolean
              description: "true if at least one step was applied (stepsApplied > 0); false when there was nothing to undo/redo - still an ok:true envelope, not an error."
            description:
              type: string
              description: "Tardis action name of the (first) step applied, e.g. \"FunctionSetName\"; present only when ok."
            direction:
              type: string
              enum: [undo, redo]
            docRevision:
              type: integer
              description: "Only changes if at least one undone/redone action was structural; unchanged if the affected step(s) were purely live/runtime actions."
            stepsApplied:
              type: integer
              description: "May be less than requested steps if history ran out."
            canUndo: { type: boolean }
            canRedo: { type: boolean }
            undoText:
              type: string
              description: Present only when canUndo.
            redoText:
              type: string
              description: Present only when canRedo.

schemas:

  CoreBpmState:
    type: object
    required: [bpm, generator]
    description: >
      InputOutputMap's beat generator state (core.bpm.get result and
      core.bpm.changed data). No beatsPerBar: the engine has no bar concept
      at generator level (only Show has a per-show beatsDivision), so the web
      UI contract's optional field is simply absent.
    properties:
      bpm:
        type: integer
        description: InputOutputMap::bpmNumber() - 0 while the generator is disabled (or a plugin/audio source hasn't detected a tempo yet).
      generator:
        type: string
        enum: [disabled, internal, plugin, audio]
        description: InputOutputMap::BeatGeneratorType, lower-case (NOT the capitalized .qxw persistence spelling).

  CoreProjectMetadata:
    type: object
    required: [filePath, fileName, isModified, docRevision, docRevisionAtLastSave, creator]
    properties:
      filePath:
        type: [string, "null"]
        description: "Full path on the engine's filesystem. Null for a never-saved project, or one opened via source=upload that hasn't been saved yet."
      fileName:
        type: [string, "null"]
        description: "Basename of filePath, for display. Null under the same conditions as filePath."
      isModified:
        type: boolean
        description: "Mirrors Doc::isModified()."
      docRevision:
        type: integer
      docRevisionAtLastSave:
        type: [integer, "null"]
        description: "docRevision at the moment of the last successful save (or saveAs with target=serverPath) this session. Null if never saved this session. Equivalent way to derive isModified: docRevision !== docRevisionAtLastSave."
      creator:
        type: [object, "null"]
        description: >
          Informational only, read-only via this API - the engine has no
          concept of an editable project title/author/notes field (see
          core-notes.md, "what Doc actually tracks"). Null for a brand-new
          unsaved project. Reflects the <Creator> block of the last
          loaded/saved file; QLC+ currently always rewrites author to the
          OS user name at save time regardless of what was loaded, this API
          surfaces that behavior as-is rather than inventing a settable field.
        properties:
          name: { type: [string, "null"] }
          version: { type: [string, "null"] }
          author: { type: [string, "null"] }

  CoreRecentFileEntry:
    type: object
    required: [filePath, fileName]
    properties:
      filePath: { type: string }
      fileName: { type: string }

  CoreHistoryEntry:
    type: object
    required: [index, actionCode, actionName, tier, timestampMs]
    properties:
      index:
        type: integer
        description: "Position in the history stack, 0-based."
      actionCode:
        type: integer
        description: "Raw Tardis::ActionCodes value."
      actionName:
        type: string
        description: "Symbolic name, e.g. \"FunctionSetName\", \"VCWidgetGeometry\" (Tardis::actionToString())."
      tier:
        type: string
        enum: [structural, live]
        description: "structural = actionCode < 0xF000 (LIVE_ACTIONS_START_CODE), i.e. it bumps docRevision/isModified. live = a runtime action (fader move, button press, function start/stop, ...) - see core-notes.md for why the shared undo stack mixes both."
      timestampMs:
        type: integer
        description: "Wall-clock epoch milliseconds (converted from Tardis's internal process-uptime-relative timestamp, see core-notes.md)."

  CoreSettings:
    type: object
    required: [locale, defaultWorkingPath, masterTimerFrequencyHz]
    properties:
      locale:
        type: [string, "null"]
      defaultWorkingPath:
        type: [string, "null"]
      masterTimerFrequencyHz:
        type: integer

