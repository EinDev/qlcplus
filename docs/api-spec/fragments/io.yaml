                $ref: '#/components/schemas/IoAudioDevice'
            inputDevice:
              type: string
            outputDevice:
              type: string
            inputSampleRate:
              type: integer
              description: Audio input sample rate in Hz (QSettings audio/samplerate, default 44100)
            inputChannels:
              type: integer
              description: Audio input channels, 1 = mono, 2 = stereo (QSettings audio/channels, default 1)
            outputBufferMs:
              type: integer
              description: Audio output buffer length in ms (QSettings audio/outputBufferMs, default 100)
  IoAudioSetConfigRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.audio.setConfig
        params:
          type: object
          description: 'PopupAudioConfiguration.qml: the audio input format and the output buffer of the
            QLC+ host (InputOutputManager::setAudioInputSampleRate / setAudioInputChannels /
            setAudioOutputBuffer). Host-wide QSettings, not part of the project; live, no baseRevision.
            At least one field; a field set to its default removes the key. A changed input format tears
            the running audio capture down (Doc::destroyAudioCapture) so its next user re-opens it.
            INVALID_PARAMS for an empty request or a value outside the lists below.

            '
          properties:
            inputSampleRate:
              enum:
              - 8000
              - 11025
              - 22050
              - 32000
              - 44100
              - 48000
            inputChannels:
              enum:
              - 1
              - 2
            outputBufferMs:
              type: integer
              minimum: 10
              maximum: 1000
  IoAudioSetConfigResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoAudioConfigChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      description: After an io.audio.setConfig that changed something. Carries all three current values.
      properties:
        type:
          const: event
        topic:
          const: io.audio.configChanged
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - inputSampleRate
          - inputChannels
          - outputBufferMs
          properties:
            inputSampleRate:
              type: integer
            inputChannels:
              type: integer
            outputBufferMs:
              type: integer
  IoAudioInputPreviewSetRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.audio.inputPreview.set
        params:
          type: object
          required:
          - enabled
          description: 'PopupAudioConfiguration.qml''s "Signal level" check (InputOutputManager::enableAudioInputPreview):
            while at least one client has it on, the QLC+ host''s audio input capture runs and every
            previewing client receives io.audio.inputLevel. Per client, live, no baseRevision; the client''s
            disconnect ends its preview. A device / format change (io.audio.setDevice / setConfig) re-opens
            the running preview on the new input.

            '
          properties:
            enabled:
              type: boolean
  IoAudioInputPreviewSetResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoAudioInputPreviewSetOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoAudioInputPreviewSetOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - capturing
          properties:
            capturing:
              type: boolean
              description: The host has an audio input capture running for the preview (some client has it on)
  IoAudioInputLevelEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      description: The host's audio input signal power while this client's io.audio.inputPreview is on,
        about 20 per second. Sent only to the previewing clients (no subscribe needed, never broadcast).
      properties:
        type:
          const: event
        topic:
          const: io.audio.inputLevel
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - level
          properties:
            level:
              type: integer
              minimum: 0
              maximum: 32767
              description: AudioCapture's signal power, 0..0x7FFF (the desktop's level bar scale)
  IoAudioSetDeviceRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.audio.setDevice
        params:
          type: object
          required:
          - direction
          - privateName
          description: 'Selects the host audio device the engine uses for audio input (beat detection,
            Audio Triggers) or output (Audio functions) - InputOutputManager::setAudioInput/setAudioOutput.
            Live/host setting, no baseRevision; "__qlcplusdefault__" restores the system default.
            NOT_FOUND for a privateName the host does not list.

            '
          properties:
            direction:
              enum:
              - input
              - output
            privateName:
              type: string
  IoAudioSetDeviceResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoAudioDeviceChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: io.audio.deviceChanged
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - direction
          - privateName
          properties:
            direction:
              enum:
              - input
              - output
            privateName:
              type: string
  IoDmxChannelInspectRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.dmx.channel.inspect
        params:
          type: object
          required:
          - universeId
          - channel
          description: 'SimpleDesk.qml''s channel value debug (SimpleDesk::debugChannelInfo()) as data:
            which sources currently drive one DMX channel. Read-only live state (§4b). Out-of-range
            universeId / channel answer INVALID_PARAMS.

            '
          properties:
            universeId:
              type: integer
              minimum: 0
            channel:
              type: integer
              minimum: 0
              maximum: 511
              description: 0-based channel within the universe.
  IoDmxChannelInspectResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoDmxChannelInspectOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoDmxChannelInspectOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/IoDmxChannelInspection'
schemas:
  IoAudioDevice:
    type: object
    required:
    - name
    - privateName
    properties:
      name:
        type: string
        description: Human-readable device name.
      privateName:
        type: string
        description: Stable device id to pass to io.audio.setDevice ("__qlcplusdefault__" for the system default).
  IoUniverseSummary:
    type: object
    required:
    - id
    - name
    - passthrough
    - monitor
    - usedChannels
    - totalChannels
    - isPatched
    - inputPatched
    - outputPatchesCount
    - hasFeedback
    properties:
      id:
        type: integer
      name:
        type: string
      passthrough:
        type: boolean
      monitor:
        type: boolean
      usedChannels:
        type: integer
        minimum: 0
        maximum: 512
      totalChannels:
        type: integer
        minimum: 0
        maximum: 512
      isPatched:
        type: boolean
      inputPatched:
        type: boolean
      outputPatchesCount:
        type: integer
      hasFeedback:
        type: boolean
  IoUniverseDetail:
    description: IoUniverseSummary plus the resolved patches, returned by io.universe.get and embedded
      in every structural universe/patch event.
    allOf:
    - $ref: '#/components/schemas/IoUniverseSummary'
    - type: object
      required:
      - inputPatch
      - outputPatches
      - feedbackPatch
      properties:
        inputPatch:
          oneOf:
          - $ref: '#/components/schemas/IoInputPatchRef'
          - type: 'null'
        outputPatches:
          type: array
          items:
            $ref: '#/components/schemas/IoOutputPatchRef'
        feedbackPatch:
          oneOf:
          - $ref: '#/components/schemas/IoOutputPatchRef'
          - type: 'null'
  IoInputPatchRef:
    type: object
    required:
    - pluginName
    - input
    - inputUID
    - inputName
    - profileName
    - parameters
    properties:
      pluginName:
        type: string
      input:
        type: integer
        description: Plugin input line index.
      inputUID:
        type: string
        description: Stable line UID (InputPatch::inputUID).
      inputName:
        type: string
      profileName:
        type:
        - string
        - 'null'
      parameters:
        $ref: '#/components/schemas/IoPluginParameters'
  IoOutputPatchRef:
    type: object
    required:
    - index
    - pluginName
    - output
    - outputUID
    - outputName
    - parameters
    - paused
    - blackout
    properties:
      index:
        type: integer
        description: Slot index within Universe::outputPatch(index); 0 for the sole feedback patch.
      pluginName:
        type: string
      output:
        type: integer
        description: Plugin output line index.
      outputUID:
        type: string
        description: Stable line UID (OutputPatch::outputUID).
      outputName:
        type: string
      parameters:
        $ref: '#/components/schemas/IoPluginParameters'
      paused:
        type: boolean
        description: Live-only, see io.patch.output.setState.
      blackout:
        type: boolean
        description: Live-only, see io.patch.output.setState.
  IoPluginParameters:
    type: object
    description: Generic key-value plugin/line parameter bag (QVariant values on the C++ side).
    additionalProperties:
      anyOf:
      - type: string
      - type: number
      - type: boolean
      - type: 'null'
  IoPluginSummary:
    type: object
    required:
    - name
    - capabilities
    - description
    - canConfigure
    - supportsFeedback
    - inputLines
    - outputLines
    properties:
      name:
        type: string
      inputLines:
        type: array
        description: QLCIOPlugin::inputs()/inputsUID(), inline so a patch dialog needs one round-trip (the web UI contract's shape; io.plugin.getLines returns the same lists).
        items:
          $ref: '#/components/schemas/IoPluginLine'
      outputLines:
        type: array
        description: QLCIOPlugin::outputs()/outputsUID(), see inputLines.
        items:
          $ref: '#/components/schemas/IoPluginLine'
      capabilities:
        type: array
        description: QLCIOPlugin::Capability bitmask, expanded to strings.
        items:
          enum:
          - Output
          - Input
          - Feedback
          - Infinite
          - RDM
          - Beats
      description:
        type: string
        description: QLCIOPlugin::pluginInfo() (HTML).
      canConfigure:
        type: boolean
        description: QLCIOPlugin::canConfigure() — see io-notes.md on why io.plugin.configure alone doesn't
          fully replace this.
      supportsFeedback:
        type: boolean
  IoPluginLine:
    type: object
    required:
    - index
    - line
    - name
    - uid
    properties:
      index:
        type: integer
        description: 0-based line number, the value io.patch.set takes as `line` (web UI contract spelling; same as `line`).
      line:
        type: integer
        description: Same as index.
      name:
        type: string
      uid:
        type: string
        description: Stable UID (QLCIOPlugin::inputsUID()/outputsUID()).
  IoInputProfileType:
    type: string
    enum:
    - MIDI
    - OS2L
    - OSC
    - HID
    - DMX
    - Enttec
  IoInputProfile:
    type: object
    required:
    - manufacturer
    - model
    - type
    - midiSendNoteOff
    - channels
    - colorTable
    - midiChannelTable
    properties:
      manufacturer:
        type: string
      model:
        type: string
      type:
        $ref: '#/components/schemas/IoInputProfileType'
      midiSendNoteOff:
        type: boolean
        description: 'MIDI-only: send Note-On velocity 0 instead of Note-Off (QLCInputProfile::midiSendNoteOff).'
      channels:
        type: array
        items:
          $ref: '#/components/schemas/IoInputChannel'
      colorTable:
        type: array
        description: Optional RGB LED feedback color table (QLCInputProfile::colorTable).
        items:
          type: object
          required:
          - value
          - label
          - color
          properties:
            value:
              type: integer
              minimum: 0
              maximum: 255
            label:
              type: string
            color:
              type: string
              description: '#rrggbb'
      name:
        type: string
        description: Read-only, "<manufacturer> <model>" (QLCInputProfile::name), the key io.inputProfile.get/delete
          take. Ignored on save.
      path:
        type: string
        description: Read-only, the .qxi file the profile was loaded from / saved to (empty if never saved).
      isUser:
        type: boolean
        description: Read-only, true when the profile lives in the user profile directory (or was never saved) -
          only those can be deleted; a bundled system profile is INVALID_STATE on delete. Saving over a system
          profile writes a user copy that overrides it.
      midiChannelTable:
        type: array
        description: Optional per-MIDI-channel labels (QLCInputProfile::midiChannelTable).
        items:
          type: object
          required:
          - channel
          - label
          properties:
            channel:
              type: integer
              minimum: 0
              maximum: 15
            label:
              type: string
  IoInputChannel:
    type: object
    required:
    - number
    - name
    - type
    - movementType
    - movementSensitivity
    - sendExtraPress
    - lowerValue
    - upperValue
    properties:
      number:
        type: integer
        description: Channel number/key within the profile's channel map.
      name:
        type: string
      type:
        enum:
        - Slider
        - Knob
        - Encoder
        - Button
        - NextPage
        - PrevPage
        - PageSet
        - NoType
      movementType:
        enum:
        - Absolute
        - Relative
        description: Slider/Knob only.
      movementSensitivity:
        type: integer
      sendExtraPress:
        type: boolean
        description: Button only.
      lowerValue:
        type: integer
        minimum: 0
        maximum: 255
      upperValue:
        type: integer
        minimum: 0
        maximum: 255
      lowerChannel:
        type: integer
        description: MIDI channel for custom feedback (QLCInputChannel::lowerChannel, the .qxi MidiChannel
          attribute); -1 or omitted if unused. Button channels only, like lowerValue/upperValue.
      upperChannel:
        type: integer
        description: Declared by the engine header but never defined, persisted or read - not served; kept in
          the schema only as a placeholder should the engine ever implement it.
  IoGrandMasterChannelMode:
    type: string
    enum:
    - Intensity
    - AllChannels
    description: 'GrandMaster::ChannelMode — Intensity: GM scales only Intensity-group channels; AllChannels:
      GM scales every channel.'
  IoGrandMasterValueMode:
    type: string
    enum:
    - Limit
    - Reduce
    description: 'GrandMaster::ValueMode — Limit: clamps channel values to the GM value; Reduce: scales
      channel values by the GM fraction.'
  IoGrandMasterState:
    type: object
    required:
    - value
    - channelMode
    - valueMode
    properties:
      value:
        type: integer
        minimum: 0
        maximum: 255
      channelMode:
        $ref: '#/components/schemas/IoGrandMasterChannelMode'
      valueMode:
        $ref: '#/components/schemas/IoGrandMasterValueMode'
  IoSimpleDeskChannel:
    type: object
    required:
    - address
    - universeId
    - channel
    - value
    - group
    - fixtureId
    - overridden
    properties:
      address:
        type: integer
        description: Absolute address, (universeId << 9) + channel.
      universeId:
        type: integer
      channel:
        type: integer
        minimum: 0
        maximum: 511
        description: Address relative to the universe.
      value:
        type: integer
        minimum: 0
        maximum: 255
      group:
        type:
        - string
        - 'null'
        description: QLCChannel::Group name (e.g. Intensity, Pan) if this address falls inside a patched
          fixture, else null.
      fixtureId:
        type:
        - integer
        - 'null'
      overridden:
        type: boolean
        description: true if Simple Desk currently holds this channel (SimpleDesk::hasChannel).
  IoDmxChannelInspection:
    type: object
    required: [universeId, channel, address, fixture, simpleDeskOverride, faders, lastWrite]
    properties:
      universeId: { type: integer }
      channel: { type: integer }
      address:
        type: integer
        description: (universeId << 9) + channel, the io.simpleDesk.* address encoding.
      fixture:
        type: [object, 'null']
        description: The fixture patched on this address, null when none.
        properties:
          id: { type: string }
          name: { type: string }
          channelIndex: { type: integer, description: 0-based channel within the fixture. }
          channelName: { type: [string, 'null'] }
          group: { type: [string, 'null'], description: QLCChannel::Group name. }
      preGMValue: { type: integer, description: Universe::preGMValue - absent when the universe is not running. }
      postGMValue: { type: integer, description: Universe::postGMValue, the value actually sent. }
      simpleDeskOverride:
        type: [integer, 'null']
        description: Value held on this address by the Control API Simple Desk (io.simpleDesk.*),
          null when not overridden. The desktop Simple Desk's own overrides are not visible here.
      faders:
        type: array
        description: Every GenericFader currently holding a FadeChannel for this channel.
        items:
          type: object
          required: [name, priority, intensity, paused, fadingOut, start, current, target, fadeTimeMs, elapsedMs, ready, flags, source]
          properties:
            name: { type: string }
            priority: { type: integer, description: Universe::FaderPriority. }
            intensity: { type: number }
            paused: { type: boolean }
            fadingOut: { type: boolean }
            start: { type: integer }
            current: { type: integer }
            target: { type: integer }
            fadeTimeMs: { type: integer }
            elapsedMs: { type: integer }
            ready: { type: boolean }
            flags:
              type: array
              items: { type: string, enum: [HTP, LTP, Fine, Intensity, CanFade, Flashing, Relative, Override, SetTarget, AutoRemove, CrossFade, ForceLTP] }
            source:
              type: string
              enum: [function, controlApiSimpleDesk, desktopTool, unidentified]
              description: 'function = owned by a Function (see function/startedBy); controlApiSimpleDesk =
                io.simpleDesk.* overrides; desktopTool = a desktop UI tool tagged through
                GenericDMXSource (see feature); unidentified = an untagged fader (the desktop Simple Desk,
                a Virtual Console widget in level mode, a CueStack or Script).'
            function:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                type: { type: string }
                running: { type: boolean }
            startedBy:
              type: array
              description: Function::sources() of the owning Function.
              items:
                type: object
                required: [type, id]
                properties:
                  type: { type: string, enum: [function, autoVCWidget, manualVCWidget, master] }
                  id: { type: string, description: Function id, VC widget id, or FunctionParent::MasterId. }
                  name: { type: string, description: Parent function name, or the MasterId name (e.g. controlApi, showManagerPlayback). }
                  functionType: { type: string }
            feature:
              type: string
              description: GenericDMXSource::Feature in camelCase (colorTool, positionTool, sceneEditorPreview, ...).
      lastWrite:
        type: [object, 'null']
        description: Universe::lastChannelWrite - the last fader write to this channel, kept after the
          fader is gone (explains a latched LTP value no fader holds any more).
        properties:
          value: { type: integer }
          faderName: { type: string }
          timestampMs: { type: number }
          ageMs: { type: number }
          functionId: { type: [string, 'null'] }
          function:
            type: [object, 'null']
            properties:
              id: { type: string }
              name: { type: string }
              type: { type: string }
              running: { type: boolean }
