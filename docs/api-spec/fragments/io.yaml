          - overridden
          properties:
            address:
              type: integer
            value:
              type: integer
              minimum: 0
              maximum: 255
            overridden:
              type: boolean
              description: false when the event is reporting a reset back to the underlying (non-SimpleDesk)
                value.
  IoSimpleDeskResetChannelRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
