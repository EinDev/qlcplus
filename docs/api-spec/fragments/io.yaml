                - value
                properties:
                  address:
                    type: integer
                    description: 'Absolute address across all universes: (universeId << 9) + channel, 0-based
                      (SimpleDesk::setAbsoluteChannelValue).'
                  value:
                    type: integer
                    minimum: 0
                    maximum: 255
