  IoSimpleDeskSetChannelsRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.simpleDesk.setChannels
        params:
          type: object
          required:
          - channels
          description: 'Bulk variant of io.simpleDesk.setChannel: applies every {address, value}
            entry from one request instead of requiring one WebSocket message per channel - for
            high-frequency multi-channel writers (e.g. a live animation client driving dozens to
            hundreds of channels per frame) where per-message serialization/dispatch overhead
            otherwise dominates. All-or-nothing: the whole request is rejected with an ErrorResponse
            and none of its entries are applied if any single entry is malformed (missing address/value,
            or value outside 0-255). Still broadcasts one io.simpleDesk.channelChanged event per
            entry, exactly as if setChannel had been called once per entry - no new bulk event type.'
