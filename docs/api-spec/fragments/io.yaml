              type: integer
          description: 'The structural side effect (a Scene created or updated) is broadcast via the
            existing functions.created/functions.updated events (functions-core.yaml), not a bespoke
            io.simpleDesk event - see io-notes.md.

            '
  IoPatchRemoveRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.patch.remove
        params:
          type: object
          required:
          - universeId
          description: 'Detaches a patch from a universe. direction (alias: patchType) selects which one:
            input and feedback are singleton per universe (index not used; removing the input also
            drops the feedback patch, as qmlui does); output patches are an indexed array - pass `index`
            to remove one slot, omit it to remove every output patch. NOT_FOUND when nothing of that
            kind is patched. Bumps docRevision and broadcasts io.universe.updated with the full detail.'
          properties:
            universeId:
              type: integer
            direction:
              enum:
              - input
              - output
              - feedback
              description: Web UI contract spelling; one of direction/patchType is required.
            patchType:
              enum:
              - input
              - output
              - feedback
              description: Alias of direction.
            index:
              type: integer
              description: Output patch slot index; omit to remove all output patches. Unused for input/feedback.
            baseRevision:
              type: integer
              description: Optional - enforced only when present, see io-notes.md "baseRevision on the web UI methods".
  IoPatchRemoveResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoPatchMutationOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoPatchSetRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.patch.set
        params:
          type: object
          required:
          - universeId
          - line
          description: >
            Attaches a plugin line to a universe's patch. direction (alias:
            patchType) selects which one - the plugin must advertise the
            matching capability (Input/Output/Feedback, see io.plugin.list),
            UNSUPPORTED otherwise. `line` is the plugin's 0-based line index
            (inputLines/outputLines in io.plugin.list) - the input line for
            'input', the output line for 'output'/'feedback'; it must exist
            unless the plugin advertises Infinite (INVALID_PARAMS). Unknown
            plugin -> NOT_FOUND. Bumps docRevision and broadcasts
            io.universe.updated with the full IoUniverseDetail.
          properties:
            universeId:
              type: integer
            direction:
              enum:
              - input
              - output
              - feedback
              description: Web UI contract spelling; one of direction/patchType is required.
            patchType:
              enum:
              - input
              - output
              - feedback
              description: Alias of direction.
            plugin:
              type: string
              description: Plugin name (io.plugin.list). Web UI contract spelling; one of plugin/pluginName is required.
            pluginName:
              type: string
              description: Alias of plugin.
            line:
              type: integer
              description: Plugin input/output line index (see io.plugin.list's inputLines/outputLines).
            index:
              type: integer
              default: 0
              description: >
                Output patch slot, only used for direction='output'. Defaults
                to 0 = replace (or create) the primary output patch - the web
                UI contract has one output per universe in mind. Pass
                outputPatchesCount to append a further patch, or an existing
                index to replace that one; anything larger is INVALID_PARAMS.
            profile:
              type: string
              description: >
                Input profile name (io.inputProfile.list), direction='input'
                only. Three cases, matching QML's setInputProfile(): key absent
                -> the current input patch's profile is kept (so a line change
                needn't re-send it); "" -> no profile; a name -> must exist
                (NOT_FOUND otherwise). Web UI contract spelling.
            profileName:
              type: string
              description: Alias of profile.
            baseRevision:
              type: integer
              description: Optional - enforced only when present, see io-notes.md "baseRevision on the web UI methods".
  IoPatchSetResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoPatchMutationOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
