messages:
  IoUniverseListRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.universe.list
        params:
          type: object
  IoUniverseListResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoUniverseListOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoUniverseListOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - universes
          - docRevision
          properties:
            universes:
              type: array
              items:
                $ref: '#/components/schemas/IoUniverseSummary'
            docRevision:
              type: integer
  IoUniverseGetRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.universe.get
        params:
          type: object
          required:
          - universeId
          properties:
            universeId:
              type: integer
  IoUniverseGetResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoUniverseGetOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoUniverseGetOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/IoUniverseDetail'
  IoUniverseCreateRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.universe.create
        params:
          type: object
          required:
          - baseRevision
          properties:
            name:
              type: string
              description: Optional friendly name; engine assigns a default (e.g. 'Universe N') if omitted.
            baseRevision:
              type: integer
  IoUniverseCreateResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoUniverseCreateOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoUniverseCreateOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - universeId
          - docRevision
          properties:
            universeId:
              type: integer
            docRevision:
              type: integer
  IoUniverseCreatedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: io.universe.created
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - universe
          - docRevision
          properties:
            universe:
              $ref: '#/components/schemas/IoUniverseDetail'
            docRevision:
              type: integer
  IoUniverseDeleteRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.universe.delete
        params:
          type: object
          required:
          - universeId
          - baseRevision
          properties:
            universeId:
              type: integer
            baseRevision:
              type: integer
  IoUniverseDeleteResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoUniverseDeleteOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoUniverseDeleteOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - docRevision
          properties:
            docRevision:
              type: integer
  IoUniverseDeletedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: io.universe.deleted
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - universeId
          - docRevision
          properties:
            universeId:
              type: integer
            docRevision:
              type: integer
  IoUniverseUpdateRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.universe.update
        params:
          type: object
          required:
          - universeId
          - baseRevision
          description: 'Partial update of the universe''s persisted (document-state) properties. Omit
            a field to leave it unchanged.

            '
          properties:
            universeId:
              type: integer
            name:
              type: string
            passthrough:
              type: boolean
              description: Universe::setPassthrough — merges the input patch's live values onto this universe's
                output.
            baseRevision:
              type: integer
  IoUniverseUpdateResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoUniverseUpdateOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoUniverseUpdateOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - docRevision
          properties:
            docRevision:
              type: integer
  IoUniverseChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: io.universe.changed
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - universe
          - docRevision
          description: 'Broadcast for io.universe.update AND for any patch mutation (io.patch.*) — always
            carries the full new IoUniverseDetail so clients never need to re-fetch after a patch change.

            '
          properties:
            universe:
              $ref: '#/components/schemas/IoUniverseDetail'
            docRevision:
              type: integer
  IoUniverseSetMonitorRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.universe.setMonitor
        params:
          type: object
          required:
          - universeId
          - monitor
          description: 'Live/runtime only (Universe::setMonitor is never persisted to the .qxw — see io-notes.md).
            No baseRevision.

            '
          properties:
            universeId:
              type: integer
            monitor:
              type: boolean
  IoUniverseSetMonitorResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoUniverseMonitorChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: io.universe.monitorChanged
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - universeId
          - monitor
          properties:
            universeId:
              type: integer
            monitor:
              type: boolean
  IoPatchSetParametersRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.patch.setParameters
        params:
          type: object
          required:
          - universeId
          - patchType
          - parameters
          - baseRevision
          description: 'Generic per-line plugin parameter set (QLCIOPlugin::setParameter / getParameters
            — e.g. ArtNet''s outputIP/outputUni/transmitMode, OSC''s inputPort/feedbackIP/feedbackPort).
            A parameter value of null reverts that key to the plugin''s default (QLCIOPlugin::unSetParameter).

            '
          properties:
            universeId:
              type: integer
            patchType:
              enum:
              - input
              - output
              - feedback
            index:
              type: integer
              default: 0
              description: Output patch slot index; ignored for input/feedback (each universe has at most
                one of those).
            parameters:
              $ref: '#/components/schemas/IoPluginParameters'
            baseRevision:
              type: integer
  IoPatchSetParametersResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoPatchMutationOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoPatchMutationOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - docRevision
          properties:
            docRevision:
              type: integer
  IoPatchOutputSetStateRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.patch.output.setState
        params:
          type: object
          required:
          - universeId
          - index
          description: 'Live/runtime only (OutputPatch::paused/blackout are not persisted to the .qxw).
            No baseRevision. Omit a field to leave it unchanged.

            '
          properties:
            universeId:
              type: integer
            index:
              type: integer
            paused:
              type: boolean
            blackout:
              type: boolean
  IoPatchOutputSetStateResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoPatchOutputStateChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: io.patch.output.stateChanged
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - universeId
          - index
          - paused
          - blackout
          properties:
            universeId:
              type: integer
            index:
              type: integer
            paused:
              type: boolean
            blackout:
              type: boolean
  IoPluginListRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.plugin.list
        params:
          type: object
  IoPluginListResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoPluginListOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoPluginListOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - plugins
          properties:
            plugins:
              type: array
              items:
                $ref: '#/components/schemas/IoPluginSummary'
  IoPluginGetLinesRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.plugin.getLines
        params:
          type: object
          required:
          - pluginName
          properties:
            pluginName:
              type: string
  IoPluginGetLinesResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoPluginGetLinesOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoPluginGetLinesOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - inputs
          - outputs
          properties:
            inputs:
              type: array
              items:
                $ref: '#/components/schemas/IoPluginLine'
            outputs:
              type: array
              items:
                $ref: '#/components/schemas/IoPluginLine'
  IoPluginRescanRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.plugin.rescan
        params:
          type: object
          required:
          - pluginName
          description: 'Ask a hotplug-style plugin (DMXUSB, HID, ...) to re-enumerate its hardware (DMXUSB::rescanWidgets()
            and equivalents). Not every plugin supports this — see io-notes.md.

            '
          properties:
            pluginName:
              type: string
  IoPluginRescanResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoPluginLinesChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: io.plugin.linesChanged
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - pluginName
          - inputs
          - outputs
          description: Mirrors QLCIOPlugin::configurationChanged() — a line appeared/disappeared (rescan
            or hotplug).
          properties:
            pluginName:
              type: string
            inputs:
              type: array
              items:
                $ref: '#/components/schemas/IoPluginLine'
            outputs:
              type: array
              items:
                $ref: '#/components/schemas/IoPluginLine'
  IoPluginConfigureRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.plugin.configure
        params:
          type: object
          required:
          - pluginName
          description: 'Thin passthrough to InputOutputMap::configurePlugin(). Kept for parity with the
            engine''s existing interface, but on today''s engine build this pops a native Qt dialog server-side
            and is NOT usable from a remote Electron client — see io-notes.md for the recommended replacement
            (io.patch.setParameters).

            '
          properties:
            pluginName:
              type: string
  IoPluginConfigureResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoInputProfileListRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.inputProfile.list
        params:
          type: object
  IoInputProfileListResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoInputProfileListOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoInputProfileListOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - profiles
          - profilesRevision
          properties:
            profiles:
              type: array
              items:
                type: object
                required:
                - name
                - manufacturer
                - model
                - type
                properties:
                  name:
                    type: string
                    description: manufacturer - model
                  manufacturer:
                    type: string
                  model:
                    type: string
                  type:
                    $ref: '#/components/schemas/IoInputProfileType'
            profilesRevision:
              type: integer
  IoInputProfileGetRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.inputProfile.get
        params:
          type: object
          required:
          - name
          properties:
            name:
              type: string
  IoInputProfileGetResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoInputProfileGetOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoInputProfileGetOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - profile
          - profilesRevision
          properties:
            profile:
              $ref: '#/components/schemas/IoInputProfile'
            profilesRevision:
              type: integer
  IoInputProfileSaveRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.inputProfile.save
        params:
          type: object
          required:
          - profile
          - baseRevision
          description: 'Whole-document upsert: creates a new profile, or replaces an existing one whose
            (manufacturer, model) matches. See io-notes.md for why this is a single whole-object save
            rather than fine-grained per-channel mutations.

            '
          properties:
            profile:
              $ref: '#/components/schemas/IoInputProfile'
            baseRevision:
              type: integer
              description: profilesRevision this client last observed.
  IoInputProfileSaveResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoInputProfileSaveOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoInputProfileSaveOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - profilesRevision
          properties:
            profilesRevision:
              type: integer
  IoInputProfileChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: io.inputProfile.changed
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - profile
          - profilesRevision
          properties:
            profile:
              $ref: '#/components/schemas/IoInputProfile'
            profilesRevision:
              type: integer
  IoInputProfileDeleteRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.inputProfile.delete
        params:
          type: object
          required:
          - name
          - baseRevision
          properties:
            name:
              type: string
            baseRevision:
              type: integer
  IoInputProfileDeleteResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoInputProfileDeleteOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoInputProfileDeleteOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - profilesRevision
          properties:
            profilesRevision:
              type: integer
  IoInputProfileDeletedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: io.inputProfile.deleted
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - name
          - profilesRevision
          properties:
            name:
              type: string
            profilesRevision:
              type: integer
  IoInputProfileLearnStartRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.inputProfile.learn.start
        params:
          type: object
          required:
          - universeId
          description: 'Puts the engine into MIDI/OSC-learn mode: raw input signals on this (already patched)
            input universe are reported via io.inputProfile.learn.signal instead of being consumed normally,
            mirroring InputProfileEditor::toggleDetection(). Live, no baseRevision — this is editor-session
            state, not saved.

            '
          properties:
            universeId:
              type: integer
  IoInputProfileLearnStartResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoInputProfileLearnStopRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.inputProfile.learn.stop
        params:
          type: object
  IoInputProfileLearnStopResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoInputProfileLearnSignalEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: io.inputProfile.learn.signal
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - channelNumber
          - alreadyMapped
          properties:
            channelNumber:
              type: integer
            alreadyMapped:
              type: boolean
  IoGrandMasterGetRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.grandMaster.get
        params:
          type: object
  IoGrandMasterGetResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoGrandMasterGetOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoGrandMasterGetOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          $ref: '#/components/schemas/IoGrandMasterState'
  IoGrandMasterSetValueRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.grandMaster.setValue
        params:
          type: object
          required:
          - value
          properties:
            value:
              type: integer
              minimum: 0
              maximum: 255
  IoGrandMasterSetValueResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoGrandMasterSetModeRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.grandMaster.setMode
        params:
          type: object
          description: Omit a field to leave it unchanged.
          properties:
            channelMode:
              $ref: '#/components/schemas/IoGrandMasterChannelMode'
            valueMode:
              $ref: '#/components/schemas/IoGrandMasterValueMode'
  IoGrandMasterSetModeResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoGrandMasterChangedEvent:
    payload:
      type: object
      required:
