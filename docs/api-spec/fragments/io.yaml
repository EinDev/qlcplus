  IoSimpleDeskResetUniverseRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.simpleDesk.resetUniverse
        params:
          type: object
          required:
          - universeId
          properties:
            universeId:
              type: integer
  IoSimpleDeskResetUniverseResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoSimpleDeskUniverseResetEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: io.simpleDesk.universeReset
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - universeId
          properties:
            universeId:
              type: integer
  IoSimpleDeskSetUniverseFilterRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.simpleDesk.setUniverseFilter
        params:
          type: object
          required:
          - universeId
          description: 'Sets which universe Simple Desk''s channel view currently targets (PreviewContext::setUniverseFilter).
            This is global engine state shared by every connected client, consistent with the single-operator-app
            assumption in 00-conventions.md §8.

            '
          properties:
            universeId:
              type: integer
  IoSimpleDeskSetUniverseFilterResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoSimpleDeskUniverseFilterChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: io.simpleDesk.universeFilterChanged
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - universeId
          properties:
            universeId:
              type: integer
  IoSimpleDeskSendKeypadCommandRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.simpleDesk.sendKeypadCommand
        params:
          type: object
          required:
          - command
          description: 'Console-style keypad syntax (e.g. "1 THRU 10 @ 50 ENTER"), see SimpleDesk::sendKeypadCommand
            / KeyPadParser. Side effects arrive as ordinary io.simpleDesk.channelChanged events, one per
            affected channel.

            '
          properties:
            command:
              type: string
  IoSimpleDeskSendKeypadCommandResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoSimpleDeskSendKeypadCommandOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoSimpleDeskSendKeypadCommandOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - accepted
          properties:
            accepted:
              type: boolean
              description: false if the command string was not syntactically valid; see error.details
                for the parser's message if ok:false was used instead.
  IoSimpleDeskCommandHistoryChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          const: io.simpleDesk.commandHistoryChanged
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - history
          properties:
            history:
              type: array
              items:
                type: string
  IoPatchRemoveRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.patch.remove
        params:
          type: object
          required:
          - universeId
          - patchType
          - baseRevision
          description: 'Detaches a patch from a universe. patchType selects which one: input and feedback
            are singleton per universe (index not used); output patches are an indexed array, so `index`
            is required when patchType is ''output''.'
          properties:
            universeId:
              type: integer
            patchType:
              enum:
              - input
              - output
              - feedback
            index:
              type: integer
              description: Output patch slot index; required when patchType='output', unused otherwise.
            baseRevision:
              type: integer
  IoPatchRemoveResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoPatchMutationOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoPatchSetRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.patch.set
        params:
          type: object
          required:
          - universeId
          - patchType
          - pluginName
          - line
          - baseRevision
          description: Attaches a plugin line to a universe's patch. patchType selects which one (input/output/feedback
            - the plugin must advertise the Feedback capability for patchType='feedback', see io.plugin.list).
            `line` is the plugin's line index either way (see io.plugin.getLines) - the input line for
            patchType='input', the output line for 'output'/'feedback'.
          properties:
            universeId:
              type: integer
            patchType:
              enum:
              - input
              - output
              - feedback
            pluginName:
              type: string
            line:
              type: integer
              description: Plugin input/output line index (see io.plugin.getLines).
            index:
              type: integer
              description: Output patch slot index; only used when patchType='output'. Omit (or pass outputPatchesCount)
                to append a new patch; pass an existing index to replace it.
            profileName:
              type: string
              description: Input profile name to attach (see io.inputProfile.*); only used when patchType='input'.
                Omit/empty for none.
            baseRevision:
              type: integer
  IoPatchSetResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoPatchMutationOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
schemas:
  IoUniverseSummary:
    type: object
    required:
    - id
    - name
    - passthrough
    - monitor
    - usedChannels
    - totalChannels
    - isPatched
    - inputPatched
    - outputPatchesCount
    - hasFeedback
    properties:
      id:
        type: integer
      name:
        type: string
      passthrough:
        type: boolean
      monitor:
        type: boolean
      usedChannels:
        type: integer
        minimum: 0
        maximum: 512
      totalChannels:
        type: integer
        minimum: 0
        maximum: 512
      isPatched:
        type: boolean
      inputPatched:
        type: boolean
      outputPatchesCount:
        type: integer
      hasFeedback:
        type: boolean
  IoUniverseDetail:
    description: IoUniverseSummary plus the resolved patches, returned by io.universe.get and embedded
      in every structural universe/patch event.
    allOf:
    - $ref: '#/components/schemas/IoUniverseSummary'
    - type: object
      required:
      - inputPatch
      - outputPatches
      - feedbackPatch
      properties:
        inputPatch:
          oneOf:
          - $ref: '#/components/schemas/IoInputPatchRef'
          - type: 'null'
        outputPatches:
          type: array
          items:
            $ref: '#/components/schemas/IoOutputPatchRef'
        feedbackPatch:
          oneOf:
          - $ref: '#/components/schemas/IoOutputPatchRef'
          - type: 'null'
  IoInputPatchRef:
    type: object
    required:
    - pluginName
    - input
    - inputUID
    - inputName
    - profileName
    - parameters
    properties:
      pluginName:
        type: string
      input:
        type: integer
        description: Plugin input line index.
      inputUID:
        type: string
        description: Stable line UID (InputPatch::inputUID).
      inputName:
        type: string
      profileName:
        type:
        - string
        - 'null'
      parameters:
        $ref: '#/components/schemas/IoPluginParameters'
  IoOutputPatchRef:
    type: object
    required:
    - index
    - pluginName
    - output
    - outputUID
    - outputName
    - parameters
    - paused
    - blackout
    properties:
      index:
        type: integer
        description: Slot index within Universe::outputPatch(index); 0 for the sole feedback patch.
      pluginName:
        type: string
      output:
        type: integer
        description: Plugin output line index.
      outputUID:
        type: string
        description: Stable line UID (OutputPatch::outputUID).
      outputName:
        type: string
      parameters:
        $ref: '#/components/schemas/IoPluginParameters'
      paused:
        type: boolean
        description: Live-only, see io.patch.output.setState.
      blackout:
        type: boolean
        description: Live-only, see io.patch.output.setState.
  IoPluginParameters:
    type: object
    description: Generic key-value plugin/line parameter bag (QVariant values on the C++ side).
    additionalProperties:
      anyOf:
      - type: string
      - type: number
      - type: boolean
      - type: 'null'
  IoPluginSummary:
    type: object
    required:
    - name
    - capabilities
    - description
    - canConfigure
    - supportsFeedback
    properties:
      name:
        type: string
      capabilities:
        type: array
        description: QLCIOPlugin::Capability bitmask, expanded to strings.
        items:
          enum:
          - Output
          - Input
          - Feedback
          - Infinite
          - RDM
          - Beats
      description:
        type: string
        description: QLCIOPlugin::pluginInfo() (HTML).
      canConfigure:
        type: boolean
        description: QLCIOPlugin::canConfigure() — see io-notes.md on why io.plugin.configure alone doesn't
          fully replace this.
      supportsFeedback:
        type: boolean
  IoPluginLine:
    type: object
    required:
    - line
    - name
    - uid
    properties:
      line:
        type: integer
        description: Index passed to io.patch.*.set as input/output.
      name:
        type: string
      uid:
        type: string
        description: Stable UID (QLCIOPlugin::inputsUID()/outputsUID()).
  IoInputProfileType:
    type: string
    enum:
    - MIDI
    - OS2L
    - OSC
    - HID
    - DMX
    - Enttec
  IoInputProfile:
    type: object
    required:
    - manufacturer
    - model
    - type
    - midiSendNoteOff
    - channels
    - colorTable
    - midiChannelTable
    properties:
      manufacturer:
        type: string
      model:
        type: string
      type:
        $ref: '#/components/schemas/IoInputProfileType'
      midiSendNoteOff:
        type: boolean
        description: 'MIDI-only: send Note-On velocity 0 instead of Note-Off (QLCInputProfile::midiSendNoteOff).'
      channels:
        type: array
        items:
          $ref: '#/components/schemas/IoInputChannel'
      colorTable:
        type: array
        description: Optional RGB LED feedback color table (QLCInputProfile::colorTable).
        items:
          type: object
          required:
          - value
          - label
          - color
          properties:
            value:
              type: integer
              minimum: 0
              maximum: 255
            label:
              type: string
            color:
              type: string
              description: '#rrggbb'
      midiChannelTable:
        type: array
        description: Optional per-MIDI-channel labels (QLCInputProfile::midiChannelTable).
        items:
          type: object
          required:
          - channel
          - label
          properties:
            channel:
              type: integer
              minimum: 0
              maximum: 15
            label:
              type: string
  IoInputChannel:
    type: object
    required:
    - number
    - name
    - type
    - movementType
    - movementSensitivity
    - sendExtraPress
    - lowerValue
    - upperValue
    properties:
      number:
        type: integer
        description: Channel number/key within the profile's channel map.
      name:
        type: string
      type:
        enum:
        - Slider
        - Knob
        - Encoder
        - Button
        - NextPage
        - PrevPage
        - PageSet
        - NoType
      movementType:
        enum:
        - Absolute
        - Relative
        description: Slider/Knob only.
      movementSensitivity:
        type: integer
      sendExtraPress:
        type: boolean
        description: Button only.
      lowerValue:
        type: integer
        minimum: 0
        maximum: 255
      upperValue:
        type: integer
        minimum: 0
        maximum: 255
      lowerChannel:
        type: integer
        description: Extended/14-bit range support; -1 or omitted if unused.
      upperChannel:
        type: integer
        description: Extended/14-bit range support; -1 or omitted if unused.
  IoGrandMasterChannelMode:
    type: string
    enum:
    - Intensity
    - AllChannels
    description: 'GrandMaster::ChannelMode — Intensity: GM scales only Intensity-group channels; AllChannels:
      GM scales every channel.'
  IoGrandMasterValueMode:
    type: string
    enum:
    - Limit
    - Reduce
    description: 'GrandMaster::ValueMode — Limit: clamps channel values to the GM value; Reduce: scales
      channel values by the GM fraction.'
  IoGrandMasterState:
    type: object
    required:
    - value
    - channelMode
    - valueMode
    properties:
      value:
        type: integer
        minimum: 0
        maximum: 255
      channelMode:
        $ref: '#/components/schemas/IoGrandMasterChannelMode'
      valueMode:
        $ref: '#/components/schemas/IoGrandMasterValueMode'
  IoSimpleDeskChannel:
    type: object
    required:
    - address
    - universeId
    - channel
    - value
    - group
    - fixtureId
    - overridden
    properties:
      address:
        type: integer
        description: Absolute address, (universeId << 9) + channel.
      universeId:
        type: integer
      channel:
        type: integer
        minimum: 0
        maximum: 511
        description: Address relative to the universe.
      value:
        type: integer
        minimum: 0
        maximum: 255
      group:
        type:
        - string
        - 'null'
        description: QLCChannel::Group name (e.g. Intensity, Pan) if this address falls inside a patched
          fixture, else null.
      fixtureId:
        type:
        - integer
        - 'null'
      overridden:
        type: boolean
        description: true if Simple Desk currently holds this channel (SimpleDesk::hasChannel).
operations:
  sendIoUniverseList:
    action: send
    channel:
      $ref: '#/channels/qlcplus'
    messages:
    - $ref: '#/channels/qlcplus/messages/ioUniverseListRequest'
  receiveIoUniverseListResponse:
    action: receive
    channel:
      $ref: '#/channels/qlcplus'
    messages:
    - $ref: '#/channels/qlcplus/messages/ioUniverseListResponse'
  sendIoUniverseGet:
    action: send
    channel:
      $ref: '#/channels/qlcplus'
    messages:
    - $ref: '#/channels/qlcplus/messages/ioUniverseGetRequest'
  receiveIoUniverseGetResponse:
    action: receive
    channel:
      $ref: '#/channels/qlcplus'
    messages:
    - $ref: '#/channels/qlcplus/messages/ioUniverseGetResponse'
  sendIoUniverseCreate:
    action: send
    channel:
      $ref: '#/channels/qlcplus'
    messages:
    - $ref: '#/channels/qlcplus/messages/ioUniverseCreateRequest'
  receiveIoUniverseCreateResponse:
    action: receive
    channel:
      $ref: '#/channels/qlcplus'
    messages:
    - $ref: '#/channels/qlcplus/messages/ioUniverseCreateResponse'
  receiveIoUniverseCreated:
    action: receive
    channel:
      $ref: '#/channels/qlcplus'
    messages:
    - $ref: '#/channels/qlcplus/messages/ioUniverseCreatedEvent'
  sendIoUniverseDelete:
    action: send
    channel:
      $ref: '#/channels/qlcplus'
