        type:
          const: event
        topic:
          const: io.blackout.changed
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - blackout
          properties:
            blackout:
              type: boolean
  IoDmxUniverseGetRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.dmx.universe.get
        params:
          type: object
          required:
          - universeId
          description: 'One-shot full-frame snapshot, used to seed the baseline before/ after subscribing
            to the delta event topic below. Values are post-Grand-Master (Universe::postGMValues() — what''s
            actually transmitted), matching what mainviewdmx.cpp displays.

            '
          properties:
            universeId:
              type: integer
  IoDmxUniverseGetResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/IoDmxUniverseGetOkResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoDmxUniverseGetOkResponse:
    payload:
      type: object
      required:
      - type
      - id
      - ok
      - result
      properties:
        type:
          const: response
        id:
          type: string
        ok:
          const: true
        result:
          type: object
          required:
          - universeId
          - values
          properties:
            universeId:
              type: integer
            values:
              type: array
              description: 512 post-GM channel values (0-255), index 0 = DMX address 1.
              items:
                type: integer
                minimum: 0
                maximum: 255
              minItems: 512
              maxItems: 512
  IoDmxUniverseChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
          type: string
          pattern: ^io\.dmx\.universe\.[0-9]+\.changed$
          description: e.g. io.dmx.universe.1.changed — one topic per universe, see io-notes.md §5 for
            the subscribe key.
        originClientId:
          type:
          - string
          - 'null'
        data:
          type: object
          required:
          - universeId
          - changes
          description: 'Delta only (changed channels since the last tick that had any change), not a full
            512-byte frame — see io-notes.md for why. Call io.dmx.universe.get for the baseline snapshot.

            '
          properties:
            universeId:
              type: integer
            changes:
              type: array
              items:
                type: object
                required:
                - channel
                - value
                properties:
                  channel:
                    type: integer
                    minimum: 0
                    maximum: 511
                  value:
                    type: integer
                    minimum: 0
                    maximum: 255
  IoSimpleDeskGetRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.simpleDesk.get
        params:
