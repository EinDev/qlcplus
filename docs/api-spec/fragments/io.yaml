              description: 'Absolute address across all universes: (universeId << 9) + channel, 0-based
                (SimpleDesk::setAbsoluteChannelValue).'
            value:
              type: integer
              minimum: 0
              maximum: 255
  IoSimpleDeskSetChannelResponse:
    payload:
      oneOf:
      - $ref: '#/components/messages/GenericAckResponse/payload'
      - $ref: '#/components/messages/ErrorResponse/payload'
  IoSimpleDeskChannelChangedEvent:
    payload:
      type: object
      required:
      - type
      - topic
      - data
      properties:
        type:
          const: event
        topic:
