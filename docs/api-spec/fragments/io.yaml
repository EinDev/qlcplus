  IoSimpleDeskDumpRequest:
    payload:
      type: object
      required:
      - type
      - id
      - method
      - params
      properties:
        type:
          const: request
        id:
          type: string
        method:
          const: io.simpleDesk.dump
        params:
          type: object
          required:
          - baseRevision
          - nonZeroOnly
          description: 'Unlike every other io.simpleDesk.* method, this is a §4a structural mutation:
            it bakes Simple Desk''s currently-held live values (SimpleDesk::dumpDmxChannels) into a
            real, saved Scene Function, so it needs baseRevision/docRevision like any other document-state
            write.

            '
          properties:
            baseRevision:
              type: integer
            targetSceneId:
              type:
              - string
              - 'null'
              description: Existing Scene Function id to merge the dumped values into. Omit or null
                to create a new Scene instead (see name).
            name:
              type: string
              description: Name for the newly-created Scene. Only used when targetSceneId is omitted;
                ignored when dumping into an existing Scene.
            channelGroups:
              type: array
              items:
                type: string
              description: QLCChannel::Group names (e.g. Intensity, Pan, Colour) to include. Empty
                or omitted means every channel, matching SimpleDesk's "all channels" dump mode.
            fixtureIds:
              type: array
              items:
                type:
                - string
                - integer
              description: Fixture ids to dump (PopupDMXDump.qml's "Dump the selected fixture channels").
                Empty or omitted means every patched fixture. An unknown id answers NOT_FOUND and
                creates nothing. Combines with channelGroups and nonZeroOnly.
            nonZeroOnly:
              type: boolean
