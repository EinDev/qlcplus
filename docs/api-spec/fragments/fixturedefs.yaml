  sendFixtureDefsCapabilityUpdate:
    action: send
    channel: { $ref: '#/channels/qlcplus' }
    messages:
      - $ref: '#/channels/qlcplus/messages/fixtureDefsCapabilityUpdateRequest'
  sendFixtureDefsCapabilityRemove:
    action: send
    channel: { $ref: '#/channels/qlcplus' }
    messages:
