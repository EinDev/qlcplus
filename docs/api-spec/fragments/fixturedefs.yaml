    action: receive
    channel: { $ref: '#/channels/qlcplus' }
    messages:
      - $ref: '#/channels/qlcplus/messages/fixtureDefsSessionOpenedResponse'
  receiveFixtureDefsSessionOpenedEvent:
    action: receive
    channel: { $ref: '#/channels/qlcplus' }
    messages:
      - $ref: '#/channels/qlcplus/messages/fixtureDefsSessionOpenedEvent'

  sendFixtureDefsSessionClose:
    action: send
    channel: { $ref: '#/channels/qlcplus' }
    messages:
      - $ref: '#/channels/qlcplus/messages/fixtureDefsSessionCloseRequest'
  receiveFixtureDefsSessionCloseResponse:
    action: receive
    channel: { $ref: '#/channels/qlcplus' }
    messages:
      - $ref: '#/channels/qlcplus/messages/fixtureDefsSessionCloseResponse'
  receiveFixtureDefsSessionClosedEvent:
    action: receive
    channel: { $ref: '#/channels/qlcplus' }
    messages:
      - $ref: '#/channels/qlcplus/messages/fixtureDefsSessionClosedEvent'

  sendFixtureDefsSessionList:
    action: send
    channel: { $ref: '#/channels/qlcplus' }
    messages:
      - $ref: '#/channels/qlcplus/messages/fixtureDefsSessionListRequest'
  receiveFixtureDefsSessionListResponse:
    action: receive
    channel: { $ref: '#/channels/qlcplus' }
    messages:
      - $ref: '#/channels/qlcplus/messages/fixtureDefsSessionListResponse'

  sendFixtureDefsSessionValidate:
    action: send
    channel: { $ref: '#/channels/qlcplus' }
    messages:
      - $ref: '#/channels/qlcplus/messages/fixtureDefsSessionValidateRequest'
  receiveFixtureDefsSessionValidateResponse:
    action: receive
