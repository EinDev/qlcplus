    channel: { $ref: '#/channels/qlcplus' }
    messages:
      - $ref: '#/channels/qlcplus/messages/fixtureDefsExportRequest'
  receiveFixtureDefsExportResponse:
    action: receive
    channel: { $ref: '#/channels/qlcplus' }
    messages:
      - $ref: '#/channels/qlcplus/messages/fixtureDefsExportResponse'

  # ---- Session lifecycle ----
  sendFixtureDefsSessionCreate:
    action: send
    channel: { $ref: '#/channels/qlcplus' }
    messages:
      - $ref: '#/channels/qlcplus/messages/fixtureDefsSessionCreateRequest'
  sendFixtureDefsSessionOpen:
