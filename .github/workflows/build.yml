name: QLCplus Github Actions CI Build

on: ["push", "pull_request"]

jobs:
  build-linux:
    #if: false
    runs-on: ubuntu-22.04
    name: QLCplus Linux ${{matrix.task}}
    strategy:
      fail-fast: false
      matrix:
        task: [build-v5]
    env:
      CI_REPO_SLUG: ${{ github.repository }}
      CI_BRANCH: ${{ github.head_ref }}
      CI_PULL_REQUEST: ${{ github.event.number }}
      CC: gcc
      CXX: g++
      PACKAGES_BASE:
        gdb
        libasound2-dev
        libusb-1.0-0-dev
        libftdi1-dev
        shared-mime-info
        libudev-dev
        libmad0-dev
        libsndfile1-dev
        liblo-dev
        libfftw3-dev
        libgl1-mesa-dev
        libxml2-utils
        xvfb
        chrpath
        libfuse2
        wget
      PACKAGES_V5_BASE:
        libpulse-dev

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set General ENV variables
        run: |
          echo "PACKAGES_V5=$(echo ${PACKAGES_BASE} ${PACKAGES_V5_BASE})" >> $GITHUB_ENV
          echo "PACKAGES_ALL=$(echo ${PACKAGES_BASE} ${PACKAGES_V5_BASE})" >> $GITHUB_ENV
          echo "CI_BRANCH=$(echo $GITHUB_REF | cut -d '/' -f 3)" >> $GITHUB_ENV
          echo "CI_SECURE_ENV_VARS=$(if [ -z '${{ secrets.something }}' ]; then echo 'false'; else echo 'true'; fi)" >> $GITHUB_ENV
          echo "CI_EVENT_TYPE=$(if [ 'schedule' == '${{ github.event_name }}' ]; then echo 'cron'; else echo '${{ github.event_name }}'; fi)" >> $GITHUB_ENV
          echo "NPROC=$(nproc)" >> $GITHUB_ENV
          echo "TASK=$(echo '${{matrix.task}}' | cut -d '-' -f 2)" >> $GITHUB_ENV
          echo "INSTALL_ROOT=`pwd`/install_root" >> $GITHUB_ENV
          echo "BUILD_DATE=`date -u '+%Y%m%d'`" >> $GITHUB_ENV
          echo "GIT_REV=`git rev-parse --short HEAD`" >> $GITHUB_ENV

      - name: Set Qt ENV variables (v5)
        if: ${{ endsWith( matrix.task, 'v5') }}
        run: |
          echo "QT=${QT:-$(echo '${{matrix.task}}' | cut -d '-' -f 2)}" >> $GITHUB_ENV
          echo "QT_INSTALL_DIR=/opt" >> $GITHUB_ENV
          echo "QT_VERSION=6.10.2" >> $GITHUB_ENV
          source $GITHUB_ENV && echo "QTDIR=${QT_INSTALL_DIR}/Qt/${QT_VERSION}/gcc_64" >> $GITHUB_ENV

      - name: Print ENV vars
        run: |
          echo "CI_BRANCH: ${CI_BRANCH}"
          echo "CI_PULL_REQUEST: ${CI_PULL_REQUEST}"
          echo "CI_REPO_SLUG: ${CI_REPO_SLUG}"
          echo "CI_EVENT_TYPE: ${CI_EVENT_TYPE}"
          echo "CI_SECURE_ENV_VARS: ${CI_SECURE_ENV_VARS}"
          echo "PACKAGES_V5: ${PACKAGES_V5}"
          echo "TASK: ${TASK}"
          echo "QT: ${QT}"
          echo "NPROC: ${NPROC}"

      - name: Download, cache and install packages
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{env.PACKAGES_ALL}}
          version: ${{runner.os}}-apt

      - name: Install Qt through aqt (and python)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          dir: ${{ env.QT_INSTALL_DIR }}
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets'

      - name: Install python-lxml for fixtures-tool # with the now-registered aqt python
        run: pip install lxml

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.task }}

      - name: Print program versions and username
        run: |
          echo "CXX:"
          ${CXX} --version
          echo "Python:"
          python --version
          echo "WHOAMI:"
          whoami

      - name: Configure for v5 build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QTDIR/lib/cmake/" -Dqmlui=ON -Dappimage=ON -DINSTALL_ROOT=${INSTALL_ROOT} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          sed -i "s/\(#define APPVERSION \".*\)\"/\1 ${{env.GIT_REV}}\"/" engine/src/qlcconfig.h
          cmake --build build --parallel `nproc`

      - name: Test
        run: cmake --build build --target check

      - name: Install
        run: |
          cmake --build build --target install
          cp -v resources/icons/svg/qlcplus.svg ${INSTALL_ROOT}
          cp -v platforms/linux/qlcplus.desktop ${INSTALL_ROOT}
          cp -v $QTDIR/translations/qtbase_* ${INSTALL_ROOT}/share/qlcplus/translations5/

      - name: Set APPVERSION
        run: |
          APPVERSION=$(awk -F\" '/^#define APPVERSION/ {gsub(/ /,"-",$2); print $2}' engine/src/qlcconfig.h)
          echo "APPVERSION=$APPVERSION" >> $GITHUB_ENV

      - name: Adapt qlcplus for AppImage
        run: |
          chrpath -r "../lib" ${INSTALL_ROOT}/usr/bin/qlcplus5
          sed -i -e 's/Exec=qlcplus --open %f/Exec=qlcplus5/g' ${INSTALL_ROOT}/qlcplus.desktop

      - name: Store original install artifacts before stripping and AppImage
        # Activate for debugging
        if: false
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.task }}-files
          path: ${{ env.INSTALL_ROOT }}

      - name: Strip Binaries
        run: |
          strip -v ${INSTALL_ROOT}/usr/bin/qlcplus5
          find ${INSTALL_ROOT}/usr/lib/ -name 'libqlcplus*.so*' -exec strip -v {} \;

      - name: Delete unused files for AppImage
        run: |
          find ${INSTALL_ROOT}/usr/bin/ -name plugins.qmltypes -type f -delete
          find ${INSTALL_ROOT}/usr/bin -name *.qmlc -type f -delete
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Extras QtQuick/Particles.2 QtQuick/XmlListModel
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Controls.2/designer QtQuick/Controls.2/Material
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Controls.2/Universal QtQuick/Controls.2/Fusion
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Controls.2/Imagine QtQuick/Controls.2/Scene2D

      - name: Build AppImage
        run: |
          wget -c https://github.com/AppImage/AppImageKit/releases/download/continuous/AppRun-x86_64 -O ${INSTALL_ROOT}/AppRun
          chmod a+x ${INSTALL_ROOT}/AppRun
          wget -c https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O ./appimagetool-x86_64.AppImage
          chmod a+x ./appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage -v ${INSTALL_ROOT}
          mv -v Q_Light_Controller_Plus_-_QLC+-x86_64.AppImage qlcplus-${{env.TASK}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.AppImage

      - name: Test Load AppImage
        run: |
          ./qlcplus-${{env.TASK}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.AppImage --platform offscreen --version

      - name: Store AppImage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.task }}-AppImage
          path: qlcplus-${{env.TASK}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.AppImage

  build-windows:
    runs-on: windows-latest
    name: QLCplus Windows ${{matrix.task}}
    strategy:
      fail-fast: false
      matrix:
        task: [build-v5]
    env:
      CI_REPO_SLUG: ${{ github.repository }}
      CI_BRANCH: ${{ github.head_ref }}
      CI_PULL_REQUEST: ${{ github.event.number }}
      QT_VERSION: "6.10.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.task }}

      - name: Set ENV variables
        shell: bash
        run: |
          echo "CI_BRANCH=$(echo $GITHUB_REF | cut -d '/' -f 3)" >> $GITHUB_ENV
          echo "CI_SECURE_ENV_VARS=$(if [ -z '${{ secrets.something }}' ]; then echo 'false'; else echo 'true'; fi)" >> $GITHUB_ENV
          echo "CI_EVENT_TYPE=$(if [ 'schedule' == '${{ github.event_name }}' ]; then echo 'cron'; else echo '${{ github.event_name }}'; fi)" >> $GITHUB_ENV
          echo "NPROC=$(nproc)" >> $GITHUB_ENV
          echo "TASK=$(echo '${{matrix.task}}' | cut -d '-' -f 2)" >> $GITHUB_ENV
          echo "QT=${QT:-$(echo '${{matrix.task}}' | cut -d '-' -f 2)}" >> $GITHUB_ENV
          echo "QTDIR=/d/a/qlcplus/qlcplus/qt/Qt/${{ env.QT_VERSION }}/mingw_64" >> $GITHUB_ENV
          echo "BUILD_DATE=`date -u '+%Y%m%d'`" >> $GITHUB_ENV
          echo "GIT_REV=`git rev-parse --short HEAD`" >> $GITHUB_ENV

      - name: Set v5 ENV variables
        shell: bash
        run: |
          echo "OUTFILE=`grep 'OutFile' platforms/windows/qlcplus5Qt6.nsi | cut -d'"' -f 2`" >> $GITHUB_ENV
          echo "NSIS_SCRIPT=qlcplus5Qt6.nsi" >> $GITHUB_ENV

      - name: Print ENV vars
        shell: bash
        run: |
          echo "CI_BRANCH: ${CI_BRANCH}"
          echo "CI_PULL_REQUEST: ${CI_PULL_REQUEST}"
          echo "CI_REPO_SLUG: ${CI_REPO_SLUG}"
          echo "CI_EVENT_TYPE: ${CI_EVENT_TYPE}"
          echo "CI_SECURE_ENV_VARS: ${CI_SECURE_ENV_VARS}"
          echo "TASK: ${TASK}"
          echo "QT: ${QT}"
          echo "NPROC: ${NPROC}"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: "${{ github.workspace }}/qt/"
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets'

      - name: Update and install MSYS2 (64bit)
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          release: true
          update: false
          path-type: inherit
          install: >-
            wget
            unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libmad
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-python-lxml
            mingw-w64-x86_64-nsis

      - name: D2XX SDK (64 bit)
        shell: msys2 {0}
        run: |
          mkdir -p /c/projects/D2XXSDK
          wget https://qlcplus.org/misc/CDM-v2.12.36.20-WHQL-Certified.zip -O /c/projects/D2XXSDK/cdm.zip
          cd /c/projects/D2XXSDK
          unzip cdm.zip
          cd amd64
          gendef.exe - ftd2xx64.dll > ftd2xx.def
          dlltool -k --input-def ftd2xx.def --dllname ftd2xx64.dll --output-lib libftd2xx.a

      - name: Print program versions
        shell: msys2 {0}
        run: |
          echo "pwd:"
          pwd
          echo "CXX:"
          which ${CXX} || true
          ${CXX} -v || true
          echo "cmake:"
          which cmake || true
          cmake --version || true
          pkg-config --modversion libusb-1.0
          echo "ccache:"
          ccache --version || true

      - name: Fix build
        shell: msys2 {0}
        run: |
          # force a release build
          sed -i -e 's/Debug/Release/g' CMakeLists.txt
          # disable Velleman plugin
          sed -i -e 's/    add_subdirectory(velleman)/#    add_subdirectory(velleman)/g' plugins/CMakeLists.txt
          # fix MSYS2 system path
          sed -i -e 's/$ENV{SystemDrive}\/msys64/D:\/a\/_temp\/msys64/g' platforms/windows/CMakeLists.txt
          # fix project path in NSIS script
          sed -i -e 's/c\:\\projects/d:\\a\\qlcplus/g' platforms/windows/${{env.NSIS_SCRIPT}}

      - name: Configure v5 build for Windows
        shell: msys2 {0}
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}/lib/cmake" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -Dqmlui=ON

      - name: Build for Windows
        shell: msys2 {0}
        run: |
          sed -i "s/\(#define APPVERSION \".*\)\"/\1 ${{env.GIT_REV}}\"/" engine/src/qlcconfig.h
          cd build
          ninja

      - name: Test (engine + controlapi)
        shell: msys2 {0}
        run: |
          # Only rgbscripts auto-copies into the build tree (see resources/rgbscripts/
          # CMakeLists.txt); the rest are Android-only-gated, so stage them here too -
          # same set dev-test-run.ps1 stages for local runs.
          for d in colorfilters fixtures gobos icons inputprofiles rgbscripts schemas; do
            mkdir -p build/resources/$d
            cp -r resources/$d/. build/resources/$d/
          done
          # build/engine/src (qlcplusengine.dll) and build/engine/audio must be on PATH,
          # not just the MSYS2/Qt runtime dirs - see CLAUDE.md's "Unit testing
          # (engine/test) - resource paths" section for why this specifically matters.
          # QTDIR/bin (aqt's Qt, a different MinGW build than MSYS2's) is appended, not
          # prepended: these binaries are compiled by MSYS2's gcc, whose newer libstdc++
          # satisfies aqt's older one's symbol versions but not vice versa - prepending
          # QTDIR/bin would shadow the runtime that actually compiled the code.
          export PATH="$PWD/build/engine/src:$PWD/build/engine/audio:$PATH:${{ env.QTDIR }}/bin"
          export QTEST_FUNCTION_TIMEOUT=30000
          cd build
          # TEMPORARY diagnostic for the systemic 0xc0000139 (STATUS_ENTRYPOINT_NOT_FOUND)
          # failure hitting almost every test binary here: only qlcmacros_test and
          # apienvelope_test pass, deterministically, across separate CI runs. ldd's
          # per-import resolved path is the fastest way to see which DLL differs
          # between a failing binary and a passing one under this exact PATH.
          echo "=== PATH ==="
          echo "$PATH"
          echo "=== ldd: engine/test/beattracker/beattracker_test.exe (FAILS) ==="
          ldd engine/test/beattracker/beattracker_test.exe || true
          echo "=== ldd: engine/test/qlcmacros/qlcmacros_test.exe (PASSES) ==="
          ldd engine/test/qlcmacros/qlcmacros_test.exe || true
          echo "=== ldd: controlapi/test/apienvelope/apienvelope_test.exe (PASSES) ==="
          ldd controlapi/test/apienvelope/apienvelope_test.exe || true
          # -j1: parallel runs of these WIN32-subsystem QTest binaries have shown a
          # heap-corruption crash (STATUS_HEAP_CORRUPTION) in this Qt/MinGW build -
          # see dev-test-run.ps1's own comment on this.
          ctest -j1 --output-on-failure --timeout 60

      - name: Test (qmlui/test)
        shell: msys2 {0}
        run: |
          # qmlui/test/*'s QTest suites are deliberately not wired into CTest (see
          # CLAUDE.md's "Unit testing (qmlui/test)" section for why) - run each built
          # binary directly instead, same as this project's own documented convention.
          set +e
          export PATH="$PWD/build/engine/src:$PWD/build/engine/audio:$PATH:${{ env.QTDIR }}/bin"
          shopt -s nullglob
          exes=(build/qmlui/test/*/*_test.exe)
          if [ ${#exes[@]} -eq 0 ]; then
            echo "No qmlui/test binaries found under build/qmlui/test/*/*_test.exe - the build must have failed to produce any."
            exit 1
          fi
          echo "Found ${#exes[@]} qmlui/test binaries."
          overall=0
          for exe in "${exes[@]}"; do
            name=$(basename "$exe" .exe)
            dir=$(dirname "$exe")
            base=$(basename "$exe")
            echo "=== Running $name ==="
            ( cd "$dir" && "./$base" -o "${name}-result.txt,txt" )
            status=$?
            if [ -f "$dir/${name}-result.txt" ]; then
              cat "$dir/${name}-result.txt"
            else
              echo "(no result file - binary likely crashed before QTestLib could write it)"
            fi
            if [ $status -ne 0 ]; then
              echo "==> $name FAILED (exit $status)"
              overall=1
            fi
          done
          exit $overall

      - name: Install on Windows
        shell: msys2 {0}
        run: |
          cd build
          ninja install

      - name: Set APPVERSION
        shell: msys2 {0}
        run: |
          APPVERSION=$(awk -F\" '/^#define APPVERSION/ {gsub(/ /,"-",$2); print $2}' engine/src/qlcconfig.h)
          echo "APPVERSION=$APPVERSION" >> $GITHUB_ENV

      - name: Run windeployqt for v5
        shell: msys2 {0}
        run: |-
          SRC_DIR=$PWD
          ./translate.sh release qmlui
          cp *.qm /c/qlcplus
          cd /c/qlcplus
          ${{ env.QTDIR }}/bin/windeployqt --qmldir $SRC_DIR/qmlui/qml qlcplus5.exe qlcplusengine.dll plugins/dmxusb.dll

      - name: Build installation package
        shell: msys2 {0}
        run: |
          cd /c/qlcplus
          echo 'Creating package...'
          makensis -X'SetCompressor /FINAL lzma' ${{env.NSIS_SCRIPT}}
          mv /c/qlcplus/${{env.OUTFILE}} /d/a/qlcplus/qlcplus/${{matrix.task}}-${{env.OUTFILE}}

      - name: Store executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: QLC+-${{matrix.task}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.exe
          path: ${{matrix.task}}-${{env.OUTFILE}}

      # Fixed name (unlike the dynamically-named artifact above) so the
      # release workflow can find the v5/qmlui installer without knowing the
      # per-run APPVERSION/BUILD_DATE/GIT_REV values.
      - name: Store executable artifact under a fixed name for the release workflow
        if: ${{ matrix.task == 'build-v5' }}
        uses: actions/upload-artifact@v7
        with:
          name: qlcplus5-windows-installer
          path: ${{matrix.task}}-${{env.OUTFILE}}

  build-macos:
    runs-on: macos-15
    name: QLCplus macOS ${{matrix.task}}
    strategy:
      fail-fast: false
      matrix:
        task: [build-v5]
    env:
      CI_REPO_SLUG: ${{ github.repository }}
      CI_BRANCH: ${{ github.head_ref }}
      CI_PULL_REQUEST: ${{ github.event.number }}
      QT_VERSION: "6.10.2"
      MACOS_KEYCHAIN: build.keychain
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set ENV variables
        shell: bash
        run: |
          echo "BUILD_DATE=`date -u '+%Y%m%d'`" >> $GITHUB_ENV
          echo "GIT_REV=`git rev-parse --short HEAD`" >> $GITHUB_ENV
          echo "QTDIR=${{ github.workspace }}/qt/Qt/${{ env.QT_VERSION }}/macos" >> $GITHUB_ENV
          echo "NPROC=`sysctl -n hw.ncpu`" >> $GITHUB_ENV

      - name: Print ENV vars
        shell: bash
        run: |
          echo "CI_BRANCH: ${CI_BRANCH}"
          echo "CI_PULL_REQUEST: ${CI_PULL_REQUEST}"
          echo "CI_REPO_SLUG: ${CI_REPO_SLUG}"
          echo "CI_EVENT_TYPE: ${CI_EVENT_TYPE}"
          echo "CI_SECURE_ENV_VARS: ${CI_SECURE_ENV_VARS}"
          echo "TASK: ${TASK}"
          echo "QTDIR: ${QTDIR}"
          echo "NPROC: ${NPROC}"

      - name: Dependencies
        run: |
          brew update
          brew install fftw mad libsndfile libftdi
          brew link --overwrite python@3.14

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          dir: "${{ github.workspace }}/qt/"
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets'

      - name: Import macOS signing certificate
        shell: bash
        if: false # ${{ env.MACOS_CERT_P12 != '' && env.MACOS_CODESIGN_IDENTITY != '' }}
        run: |
          echo "${MACOS_CERT_P12}" | base64 --decode > /tmp/macos_cert.p12
          security create-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${MACOS_KEYCHAIN}"
          security default-keychain -s "${MACOS_KEYCHAIN}"
          security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${MACOS_KEYCHAIN}"
          security import /tmp/macos_cert.p12 -k "${MACOS_KEYCHAIN}" -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "${MACOS_KEYCHAIN_PASSWORD}" "${MACOS_KEYCHAIN}"
          rm -f /tmp/macos_cert.p12

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.task }}

      - name: Configure v5 build
        shell: bash
        run: |-
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}/lib/cmake" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -Dqmlui=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        shell: bash
        run: |-
          sed -i '' "s/\(#define APPVERSION \".*\)\"/\1 ${{env.GIT_REV}}\"/" engine/src/qlcconfig.h
          cd build
          make -j${{ env.NPROC }}

      - name: Test (engine + controlapi)
        shell: bash
        run: |-
          # Only rgbscripts auto-copies into the build tree (see resources/rgbscripts/
          # CMakeLists.txt); the rest are Android-only-gated, so stage them here too.
          for d in colorfilters fixtures gobos icons inputprofiles rgbscripts schemas; do
            mkdir -p build/resources/$d
            cp -r resources/$d/. build/resources/$d/
          done
          # Build-tree binaries should already carry a working rpath to libqlcplusengine
          # (CMAKE_SKIP_BUILD_RPATH is CMake's default off) - DYLD_LIBRARY_PATH here is
          # a defensive fallback, not a known-required fix like on Windows.
          export DYLD_LIBRARY_PATH="$PWD/build/engine/src:$PWD/build/engine/audio:$DYLD_LIBRARY_PATH"
          export QTEST_FUNCTION_TIMEOUT=30000
          cd build
          ctest -j1 --output-on-failure --timeout 60

      - name: Test (qmlui/test)
        shell: bash
        run: |-
          # qmlui/test/*'s QTest suites are deliberately not wired into CTest (see
          # CLAUDE.md's "Unit testing (qmlui/test)" section) - run each built binary
          # directly instead.
          set +e
          export DYLD_LIBRARY_PATH="$PWD/build/engine/src:$PWD/build/engine/audio:$DYLD_LIBRARY_PATH"
          shopt -s nullglob
          exes=(build/qmlui/test/*/*_test)
          if [ ${#exes[@]} -eq 0 ]; then
            echo "No qmlui/test binaries found under build/qmlui/test/*/*_test - the build must have failed to produce any."
            exit 1
          fi
          echo "Found ${#exes[@]} qmlui/test binaries."
          overall=0
          for exe in "${exes[@]}"; do
            name=$(basename "$exe")
            dir=$(dirname "$exe")
            echo "=== Running $name ==="
            ( cd "$dir" && "./$name" -o "${name}-result.txt,txt" )
            status=$?
            if [ -f "$dir/${name}-result.txt" ]; then
              cat "$dir/${name}-result.txt"
            else
              echo "(no result file - binary likely crashed before QTestLib could write it)"
            fi
            if [ $status -ne 0 ]; then
              echo "==> $name FAILED (exit $status)"
              overall=1
            fi
          done
          exit $overall

      - name: Install
        shell: bash
        run: |-
          cd build
          make install/fast

      - name: Set APPVERSION
        shell: bash
        run: |-
          APPVERSION=$(awk -F\" '/^#define APPVERSION/ {gsub(/ /,"-",$2); print $2}' engine/src/qlcconfig.h)
          echo "APPVERSION=$APPVERSION" >> $GITHUB_ENV

      - name: Fix v5 dylib dependencies
        shell: bash
        run: |-
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/Frameworks/libsndfile.1.dylib
          platforms/macos/fix_dylib_deps.sh ~/QLC+.app/Contents/MacOS/qlcplus5
          ${{ env.QTDIR }}/bin/macdeployqt ~/QLC+.app -qmldir=qmlui/qml

      - name: Create DMG
        # Use retry loop to work around a race condition on macOS causing
        # 'Resource busy' errors with 'hdiutil'. See
        # https://github.com/actions/runner-images/issues/7522
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 12
          retry_wait_seconds: 1
          command: |
            OUTDIR=$PWD
            cd platforms/macos/dmg
            ./create-dmg --volname "Q Light Controller Plus ${{env.APPVERSION}}" \
            --volicon $OUTDIR/resources/icons/qlcplus.icns \
            --background background.png \
            --window-size 400 300 \
            --window-pos 200 100 \
            --icon-size 64 \
            --icon "QLC+" 0 150 \
            --app-drop-link 200 150 \
            $OUTDIR/QLC+_${{ matrix.task }}.dmg \
            ~/QLC+.app

      - name: Notarize and staple DMG
        shell: bash
        if: false # ${{ env.MACOS_NOTARY_KEY_P8 != '' }}
        run: |-
          DMG_PATH="QLC+_${{ matrix.task }}.dmg"
          echo "${MACOS_NOTARY_KEY_P8}" > /tmp/AuthKey.p8
          xcrun notarytool submit \
            --key /tmp/AuthKey.p8 \
            --key-id "${MACOS_NOTARY_KEY_ID}" \
            --issuer "${MACOS_NOTARY_ISSUER}" \
            --wait "${DMG_PATH}"
          xcrun stapler staple "${DMG_PATH}"
          rm -f /tmp/AuthKey.p8

      - name: Store DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: QLC+-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.dmg
          path: QLC+_${{ matrix.task }}.dmg
