name: QLCplus GitHub Release

on:
  workflow_run:
    workflows: ["QLCplus Github Actions CI Build"]
    types: [completed]

concurrency: release-please

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  release-please:
    name: Create GitHub Release
    # `event == 'push'` is required in addition to `head_branch == 'master'`:
    # build.yml also runs on pull_request, and a PR opened from a fork whose
    # own default branch is also called `master` would otherwise match too.
    #
    # Staying on workflow_run (rather than release-please's usual `on: push`)
    # is deliberate: all three platform installers are hard-required release
    # assets, and the only moment they're guaranteed to exist for a given
    # commit is after that commit's own CI build has succeeded. Running
    # release-please directly on push would let it cut a release for a merge
    # commit whose build later fails, publishing a release with no installers
    # and no way to retry (workflow_run only fires once). The cost: grooming
    # the release PR lags behind CI by a full build, and a failed build on
    # the merge commit delays the actual release until the next green build
    # (release-please re-scans from scratch each run, so it self-heals).
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    steps:
      # Downloaded before release-please runs (rather than after) so a
      # download failure fails the job before any tag/release is created -
      # release-please only lets one release be created per new Conventional
      # Commit, so a failure discovered afterwards (e.g. a missing installer)
      # would leave a published release permanently missing a required
      # asset.
      - name: Download Windows installer from the triggering CI run
        uses: actions/download-artifact@v7
        with:
          name: qlcplus5-windows-installer
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Download Linux AppImage from the triggering CI run
        uses: actions/download-artifact@v7
        with:
          name: qlcplus5-linux-appimage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Download macOS DMG from the triggering CI run
        uses: actions/download-artifact@v7
        with:
          name: qlcplus5-macos-dmg
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}

      - name: Attach platform installers to the release
        # `release.outputs.sha` must match the commit this run actually
        # built: release-please always re-evaluates from the tip of master,
        # so if this build's commit was the one just released, they'll
        # agree; if an earlier merge commit's build had failed and this is
        # the next green build to catch up, they won't, and the installers
        # for the actually-released commit are attached by a later run
        # instead (or manually, if no later build exists).
        if: >-
          steps.release.outputs.release_created &&
          steps.release.outputs.sha == github.event.workflow_run.head_sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" release-assets/* --repo "${{ github.repository }}"
